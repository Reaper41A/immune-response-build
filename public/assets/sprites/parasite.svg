<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="-150 -150 300 300">
  <defs>
    <radialGradient id="parasiteGradient" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffd9ad"/>
      <stop offset="55%" stop-color="#ff9f5a"/>
      <stop offset="100%" stop-color="#8f5228"/>
    </radialGradient>
    <radialGradient id="innerGlowGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff3df"/>
      <stop offset="55%" stop-color="#ffd9ad"/>
      <stop offset="100%" stop-color="#ff9f5a"/>
    </radialGradient>
    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      /* Parasite — elite buff-aura unit. Tendrils sway slowly/asynchronously,
         inner-glow pulses independently of body breathing (the "engine").
         Critical = engine flickers/erratic rather than smooth (failing).
         Buff-motes pulse along their tendrils in sequence — full per-mote
         travel-along-path is JS-driven (see svgFX.js), CSS here handles the
         glow/emphasis layer. Death: core implodes FIRST, then tendrils go
         limp and fade — two-stage, not simultaneous. No attack state. */
      #parasite{transform-origin:0 0}
      #aura{animation:paraAura 4.5s ease-in-out infinite}
      #tendril-1{animation:paraTendril1 3.4s ease-in-out infinite}
      #tendril-2{animation:paraTendril2 3.8s ease-in-out infinite .4s}
      #tendril-3{animation:paraTendril3 3.2s ease-in-out infinite .8s}
      #tendril-4{animation:paraTendril4 4s ease-in-out infinite 1.2s}
      #tendril-5{animation:paraTendril5 3.6s ease-in-out infinite 1.6s}
      #core-mass{transform-box:fill-box;transform-origin:center;animation:paraCoreBreathe 3.6s ease-in-out infinite}
      #inner-glow{animation:paraGlowPulse 2.2s ease-in-out infinite}
      #mote-set-1{animation:paraMote 2.6s ease-in-out infinite}
      #mote-set-2{animation:paraMote 2.6s ease-in-out infinite .5s}
      #mote-set-3{animation:paraMote 2.6s ease-in-out infinite 1s}
      #mote-set-4{animation:paraMote 2.6s ease-in-out infinite 1.5s}
      #mote-set-5{animation:paraMote 2.6s ease-in-out infinite 2s}
      .damage-flash{opacity:0;pointer-events:none}

      #parasite.state-move #tendril-1,#parasite.state-move #tendril-2,#parasite.state-move #tendril-3,
      #parasite.state-move #tendril-4,#parasite.state-move #tendril-5{animation-duration:1.8s}

      #parasite.buffing #mote-set-1,#parasite.buffing #mote-set-2,#parasite.buffing #mote-set-3,
      #parasite.buffing #mote-set-4,#parasite.buffing #mote-set-5{animation:paraMoteBurst 1.4s ease-out infinite}
      #parasite.buffing #inner-glow{animation:paraGlowSurge 1.4s ease-in-out infinite}

      #parasite.state-hit #core-mass{animation:paraHit .22s ease-out}
      #parasite.state-hit #inner-glow{animation:paraGlowHit .22s ease-out}
      #parasite.state-hit .damage-flash{animation:paraFlash .2s ease-out}

      #parasite.state-critical #inner-glow{animation:paraGlowFlicker .18s steps(2) infinite}
      #parasite.state-critical #core-mass{animation:paraCriticalWobble .5s ease-in-out infinite}

      #parasite.state-death #core-mass{animation:paraImplode .35s ease-in forwards}
      #parasite.state-death #inner-glow{animation:paraImplodeGlow .35s ease-in forwards}
      #parasite.state-death #tendril-1{animation:paraLimp1 .8s ease-out forwards .3s}
      #parasite.state-death #tendril-2{animation:paraLimp2 .8s ease-out forwards .35s}
      #parasite.state-death #tendril-3{animation:paraLimp3 .8s ease-out forwards .4s}
      #parasite.state-death #tendril-4{animation:paraLimp4 .8s ease-out forwards .45s}
      #parasite.state-death #tendril-5{animation:paraLimp5 .8s ease-out forwards .5s}
      #parasite.state-death #buff-motes,#parasite.state-death #aura{animation:paraFadeOut .5s ease-out forwards .3s}

      @keyframes paraAura{0%,100%{opacity:.1;transform:scale(.97)}50%{opacity:.16;transform:scale(1.04)}}
      @keyframes paraTendril1{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
      @keyframes paraTendril2{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3.5deg)}}
      @keyframes paraTendril3{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2.5deg)}}
      @keyframes paraTendril4{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
      @keyframes paraTendril5{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3.5deg)}}
      @keyframes paraCoreBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
      @keyframes paraGlowPulse{0%,100%{opacity:.75}50%{opacity:1}}
      @keyframes paraMote{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
      @keyframes paraMoteBurst{0%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.6)}100%{opacity:.3;transform:scale(.8)}}
      @keyframes paraGlowSurge{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
      @keyframes paraHit{0%{transform:scale(1)}35%{transform:scale(1.1,.88)}100%{transform:scale(1)}}
      @keyframes paraGlowHit{0%,100%{opacity:.8}50%{opacity:.3}}
      @keyframes paraFlash{0%,100%{opacity:0}22%{opacity:.85}}
      @keyframes paraGlowFlicker{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes paraCriticalWobble{0%,100%{transform:scale(1,.98)}50%{transform:scale(1.05,1.02)}}
      @keyframes paraImplode{0%{transform:scale(1);opacity:1}100%{transform:scale(.1);opacity:0}}
      @keyframes paraImplodeGlow{0%{opacity:1;transform:scale(1)}40%{opacity:1;transform:scale(1.8)}100%{opacity:0;transform:scale(.05)}}
      @keyframes paraLimp1{0%{transform:rotate(0);opacity:1}100%{transform:rotate(20deg) translate(-8px,10px);opacity:0}}
      @keyframes paraLimp2{0%{transform:rotate(0);opacity:1}100%{transform:rotate(-18deg) translate(8px,10px);opacity:0}}
      @keyframes paraLimp3{0%{transform:rotate(0);opacity:1}100%{transform:rotate(22deg) translate(6px,8px);opacity:0}}
      @keyframes paraLimp4{0%{transform:rotate(0);opacity:1}100%{transform:rotate(-16deg) translate(4px,-6px);opacity:0}}
      @keyframes paraLimp5{0%{transform:rotate(0);opacity:1}100%{transform:rotate(18deg) translate(-6px,-8px);opacity:0}}
      @keyframes paraFadeOut{0%{opacity:1}100%{opacity:0}}
    </style>
  </defs>

  <g id="parasite" transform-origin="0 0">

    <!-- Wide buff-radius aura anchor -->
    <ellipse id="aura" cx="0" cy="0" rx="116" ry="103"
      fill="#ffd9ad" opacity="0.12" filter="url(#auraBlur)"/>

    <!-- Long reaching limbs: deliberately organic, curling and asymmetric -->
    <g id="tendrils">
      <g id="tendril-1" transform-box="fill-box" transform-origin="center">
        <path d="M -22,-18 C -48,-35 -65,-48 -74,-67 C -82,-82 -76,-94 -62,-90"
          fill="none" stroke="#ff9f5a" stroke-width="8" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.86"/>
        <circle cx="-62" cy="-90" r="4.2" fill="#ffd9ad" opacity="0.8"/>
      </g>
      <g id="tendril-2" transform-box="fill-box" transform-origin="center">
        <path d="M 18,-20 C 37,-38 48,-57 45,-76 C 43,-88 52,-96 64,-91"
          fill="none" stroke="#ff9f5a" stroke-width="7.5" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.84"/>
        <circle cx="64" cy="-91" r="4" fill="#ffd9ad" opacity="0.8"/>
      </g>
      <g id="tendril-3" transform-box="fill-box" transform-origin="center">
        <path d="M 29,-2 C 55,-7 75,-5 87,7 C 97,17 92,29 79,31"
          fill="none" stroke="#ff9f5a" stroke-width="8" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.86"/>
        <circle cx="79" cy="31" r="4.2" fill="#ffd9ad" opacity="0.82"/>
      </g>
      <g id="tendril-4" transform-box="fill-box" transform-origin="center">
        <path d="M 20,21 C 39,41 49,59 40,76 C 34,87 42,96 55,96"
          fill="none" stroke="#ff9f5a" stroke-width="7.5" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.84"/>
        <circle cx="55" cy="96" r="4" fill="#ffd9ad" opacity="0.8"/>
      </g>
      <g id="tendril-5" transform-box="fill-box" transform-origin="center">
        <path d="M -21,18 C -45,27 -62,39 -67,56 C -71,69 -64,78 -51,77"
          fill="none" stroke="#ff9f5a" stroke-width="8" stroke-linecap="round"
          stroke-linejoin="round" opacity="0.86"/>
        <circle cx="-51" cy="77" r="4.2" fill="#ffd9ad" opacity="0.8"/>
      </g>
    </g>

    <!-- Energy motes along the feeding paths -->
    <g id="buff-motes">
      <g id="mote-set-1" fill="#ffd9ad">
        <circle cx="-45" cy="-43" r="3.2"/><circle cx="-62" cy="-65" r="2.5"/>
      </g>
      <g id="mote-set-2" fill="#ffd9ad">
        <circle cx="34" cy="-45" r="3.1"/><circle cx="45" cy="-68" r="2.4"/>
      </g>
      <g id="mote-set-3" fill="#ffd9ad">
        <circle cx="57" cy="-1" r="3.2"/><circle cx="75" cy="10" r="2.4"/>
      </g>
      <g id="mote-set-4" fill="#ffd9ad">
        <circle cx="38" cy="45" r="3.1"/><circle cx="45" cy="68" r="2.4"/>
      </g>
      <g id="mote-set-5" fill="#ffd9ad">
        <circle cx="-43" cy="35" r="3.2"/><circle cx="-60" cy="55" r="2.4"/>
      </g>
    </g>

    <!-- Semi-transparent central feeding mass -->
    <g id="core-mass" transform-box="fill-box" transform-origin="center">
      <path id="core-shape"
        d="M -34,-11
           C -38,-34 -20,-51 2,-48
           C 27,-50 46,-34 44,-10
           C 52,10 37,32 20,38
           C 5,48 -17,40 -28,27
           C -45,18 -48,0 -34,-11 Z"
        fill="url(#parasiteGradient)" opacity="0.80"
        stroke="#8f5228" stroke-width="2.4" stroke-linejoin="round"/>

      <path id="core-highlight"
        d="M -25,-24 C -13,-40 7,-42 21,-32 C 29,-26 31,-19 31,-13"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" opacity="0.24"/>
    </g>

    <!-- Internal engine: intentionally visible through translucent body -->
    <g id="inner-glow" transform-box="fill-box" transform-origin="center">
      <circle cx="0" cy="0" r="22"
        fill="url(#innerGlowGradient)" opacity="0.26" filter="url(#glowBlur)"/>
      <circle cx="0" cy="0" r="12"
        fill="#ffd9ad" opacity="0.55"/>
      <circle cx="-4" cy="-5" r="4.2"
        fill="#fff3df" opacity="0.88"/>
    </g>

    <!-- Renderer-controlled damage flash -->
    <path id="damage-flash"
      d="M -34,-11
         C -38,-34 -20,-51 2,-48
         C 27,-50 46,-34 44,-10
         C 52,10 37,32 20,38
         C 5,48 -17,40 -28,27
         C -45,18 -48,0 -34,-11 Z"
      fill="#ffffff" opacity="0"/>
  </g>
</svg>

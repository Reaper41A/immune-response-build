<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="-90 -90 180 180">
  <defs>
    <radialGradient id="bcellGradient" cx="32%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#fff4c7"/>
      <stop offset="55%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#9a6f20"/>
    </radialGradient>
    <radialGradient id="healCore" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff4c7"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </radialGradient>
    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      /* B-Cell (Support) — soft, warm, glowing from within even at rest.
         Heal Burst (special/ability): membrane "opens" (inner-glow expands
         hard), antibody nodules flash outward, aura pulses in an expanding
         ring — approximates the brief's "glowing structure launches
         outward, expanding pulse" using the existing geometry; the renderer
         layers its own particle burst on top via the existing 'heal' event.
         #facing-indicator rotation set inline by JS from p.f. */
      #bcell{transform-origin:0 0}
      #aura{animation:bcellAura 2.8s ease-in-out infinite}
      #body{transform-box:fill-box;transform-origin:center;animation:bcellBreathe 2.4s ease-in-out infinite}
      #inner-glow{animation:bcellGlow 1.6s ease-in-out infinite}
      #antibody-1{animation:bcellNodule 2.6s ease-in-out infinite}
      #antibody-2{animation:bcellNodule 2.6s ease-in-out infinite .3s}
      #antibody-3{animation:bcellNodule 2.6s ease-in-out infinite .6s}
      #antibody-4{animation:bcellNodule 2.6s ease-in-out infinite .9s}
      .damage-flash{opacity:0;pointer-events:none}

      #bcell.state-move #body{animation:bcellBreathe 1.2s ease-in-out infinite}

      #bcell.ability-active #inner-glow{animation:bcellHealBurst .7s cubic-bezier(.2,.8,.3,1)}
      #bcell.ability-active #aura{animation:bcellHealRing .7s ease-out}
      #bcell.ability-active #antibody-1,#bcell.ability-active #antibody-2,
      #bcell.ability-active #antibody-3,#bcell.ability-active #antibody-4{animation:bcellNoduleFlash .5s ease-out}

      #bcell.state-hit #body{animation:bcellHit .18s ease-out}
      #bcell.state-hit .damage-flash{animation:bcellFlash .18s ease-out}

      @keyframes bcellAura{0%,100%{opacity:.19;transform:scale(.97)}50%{opacity:.3;transform:scale(1.04)}}
      @keyframes bcellBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.98)}}
      @keyframes bcellGlow{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
      @keyframes bcellNodule{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
      @keyframes bcellHealBurst{0%{transform:scale(1);opacity:.85}40%{transform:scale(2.2);opacity:1}100%{transform:scale(1);opacity:.85}}
      @keyframes bcellHealRing{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.6)}100%{opacity:.2;transform:scale(1)}}
      @keyframes bcellNoduleFlash{0%{opacity:.8;transform:scale(1)}40%{opacity:1;transform:scale(1.8)}100%{opacity:.8;transform:scale(1)}}
      @keyframes bcellHit{0%{transform:scale(1)}35%{transform:scale(1.08,.92)}100%{transform:scale(1)}}
      @keyframes bcellFlash{0%,100%{opacity:0}22%{opacity:.85}}
    </style>
  </defs>

  <g id="bcell" transform-origin="0 0">

    <!-- Warm supportive emission -->
    <path id="aura"
      d="M -61,-2
         C -55,-33 -30,-53 0,-55
         C 30,-56 55,-37 62,-9
         C 69,18 53,45 29,55
         C 4,66 -28,59 -47,42
         C -63,27 -68,12 -61,-2 Z"
      fill="#ffd166" opacity="0.22" filter="url(#auraBlur)"/>

    <!-- Soft membrane with a gentle, almost heart-like asymmetry -->
    <g id="body" transform-box="fill-box" transform-origin="center">
      <path id="body-shape"
        d="M -42,-10
           C -48,-27 -36,-45 -19,-50
           C -6,-56 7,-50 15,-43
           C 32,-46 47,-34 48,-17
           C 58,-4 51,15 39,24
           C 34,42 17,51 1,46
           C -14,53 -32,45 -38,30
           C -53,22 -55,3 -42,-10 Z"
        fill="url(#bcellGradient)"
        stroke="#9a6f20" stroke-width="2.4"
        stroke-linejoin="round"/>

      <!-- Soft membrane folds -->
      <path d="M -30,-22 C -22,-40 -5,-45 10,-39"
        fill="none" stroke="#fff4c7" stroke-width="4"
        stroke-linecap="round" opacity="0.34"/>
      <path d="M 27,-31 C 39,-22 42,-9 38,2"
        fill="none" stroke="#9a6f20" stroke-width="4"
        stroke-linecap="round" opacity="0.18"/>

      <!-- Clearly visible internal healing warmth -->
      <g id="inner-glow" transform-box="fill-box" transform-origin="center">
        <ellipse cx="0" cy="3" rx="22" ry="21"
          fill="url(#healCore)" opacity="0.34" filter="url(#glowBlur)"/>
        <ellipse cx="0" cy="3" rx="13" ry="13"
          fill="#fff4c7" opacity="0.36"/>
        <path d="M -10,3 C -4,-5 5,-6 11,1 C 5,8 -4,10 -10,3 Z"
          fill="#ffffff" opacity="0.46"/>
        <circle cx="-4" cy="-3" r="3.5" fill="#ffffff" opacity="0.52"/>
      </g>
    </g>

    <!-- Antibody structures: distinct Y-shaped surface markers -->
    <g id="antibody-nodules" transform-box="fill-box" transform-origin="center">
      <g id="antibody-1" transform-box="fill-box" transform-origin="center">
        <path d="M -25,-35 L -25,-27 M -25,-31 L -31,-36 M -25,-31 L -19,-36"
          fill="none" stroke="#fff4c7" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="antibody-2" transform-box="fill-box" transform-origin="center">
        <path d="M 30,-20 L 30,-12 M 30,-16 L 24,-21 M 30,-16 L 36,-21"
          fill="none" stroke="#fff4c7" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="antibody-3" transform-box="fill-box" transform-origin="center">
        <path d="M 27,25 L 27,33 M 27,29 L 21,24 M 27,29 L 33,24"
          fill="none" stroke="#fff4c7" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="antibody-4" transform-box="fill-box" transform-origin="center">
        <path d="M -27,27 L -27,35 M -27,31 L -33,26 M -27,31 L -21,26"
          fill="none" stroke="#fff4c7" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Integrated aim cue -->
    <g id="facing-indicator" transform-box="fill-box" transform-origin="left center">
      <path d="M 40,4 L 65,4"
        fill="none" stroke="#fff4c7" stroke-width="3.2"
        stroke-linecap="round" opacity="0.92"/>
      <path d="M 58,-2 L 67,4 L 58,10"
        fill="none" stroke="#fff4c7" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
    </g>

    <!-- Renderer-controlled damage flash -->
    <path id="damage-flash"
      d="M -42,-10
         C -48,-27 -36,-45 -19,-50
         C -6,-56 7,-50 15,-43
         C 32,-46 47,-34 48,-17
         C 58,-4 51,15 39,24
         C 34,42 17,51 1,46
         C -14,53 -32,45 -38,30
         C -53,22 -55,3 -42,-10 Z"
      fill="#ffffff" opacity="0"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg"
     width="440" height="440" viewBox="-220 -220 440 440"
     role="img" aria-labelledby="title desc">
  <title id="title">Living Body Core</title>
  <desc id="desc">A large biological organ-like core with folded membrane, branching vascular tissue, a pulsing inner heart, and a critical warning ring.</desc>

  <defs>
    <!-- Healthy teal palette from the source specification; the renderer can drive the tissue layer toward dying-red at low HP. -->
    <radialGradient id="shellGradient" cx="34%" cy="28%" r="73%">
      <stop offset="0%" stop-color="#b9fff1"/>
      <stop offset="38%" stop-color="#58d8c4"/>
      <stop offset="72%" stop-color="#2b8f88"/>
      <stop offset="100%" stop-color="#174e52"/>
    </radialGradient>

    <radialGradient id="tissueGradient" cx="36%" cy="31%" r="70%">
      <stop offset="0%" stop-color="#8ff9e8"/>
      <stop offset="42%" stop-color="#43cdbb"/>
      <stop offset="78%" stop-color="#25857f"/>
      <stop offset="100%" stop-color="#123f45"/>
    </radialGradient>

    <radialGradient id="coreGradient" cx="32%" cy="27%" r="70%">
      <stop offset="0%" stop-color="#d8fff7"/>
      <stop offset="28%" stop-color="#83efe0"/>
      <stop offset="65%" stop-color="#36afa7"/>
      <stop offset="100%" stop-color="#14585d"/>
    </radialGradient>

    <linearGradient id="foldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d6fff7" stop-opacity=".75"/>
      <stop offset="42%" stop-color="#66d8c9" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#123f45" stop-opacity=".65"/>
    </linearGradient>

    <filter id="auraBlur" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>

    <filter id="softBlur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="tinyBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- Organic shell silhouette: deliberately not a perfect circle. -->
    <path id="shell-shape"
      d="M 0 -157
         C 26 -165 55 -154 73 -138
         C 104 -135 130 -112 132 -84
         C 153 -62 157 -30 146 -7
         C 159 18 151 49 133 67
         C 130 99 105 122 78 127
         C 56 150 25 157 1 149
         C -27 158 -57 149 -75 132
         C -107 130 -127 108 -131 79
         C -151 59 -157 29 -145 4
         C -157 -23 -150 -51 -132 -70
         C -130 -101 -107 -124 -79 -129
         C -59 -151 -27 -160 0 -157 Z"/>

    <path id="inner-tissue-shape"
      d="M 0 -126
         C 26 -135 49 -126 67 -111
         C 94 -108 112 -88 113 -62
         C 133 -40 132 -12 121 7
         C 132 29 123 54 106 68
         C 102 93 80 108 57 111
         C 38 129 12 132 -7 122
         C -32 131 -57 120 -69 105
         C -94 102 -108 82 -110 61
         C -129 43 -130 18 -119 -3
         C -129 -25 -120 -49 -105 -64
         C -102 -89 -82 -106 -59 -109
         C -43 -127 -19 -132 0 -126 Z"/>

    <clipPath id="tissueClip">
      <use href="#inner-tissue-shape"/>
    </clipPath>

    <clipPath id="shellClip">
      <use href="#shell-shape"/>
    </clipPath>
  </defs>

  <style>
    /* Body Core — the thing every player defends the whole match, so it gets
       the most generous idle treatment in the roster: a genuine two-beat
       heartbeat (lub-dub) rather than a single sine pulse. #health-tissue's
       color is NOT animated here — JS lerps its fill toward the sick palette
       continuously every frame based on bodyHp/bodyHpMax (see comment in the
       SVG itself: "renderer can recolor/lerp this layer"), same for
       #sickness-texture opacity which JS fades in below ~50% HP. This file
       only owns the heartbeat rhythm, hit reaction, critical-ring activation,
       and the one-time destroyed sequence for game over. */
    #body-core{transform-origin:0 0}
    #aura{animation:coreAuraBeat 1.15s ease-in-out infinite}
    #aura-heartbeat{animation:coreAuraSecondBeat 1.15s ease-in-out infinite}
    #core-heart{transform-box:fill-box;transform-origin:center;animation:coreHeartBeat 1.15s ease-in-out infinite}
    #core-glow{animation:coreGlowBeat 1.15s ease-in-out infinite}
    #core-nucleus{animation:coreNucleusBeat 1.15s ease-in-out infinite}
    #vein-node-1{animation:coreVeinPulse 1.15s ease-in-out infinite}
    #vein-node-2{animation:coreVeinPulse 1.15s ease-in-out infinite .08s}
    #vein-node-3{animation:coreVeinPulse 1.15s ease-in-out infinite .08s}
    #vein-node-4{animation:coreVeinPulse 1.15s ease-in-out infinite .16s}
    #vein-node-5{animation:coreVeinPulse 1.15s ease-in-out infinite .16s}
    #core-shell{transform-box:fill-box;transform-origin:center;animation:coreShellBreathe 1.15s ease-in-out infinite}
    #core-spokes{animation:coreSpokesDrift 6s ease-in-out infinite}
    #shell-highlight{animation:coreHighlight 5s ease-in-out infinite}
    #damage-flash{opacity:0;pointer-events:none}
    #sickness-texture{transition:opacity .6s ease}
    #critical-warning-ring{opacity:0;transition:opacity .5s ease}

    /* Critical state: JS adds .critical class once bodyHp/bodyHpMax is 30% or below */
    #body-core.critical #core-heart{animation:coreHeartBeatCritical .6s ease-in-out infinite}
    #body-core.critical #aura{animation:coreAuraBeatCritical .6s ease-in-out infinite}
    #body-core.critical #critical-warning-ring{opacity:1;animation:coreRingRotate 8s linear infinite}
    #body-core.critical #critical-ring-outer{animation:coreRingPulse .6s ease-in-out infinite}

    #body-core.state-hit #core-shell{animation:coreHitShudder .24s ease-out}
    #body-core.state-hit #core-heart{animation:coreHitFlinch .24s ease-out}
    #body-core.state-hit #damage-flash{animation:coreHitFlash .24s ease-out}

    /* Destroyed: one-shot sequence for game over, JS adds .destroyed and
       does not remove it (this is a terminal state, unlike death for
       enemies which get pooled/reused). */
    #body-core.destroyed #core-heart{animation:coreDestroyHeart 1.4s cubic-bezier(.4,0,.2,1) forwards}
    #body-core.destroyed #core-shell{animation:coreDestroyShell 1.4s ease-in forwards}
    #body-core.destroyed #core-veins{animation:coreDestroyFade .8s ease-out forwards .3s}
    #body-core.destroyed #core-spokes{animation:coreDestroyFade .6s ease-out forwards .2s}
    #body-core.destroyed #aura,#body-core.destroyed #aura-heartbeat{animation:coreDestroyAuraFlare 1.4s ease-out forwards}
    #body-core.destroyed #critical-warning-ring{animation:coreDestroyFade .4s ease-out forwards}

    @keyframes coreAuraBeat{0%,100%{opacity:.16;transform:scale(.97)}18%{opacity:.3;transform:scale(1.05)}30%{opacity:.16;transform:scale(.98)}45%{opacity:.24;transform:scale(1.03)}}
    @keyframes coreAuraSecondBeat{0%,100%{opacity:.08;transform:scale(.96)}30%{opacity:.08;transform:scale(.96)}42%{opacity:.18;transform:scale(1.04)}55%{opacity:.08;transform:scale(.97)}}
    @keyframes coreHeartBeat{0%,100%{transform:scale(1,1)}18%{transform:scale(1.07,1.09)}30%{transform:scale(.98,.99)}45%{transform:scale(1.04,1.05)}58%{transform:scale(1,1)}}
    @keyframes coreGlowBeat{0%,100%{opacity:.18}18%{opacity:.4}30%{opacity:.18}45%{opacity:.3}58%{opacity:.18}}
    @keyframes coreNucleusBeat{0%,100%{opacity:.36;transform:scale(1)}22%{opacity:.55;transform:scale(1.15)}100%{opacity:.36;transform:scale(1)}}
    @keyframes coreVeinPulse{0%,100%{opacity:.4;transform:scale(1)}20%{opacity:.9;transform:scale(1.6)}100%{opacity:.4;transform:scale(1)}}
    @keyframes coreShellBreathe{0%,100%{transform:scale(1,1)}22%{transform:scale(1.012,1.015)}}
    @keyframes coreSpokesDrift{0%,100%{opacity:.8;transform:rotate(0deg)}50%{opacity:1;transform:rotate(1.2deg)}}
    @keyframes coreHighlight{0%,100%{opacity:.85}50%{opacity:1}}
    @keyframes coreHeartBeatCritical{0%,100%{transform:scale(1,1)}25%{transform:scale(1.1,1.13)}50%{transform:scale(.95,.96)}75%{transform:scale(1.06,1.08)}}
    @keyframes coreAuraBeatCritical{0%,100%{opacity:.2;transform:scale(.96)}50%{opacity:.4;transform:scale(1.08)}}
    @keyframes coreRingRotate{to{transform:rotate(360deg)}}
    @keyframes coreRingPulse{0%,100%{opacity:.6;stroke-width:4}50%{opacity:1;stroke-width:6}}
    @keyframes coreHitShudder{0%{transform:translate(0,0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,1px)}100%{transform:translate(0,0)}}
    @keyframes coreHitFlinch{0%{transform:scale(1)}30%{transform:scale(.92,.96)}100%{transform:scale(1)}}
    @keyframes coreHitFlash{0%,100%{opacity:0}20%{opacity:.55}}
    @keyframes coreDestroyHeart{0%{transform:scale(1);opacity:1}30%{transform:scale(1.3,1.35);opacity:1}100%{transform:scale(.05);opacity:0}}
    @keyframes coreDestroyShell{0%{transform:scale(1);opacity:1}40%{transform:scale(1.06,1.04);opacity:1}100%{transform:scale(1.4,.3);opacity:0}}
    @keyframes coreDestroyFade{0%{opacity:1}100%{opacity:0}}
    @keyframes coreDestroyAuraFlare{0%{opacity:.3;transform:scale(1)}25%{opacity:.8;transform:scale(1.5)}100%{opacity:0;transform:scale(3)}}
  </style>

  <g id="body-core" transform-origin="0 0">

    <!-- Renderer-level heartbeat aura -->
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <use href="#shell-shape" fill="#2fd3c1" opacity=".20" filter="url(#auraBlur)"/>
      <ellipse id="aura-heartbeat" cx="0" cy="5" rx="126" ry="111"
               fill="#63e9d7" opacity=".12" filter="url(#auraBlur)"/>
    </g>

    <!-- Deep shadow gives the core physical presence against the arena. -->
    <g id="ambient-shadow" transform-box="fill-box" transform-origin="center">
      <ellipse cx="18" cy="142" rx="94" ry="25"
               fill="#0b292d" opacity=".27" filter="url(#softBlur)"/>
    </g>

    <!-- Outer membrane -->
    <g id="core-shell" transform-box="fill-box" transform-origin="center">
      <use id="shell-shape-render" href="#shell-shape" fill="url(#shellGradient)"/>

      <!-- Thick lower-right membrane / occlusion layer -->
      <path id="membrane-shadow"
        d="M -112 71 C -82 126 -31 151 7 148 C 55 153 106 121 130 72
           C 104 98 71 113 32 118 C -11 126 -69 112 -112 71 Z"
        fill="#103d43" opacity=".32"/>

      <!-- Folded membrane bands -->
      <g id="membrane-folds" fill="none" stroke-linecap="round">
        <path id="fold-1"
          d="M -116 -48 C -91 -72 -74 -89 -47 -98"
          stroke="url(#foldGradient)" stroke-width="9" opacity=".42"/>
        <path id="fold-2"
          d="M 67 -108 C 91 -94 108 -77 115 -52"
          stroke="url(#foldGradient)" stroke-width="8" opacity=".36"/>
        <path id="fold-3"
          d="M 116 42 C 101 67 82 85 58 96"
          stroke="#0e4a4e" stroke-width="10" opacity=".32"/>
        <path id="fold-4"
          d="M -71 106 C -49 121 -24 126 -3 122"
          stroke="#c9fff6" stroke-width="7" opacity=".18"/>
      </g>

      <!-- Upper-left gloss -->
      <g id="shell-highlight" transform-box="fill-box" transform-origin="center">
        <path d="M -101 -63 C -77 -104 -33 -125 8 -123
                 C -24 -112 -50 -92 -67 -62
                 C -78 -43 -94 -39 -101 -63 Z"
              fill="#e2fff9" opacity=".25" filter="url(#softBlur)"/>
        <path d="M -91 -72 C -70 -96 -43 -109 -19 -114"
              fill="none" stroke="#f0fffc" stroke-width="4"
              stroke-linecap="round" opacity=".38"/>
        <ellipse cx="-54" cy="-91" rx="8" ry="4"
                 fill="#ffffff" opacity=".36" filter="url(#tinyBlur)"/>
      </g>

      <!-- Outer membrane speckles -->
      <g id="membrane-granules" opacity=".28">
        <circle cx="-102" cy="5" r="2.4"/>
        <circle cx="-88" cy="42" r="1.8"/>
        <circle cx="-59" cy="93" r="2.2"/>
        <circle cx="74" cy="-84" r="2"/>
        <circle cx="102" cy="-31" r="1.6"/>
        <circle cx="103" cy="53" r="2.3"/>
        <circle cx="39" cy="109" r="1.8"/>
        <circle cx="-15" cy="-124" r="1.5"/>
      </g>
    </g>

    <!-- Health tissue is a distinct replaceable layer. Renderer can recolor/lerp this layer. -->
    <g id="health-tissue" transform-box="fill-box" transform-origin="center">
      <use href="#inner-tissue-shape" fill="url(#tissueGradient)" opacity=".88"/>

      <!-- Low-HP sickness texture: opacity is 0 until renderer activates it. -->
      <g id="sickness-texture" opacity="0">
        <g id="sick-patches" fill="#7d3948" opacity=".55">
          <path d="M -74 -18 C -63 -30 -46 -28 -40 -18 C -45 -5 -58 3 -72 -2 Z"/>
          <path d="M 45 -74 C 59 -80 73 -70 71 -57 C 61 -51 48 -53 42 -61 Z"/>
          <path d="M 57 45 C 72 37 88 48 87 61 C 76 70 62 65 55 56 Z"/>
          <path d="M -35 75 C -20 67 -6 76 -8 91 C -18 101 -33 97 -41 87 Z"/>
        </g>
        <g id="sick-fissures" fill="none" stroke="#ff6870"
           stroke-width="3" stroke-linecap="round" opacity=".48">
          <path d="M -83 -10 L -67 -2 L -58 13 L -42 17"/>
          <path d="M 33 -93 L 40 -76 L 31 -60 L 38 -43"/>
          <path d="M 91 29 L 75 35 L 66 50 L 48 56"/>
          <path d="M -17 104 L -13 88 L -23 76"/>
        </g>
        <g id="sick-granules" fill="#ff8180" opacity=".4">
          <circle cx="-51" cy="-45" r="3"/>
          <circle cx="-67" cy="51" r="2.5"/>
          <circle cx="22" cy="82" r="3"/>
          <circle cx="72" cy="-16" r="2.4"/>
        </g>
      </g>
    </g>

    <!-- Vascular / structural network -->
    <g id="core-veins" transform-box="fill-box" transform-origin="center"
       fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Major branches -->
      <path id="vein-main"
        d="M -3 105 C -6 76 2 58 0 31
           C -3 8 -14 -8 -12 -31
           C -15 -55 -4 -74 8 -100"
        stroke="#176d6e" stroke-width="6" opacity=".60"/>

      <path id="vein-left"
        d="M -10 42 C -30 31 -42 16 -54 -4
           C -64 -22 -78 -32 -99 -34"
        stroke="#176d6e" stroke-width="5" opacity=".55"/>

      <path id="vein-right"
        d="M -5 23 C 18 18 34 6 48 -11
           C 62 -27 76 -33 98 -30"
        stroke="#176d6e" stroke-width="5" opacity=".55"/>

      <path id="vein-lower-left"
        d="M 1 58 C -18 59 -29 69 -43 84
           C -54 96 -68 99 -83 92"
        stroke="#1c7776" stroke-width="4" opacity=".52"/>

      <path id="vein-lower-right"
        d="M 3 55 C 23 55 35 66 48 80
           C 59 91 72 96 86 88"
        stroke="#1c7776" stroke-width="4" opacity=".52"/>

      <!-- Fine branches -->
      <g id="vein-branches" stroke="#27958c" stroke-width="2.5" opacity=".55">
        <path d="M -54 -4 L -61 14 L -76 24"/>
        <path d="M -62 -23 L -77 -12 L -89 -15"/>
        <path d="M 48 -11 L 55 7 L 70 17"/>
        <path d="M 62 -27 L 76 -45 L 91 -48"/>
        <path d="M -43 84 L -35 99 L -22 108"/>
        <path d="M 48 80 L 41 96 L 30 107"/>
      </g>

      <!-- Traveling vein nodes: independent anchors for heartbeat/light flow. -->
      <g id="vein-nodes" fill="#bffff3">
        <circle id="vein-node-1" cx="-12" cy="-31" r="3.2" opacity=".55"/>
        <circle id="vein-node-2" cx="-54" cy="-4" r="2.8" opacity=".45"/>
        <circle id="vein-node-3" cx="48" cy="-11" r="2.8" opacity=".45"/>
        <circle id="vein-node-4" cx="-43" cy="84" r="2.4" opacity=".42"/>
        <circle id="vein-node-5" cx="48" cy="80" r="2.4" opacity=".42"/>
      </g>
    </g>

    <!-- Central living nucleus / heartbeat source -->
    <g id="core-heart" transform-box="fill-box" transform-origin="center">
      <ellipse id="core-glow" cx="0" cy="2" rx="43" ry="39"
               fill="#9cfff1" opacity=".20" filter="url(#glow)"/>
      <path id="core-organ"
        d="M 0 -45
           C 20 -49 39 -32 38 -10
           C 52 10 39 34 17 37
           C 3 51 -19 44 -25 29
           C -47 24 -51 2 -38 -12
           C -40 -32 -20 -47 0 -45 Z"
        fill="url(#coreGradient)" opacity=".95"/>

      <!-- Heartbeat folds -->
      <path id="core-fold-left"
        d="M -29 -14 C -16 -26 -8 -25 0 -15"
        fill="none" stroke="#dcfff8" stroke-width="4"
        stroke-linecap="round" opacity=".34"/>
      <path id="core-fold-right"
        d="M 8 20 C 19 14 25 6 26 -5"
        fill="none" stroke="#0e575b" stroke-width="5"
        stroke-linecap="round" opacity=".46"/>

      <circle id="core-nucleus" cx="-5" cy="-5" r="10"
              fill="#c9fff7" opacity=".40" filter="url(#softBlur)"/>
      <ellipse id="core-specular" cx="-14" cy="-19" rx="8" ry="4"
               fill="#ffffff" opacity=".52" filter="url(#tinyBlur)"/>
    </g>

    <!-- Rotating structural spokes, replacing the flat spoke-line treatment with organic rods. -->
    <g id="core-spokes" transform-box="fill-box" transform-origin="center"
       fill="none" stroke="#a6f7e9" stroke-linecap="round">
      <path id="spoke-1" d="M 0 -59 C -4 -72 -5 -82 -1 -93"
            stroke-width="3" opacity=".30"/>
      <path id="spoke-2" d="M 51 -29 C 64 -37 73 -42 83 -49"
            stroke-width="2.8" opacity=".28"/>
      <path id="spoke-3" d="M 50 34 C 63 41 70 49 76 59"
            stroke-width="3" opacity=".26"/>
      <path id="spoke-4" d="M -35 50 C -44 62 -52 70 -63 76"
            stroke-width="2.8" opacity=".27"/>
      <path id="spoke-5" d="M -51 -24 C -65 -29 -73 -37 -82 -46"
            stroke-width="2.6" opacity=".25"/>
    </g>

    <!-- Critical ring: renderer can activate this at <=30% body HP. -->
    <g id="critical-warning-ring" transform-box="fill-box" transform-origin="center"
       opacity="0">
      <path id="critical-ring-outer"
        d="M 0 -180
           C 46 -180 91 -162 124 -130
           C 157 -98 176 -52 176 0
           C 176 51 158 98 125 131
           C 91 164 46 180 0 180
           C -47 180 -91 163 -125 131
           C -159 97 -178 51 -178 0
           C -178 -50 -159 -98 -125 -130
           C -91 -163 -47 -180 0 -180 Z"
        fill="none" stroke="#ff6870" stroke-width="4"
        stroke-dasharray="7 12" opacity=".70"/>
      <path id="critical-ring-inner"
        d="M 0 -166 C 43 -166 83 -149 113 -119
           C 144 -89 160 -47 160 0
           C 160 45 143 88 113 119
           C 83 149 43 166 0 166
           C -43 166 -84 149 -113 119
           C -144 88 -160 46 -160 0
           C -160 -47 -144 -89 -113 -119
           C -83 -149 -43 -166 0 -166 Z"
        fill="none" stroke="#ffaaa6" stroke-width="2"
        stroke-dasharray="2 10" opacity=".55"/>
    </g>

    <!-- Dedicated renderer-driven flash. -->
    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#shell-shape" fill="#ffffff"/>
    </g>

  </g>
</svg>

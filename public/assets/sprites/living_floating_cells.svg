<svg xmlns="http://www.w3.org/2000/svg"
     width="640" height="480" viewBox="-320 -240 640 480"
     role="img" aria-labelledby="title desc">
  <title id="title">Living Floating Cell Background Pack</title>
  <desc id="desc">A reusable family of living microscopic cells with translucent membranes, nuclei, organelles, cilia and independently animatable motion parts for an organic background environment.</desc>

  <defs>
    <!-- Neutral biological palette: intentionally subdued so these remain environmental life, not enemies. -->
    <radialGradient id="cellMembrane" cx="33%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#d9fff4" stop-opacity=".62"/>
      <stop offset="38%" stop-color="#8ad9ca" stop-opacity=".44"/>
      <stop offset="73%" stop-color="#4d918d" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#203e4b" stop-opacity=".18"/>
    </radialGradient>

    <radialGradient id="cellInterior" cx="36%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#cafff1" stop-opacity=".48"/>
      <stop offset="45%" stop-color="#69c9bc" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#244a55" stop-opacity=".10"/>
    </radialGradient>

    <radialGradient id="nucleus" cx="30%" cy="27%" r="72%">
      <stop offset="0%" stop-color="#effffb" stop-opacity=".78"/>
      <stop offset="48%" stop-color="#7bc7c1" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#315d68" stop-opacity=".35"/>
    </radialGradient>

    <filter id="cellGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="microBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>

    <filter id="membraneBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Shared irregular silhouettes. These are deliberately asymmetrical, not generic circles. -->
    <path id="cell-a-shape"
      d="M -31 -4
         C -34 -20 -23 -31 -7 -34
         C 8 -40 24 -32 29 -20
         C 42 -13 41 2 34 12
         C 37 27 24 35 11 34
         C 0 42 -16 37 -21 27
         C -35 25 -41 11 -35 1 Z"/>

    <path id="cell-b-shape"
      d="M -26 -12
         C -18 -28 -4 -31 10 -27
         C 26 -29 35 -17 32 -4
         C 43 7 35 22 23 25
         C 16 38 -2 40 -12 30
         C -29 32 -38 19 -33 5
         C -39 -5 -34 -12 -26 -12 Z"/>

    <path id="cell-c-shape"
      d="M -37 1
         C -36 -17 -20 -29 -5 -27
         C 6 -37 24 -31 29 -17
         C 44 -11 45 7 35 16
         C 31 31 16 36 3 31
         C -9 39 -26 31 -27 19
         C -42 16 -45 5 -37 1 Z"/>

    <clipPath id="clip-a"><use href="#cell-a-shape"/></clipPath>
    <clipPath id="clip-b"><use href="#cell-b-shape"/></clipPath>
    <clipPath id="clip-c"><use href="#cell-c-shape"/></clipPath>
  </defs>

  <style>
    /* Living Floating Cells — ambient background pack, three variants + motes.
       Pure loop, no state classes: this is scenery, not gameplay-relevant.
       Variant A: slow drifting immune cell, gentle uniform breathing.
       Variant B: "visibly motile" per the asset's own comment — cilia wave
       in a propulsion rhythm using their pre-set directional transform-origin
       (right/left center), giving real forward-swimming read.
       Variant C: large amoeboid, pseudopods bulge/retract independently,
       vesicles visibly orbit the nucleus via rotating parent groups (their
       own translate() offsets become the orbit radius). */
    #floating-cell-a{transform-origin:0 0}
    #floating-cell-a #aura{animation:cellAAura 5s ease-in-out infinite}
    #floating-cell-a #body{animation:cellABreathe 4.6s ease-in-out infinite}
    #floating-cell-a #nucleus{animation:cellANucleus 3.8s ease-in-out infinite}
    #floating-cell-a #membrane-cilia{animation:cellACilia 3s ease-in-out infinite}
    #floating-cell-a #micro-particles{animation:cellAParticles 4s ease-in-out infinite}
    #floating-cell-a #damage-flash{opacity:0;pointer-events:none}

    #floating-cell-b{transform-origin:0 0}
    #floating-cell-b #aura{animation:cellBAura 3.2s ease-in-out infinite}
    #floating-cell-b #body{animation:cellBGlide 3.6s ease-in-out infinite}
    #floating-cell-b #cilia-left{animation:cellCiliaLeft .9s ease-in-out infinite}
    #floating-cell-b #cilia-right{animation:cellCiliaRight .9s ease-in-out infinite .1s}
    #floating-cell-b #nucleus{animation:cellBNucleus 3s ease-in-out infinite}
    #floating-cell-b #internal-flow{animation:cellBFlow 2.6s ease-in-out infinite}
    #floating-cell-b #damage-flash{opacity:0;pointer-events:none}

    #floating-cell-c{transform-origin:0 0}
    #floating-cell-c #aura{animation:cellCAura 5.5s ease-in-out infinite}
    #floating-cell-c #body{animation:cellCBreathe 5s ease-in-out infinite}
    #floating-cell-c #pseudopod-1{animation:cellCPod1 4.2s ease-in-out infinite}
    #floating-cell-c #pseudopod-2{animation:cellCPod2 4.8s ease-in-out infinite .4s}
    #floating-cell-c #pseudopod-3{animation:cellCPod3 4.4s ease-in-out infinite .8s}
    #floating-cell-c #vesicle-orbit{animation:cellCVesicleOrbit 9s linear infinite}
    #floating-cell-c #nucleus{animation:cellCNucleus 4s ease-in-out infinite}
    #floating-cell-c #damage-flash{opacity:0;pointer-events:none}

    #ambient-motes{transform-origin:0 0}
    #mote-1{animation:moteDrift1 6s ease-in-out infinite}
    #mote-2{animation:moteDrift2 7s ease-in-out infinite .5s}
    #mote-3{animation:moteDrift3 6.5s ease-in-out infinite 1s}
    #mote-4{animation:moteDrift4 7.5s ease-in-out infinite 1.5s}

    @keyframes cellAAura{0%,100%{opacity:.7;transform:scale(.97)}50%{opacity:1;transform:scale(1.05)}}
    @keyframes cellABreathe{0%,100%{transform:scale(1,1) rotate(0deg)}50%{transform:scale(1.02,.98) rotate(1deg)}}
    @keyframes cellANucleus{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes cellACilia{0%,100%{opacity:.85}50%{opacity:1}}
    @keyframes cellAParticles{0%,100%{opacity:.7}50%{opacity:1}}

    @keyframes cellBAura{0%,100%{opacity:.6;transform:scaleX(1)}50%{opacity:.9;transform:scaleX(1.1)}}
    @keyframes cellBGlide{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(2px,-1px) rotate(-1.5deg)}}
    @keyframes cellCiliaLeft{0%,100%{transform:rotate(0deg)}50%{transform:rotate(12deg)}}
    @keyframes cellCiliaRight{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-12deg)}}
    @keyframes cellBNucleus{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    @keyframes cellBFlow{0%,100%{opacity:.75}50%{opacity:1}}

    @keyframes cellCAura{0%,100%{opacity:.7;transform:scale(.98)}50%{opacity:1;transform:scale(1.04)}}
    @keyframes cellCBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.99)}}
    @keyframes cellCPod1{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.15) translate(-1.5px,1px)}}
    @keyframes cellCPod2{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.2) translate(1px,-1.5px)}}
    @keyframes cellCPod3{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.12) translate(.5px,1.5px)}}
    @keyframes cellCVesicleOrbit{to{transform:rotate(360deg)}}
    @keyframes cellCNucleus{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

    @keyframes moteDrift1{0%,100%{transform:translate(0,0);opacity:.7}50%{transform:translate(6px,-8px);opacity:1}}
    @keyframes moteDrift2{0%,100%{transform:translate(0,0);opacity:.65}50%{transform:translate(-7px,6px);opacity:1}}
    @keyframes moteDrift3{0%,100%{transform:translate(0,0);opacity:.6}50%{transform:translate(-5px,-9px);opacity:.95}}
    @keyframes moteDrift4{0%,100%{transform:translate(0,0);opacity:.7}50%{transform:translate(8px,5px);opacity:1}}
  </style>

  <!--
    This file is a reusable background-cell pack.
    Each variant has its own root and can be instantiated separately.
    The renderer can translate/rotate/scale each root and stagger animation timing.
  -->

  <!-- VARIANT A: slow drifting immune/tissue cell -->
  <g id="floating-cell-a" transform-origin="0 0">
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <ellipse cx="0" cy="2" rx="38" ry="35" fill="#75cfc2" opacity=".08" filter="url(#cellGlow)"/>
    </g>

    <g id="body" transform-box="fill-box" transform-origin="center">
      <use href="#cell-a-shape" fill="url(#cellMembrane)"/>
      <use href="#cell-a-shape" fill="none" stroke="#a5e7dc" stroke-width="2" opacity=".28"/>

      <g id="membrane-ripples" fill="none" stroke="#cffff5" stroke-linecap="round">
        <path id="ripple-1" d="M -28 -4 C -25 -16 -17 -22 -6 -25" stroke-width="2.2" opacity=".28"/>
        <path id="ripple-2" d="M 22 -20 C 29 -13 31 -5 28 4" stroke-width="1.7" opacity=".22"/>
        <path id="ripple-3" d="M -19 26 C -8 31 4 31 12 26" stroke-width="1.8" opacity=".20"/>
      </g>

      <g id="nucleus" transform-box="fill-box" transform-origin="center">
        <ellipse cx="-3" cy="2" rx="13" ry="11" fill="url(#nucleus)" opacity=".76"/>
        <circle cx="-7" cy="-2" r="3" fill="#e9fff9" opacity=".42" filter="url(#microBlur)"/>
        <path d="M -11 5 C -5 -1 1 8 8 1" fill="none"
              stroke="#376d72" stroke-width="1.7" opacity=".42"/>
      </g>

      <g id="organelles" transform-box="fill-box" transform-origin="center">
        <ellipse id="organelle-1" cx="14" cy="10" rx="5" ry="2.5"
                 fill="#c5f7e9" opacity=".38" transform="rotate(25 14 10)"/>
        <ellipse id="organelle-2" cx="-16" cy="-14" rx="4" ry="2"
                 fill="#b5eee1" opacity=".30" transform="rotate(-28 -16 -14)"/>
        <circle id="organelle-3" cx="17" cy="-9" r="2.3" fill="#d7fff6" opacity=".32"/>
      </g>

      <g id="membrane-cilia" fill="none" stroke="#83cfc4" stroke-width="1.7" stroke-linecap="round" opacity=".40">
        <path id="cilia-1" d="M -27 -13 C -37 -18 -39 -25 -36 -31"/>
        <path id="cilia-2" d="M -34 10 C -44 13 -48 18 -47 25"/>
        <path id="cilia-3" d="M 27 15 C 37 18 41 24 40 31"/>
        <path id="cilia-4" d="M 10 33 C 13 41 18 44 24 43"/>
      </g>

      <path id="highlight" d="M -23 -12 C -16 -25 -5 -29 7 -28"
            fill="none" stroke="#f1fffb" stroke-width="3"
            stroke-linecap="round" opacity=".28"/>

      <g id="micro-particles" fill="#dffff8">
        <circle id="particle-1" cx="-21" cy="12" r="1.2" opacity=".45"/>
        <circle id="particle-2" cx="22" cy="1" r="1.1" opacity=".36"/>
        <circle id="particle-3" cx="5" cy="-19" r="1" opacity=".32"/>
      </g>
    </g>

    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#cell-a-shape" fill="#ffffff"/>
    </g>
  </g>


  <!-- VARIANT B: smaller elongated swimmer, visibly motile -->
  <g id="floating-cell-b" transform-origin="0 0">
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <ellipse cx="0" cy="0" rx="32" ry="24" fill="#6bbab6" opacity=".07" filter="url(#cellGlow)"/>
    </g>

    <g id="body" transform-box="fill-box" transform-origin="center">
      <use href="#cell-b-shape" fill="url(#cellInterior)"/>
      <use href="#cell-b-shape" fill="none" stroke="#92d9cf" stroke-width="1.8" opacity=".28"/>

      <!-- Forward polarity / directional ridge -->
      <g id="leading-ridge" transform-box="fill-box" transform-origin="center">
        <path d="M 5 -26 C 18 -23 27 -15 29 -5"
              fill="none" stroke="#d8fff6" stroke-width="3"
              stroke-linecap="round" opacity=".28"/>
      </g>

      <g id="nucleus" transform-box="fill-box" transform-origin="center">
        <ellipse cx="-3" cy="1" rx="11" ry="9" fill="url(#nucleus)" opacity=".68"/>
        <ellipse cx="-7" cy="-2" rx="3.5" ry="2" fill="#effffb" opacity=".38"/>
      </g>

      <g id="organelles" transform-box="fill-box" transform-origin="center">
        <circle id="organelle-1" cx="13" cy="11" r="2.2" fill="#cffff4" opacity=".35"/>
        <ellipse id="organelle-2" cx="-16" cy="13" rx="4" ry="1.8"
                 fill="#a8e7dc" opacity=".28" transform="rotate(-25 -16 13)"/>
        <ellipse id="organelle-3" cx="14" cy="-10" rx="3.5" ry="1.7"
                 fill="#d8fff5" opacity=".25"/>
      </g>

      <!-- Cilia form a living propulsion field; each group can wave at a different phase. -->
      <g id="cilia" fill="none" stroke="#80c8bf" stroke-width="1.5"
         stroke-linecap="round" opacity=".42">
        <g id="cilia-left" transform-box="fill-box" transform-origin="right center">
          <path d="M -24 -8 C -38 -10 -43 -16 -43 -24"/>
          <path d="M -29 1 C -43 1 -49 -4 -51 -12"/>
          <path d="M -26 10 C -39 14 -44 12 -49 7"/>
        </g>
        <g id="cilia-right" transform-box="fill-box" transform-origin="left center">
          <path d="M 26 -6 C 38 -10 43 -16 42 -23"/>
          <path d="M 30 4 C 43 5 48 1 51 -5"/>
          <path d="M 25 12 C 38 17 43 16 48 13"/>
        </g>
      </g>

      <g id="internal-flow" fill="none" stroke="#a9eadf" stroke-linecap="round">
        <path id="flow-1" d="M -15 -5 C -5 -12 7 -9 17 -2"
              stroke-width="2" opacity=".24"/>
        <path id="flow-2" d="M -16 8 C -5 13 6 12 15 6"
              stroke-width="1.6" opacity=".20"/>
      </g>
    </g>

    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#cell-b-shape" fill="#ffffff"/>
    </g>
  </g>


  <!-- VARIANT C: larger slow amoeboid cell with pseudopod-like edges -->
  <g id="floating-cell-c" transform-origin="0 0">
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <ellipse cx="0" cy="2" rx="45" ry="39" fill="#79cfc3" opacity=".08" filter="url(#cellGlow)"/>
    </g>

    <g id="body" transform-box="fill-box" transform-origin="center">
      <use href="#cell-c-shape" fill="url(#cellMembrane)" opacity=".82"/>
      <use href="#cell-c-shape" fill="none" stroke="#9eddd3" stroke-width="2.3" opacity=".25"/>

      <!-- Uneven pseudopod-like extensions -->
      <g id="pseudopods" fill="#6eb9b0" opacity=".22">
        <path id="pseudopod-1" d="M -31 13 C -48 19 -55 14 -59 4 C -47 6 -40 3 -32 0 Z"/>
        <path id="pseudopod-2" d="M 19 -25 C 27 -41 35 -45 44 -40 C 39 -30 34 -23 27 -17 Z"/>
        <path id="pseudopod-3" d="M 15 27 C 24 38 23 47 15 53 C 8 43 7 35 5 29 Z"/>
      </g>

      <g id="nucleus" transform-box="fill-box" transform-origin="center">
        <path d="M -10 -5 C -4 -16 11 -15 17 -6
                 C 25 3 17 14 6 16
                 C -5 19 -18 11 -18 1 C -18 -2 -14 -4 -10 -5 Z"
              fill="url(#nucleus)" opacity=".70"/>
        <circle cx="-5" cy="-4" r="3.5" fill="#f0fffc" opacity=".35" filter="url(#microBlur)"/>
      </g>

      <g id="organelles" transform-box="fill-box" transform-origin="center">
        <ellipse id="organelle-1" cx="-22" cy="-10" rx="6" ry="2.3"
                 fill="#c4f5e8" opacity=".30" transform="rotate(20 -22 -10)"/>
        <ellipse id="organelle-2" cx="23" cy="7" rx="5" ry="2.2"
                 fill="#c4f5e8" opacity=".30" transform="rotate(-20 23 7)"/>
        <circle id="organelle-3" cx="-19" cy="18" r="2.4" fill="#d9fff5" opacity=".26"/>
        <circle id="organelle-4" cx="23" cy="-7" r="1.9" fill="#d9fff5" opacity=".28"/>
      </g>

      <g id="membrane-waves" fill="none" stroke="#d7fff6" stroke-linecap="round">
        <path id="wave-1" d="M -35 -1 C -31 -13 -24 -19 -15 -24"
              stroke-width="2.4" opacity=".22"/>
        <path id="wave-2" d="M 28 0 C 34 7 34 16 28 22"
              stroke-width="2" opacity=".20"/>
        <path id="wave-3" d="M -10 29 C 0 34 10 33 17 28"
              stroke-width="2" opacity=".18"/>
      </g>

      <!-- Tiny vesicles visibly orbit the nucleus. -->
      <g id="vesicle-orbit" transform-box="fill-box" transform-origin="center">
        <g id="vesicle-1" transform="translate(-30 -1)">
          <circle r="3" fill="#b9f1e5" opacity=".34"/>
          <circle cx="-1" cy="-1" r=".8" fill="#f0fffb" opacity=".45"/>
        </g>
        <g id="vesicle-2" transform="translate(29 -13)">
          <circle r="2.5" fill="#b9f1e5" opacity=".30"/>
        </g>
        <g id="vesicle-3" transform="translate(18 27)">
          <circle r="2.8" fill="#b9f1e5" opacity=".28"/>
        </g>
      </g>

      <path id="highlight" d="M -26 -12 C -17 -27 -4 -31 9 -29"
            fill="none" stroke="#f4fffc" stroke-width="3.5"
            stroke-linecap="round" opacity=".25"/>
    </g>

    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#cell-c-shape" fill="#ffffff"/>
    </g>
  </g>


  <!-- Standalone motion trails / shed vesicles for optional background life. -->
  <g id="ambient-motes" transform-origin="0 0">
    <g id="mote-1" transform-box="fill-box" transform-origin="center">
      <circle cx="-210" cy="-130" r="3" fill="#a5e8dd" opacity=".24" filter="url(#softGlow)"/>
      <circle cx="-210" cy="-130" r="1.1" fill="#e0fff8" opacity=".46"/>
    </g>
    <g id="mote-2" transform-box="fill-box" transform-origin="center">
      <circle cx="190" cy="-72" r="2.5" fill="#9bdcd3" opacity=".20" filter="url(#softGlow)"/>
      <circle cx="190" cy="-72" r=".9" fill="#e0fff8" opacity=".42"/>
    </g>
    <g id="mote-3" transform-box="fill-box" transform-origin="center">
      <circle cx="235" cy="128" r="3.2" fill="#9bdcd3" opacity=".18" filter="url(#softGlow)"/>
      <circle cx="235" cy="128" r="1" fill="#e0fff8" opacity=".38"/>
    </g>
    <g id="mote-4" transform-box="fill-box" transform-origin="center">
      <circle cx="-174" cy="116" r="2.2" fill="#9bdcd3" opacity=".20" filter="url(#softGlow)"/>
      <circle cx="-174" cy="116" r=".8" fill="#e0fff8" opacity=".40"/>
    </g>
  </g>
</svg>

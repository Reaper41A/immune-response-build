<svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="-85 -85 170 170">
  <defs>
    <!-- Fungi body palette -->
    <radialGradient id="fungiBodyGradient" cx="43%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#d7f5c9"/>
      <stop offset="48%" stop-color="#6fae5f"/>
      <stop offset="100%" stop-color="#3d6b34"/>
    </radialGradient>

    <radialGradient id="budGradient" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f0ffe0"/>
      <stop offset="22%" stop-color="#d7f5c9"/>
      <stop offset="58%" stop-color="#6fae5f"/>
      <stop offset="100%" stop-color="#3d6b34"/>
    </radialGradient>

    <linearGradient id="rootWispGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fae5f" stop-opacity="0.88"/>
      <stop offset="70%" stop-color="#6fae5f" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6fae5f" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="auraGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fae5f" stop-opacity="0.30"/>
      <stop offset="68%" stop-color="#6fae5f" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#6fae5f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="highlightGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0ffe0" stop-opacity="0.05"/>
      <stop offset="35%" stop-color="#f0ffe0" stop-opacity="0.72"/>
      <stop offset="75%" stop-color="#d7f5c9" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#d7f5c9" stop-opacity="0"/>
    </linearGradient>

    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>

    <!-- Exact body silhouette used both for the body and damage flash -->
    <clipPath id="cellClip">
      <path id="body-clip-shape"
        d="M -20.7,24.0
           C -22.4,17.4 -21.6,8.8 -19.2,1.0
           C -17.0,-6.0 -12.8,-13.0 -8.2,-15.0
           C -4.9,-16.4 -1.6,-18.0 2.0,-19.0
           C 6.0,-20.1 9.5,-21.8 12.2,-25.8
           C 15.0,-29.7 17.0,-33.5 17.6,-35.9
           C 23.2,-34.2 27.8,-30.0 30.0,-24.5
           C 33.0,-17.0 33.2,-8.0 31.7,0.0
           C 30.6,7.2 28.6,15.5 24.7,21.8
           C 21.0,27.8 14.8,31.8 8.0,33.0
           C 0.0,34.5 -8.8,32.9 -14.6,30.0
           C -18.0,28.3 -19.9,26.0 -20.7,24.0 Z"/>
    </clipPath>

    <style>
      /* Fungi — slow rooted tank. Asymmetric body breathes unevenly (never a
         clean sine — this thing is lopsided by design), buds sway and can
         detach individually on hit (sporey), root-wisps drift like something
         embedded in tissue. idle/move/hit/critical/death only — no attack
         (contact damage only, per spec). */
      #fungi{transform-origin:0 0}
      #aura{animation:fungiAura 3.6s ease-in-out infinite}
      #body{transform-box:fill-box;transform-origin:center;animation:fungiBreathe 3.2s ease-in-out infinite}
      #root-wisps{animation:fungiWispsDrift 4.4s ease-in-out infinite}
      #wisp-1{transform-box:fill-box;transform-origin:0% 0%;animation:fungiWisp1 3.8s ease-in-out infinite}
      #wisp-2{transform-box:fill-box;transform-origin:0% 0%;animation:fungiWisp2 5.1s ease-in-out infinite .3s}
      #wisp-3{transform-box:fill-box;transform-origin:0% 0%;animation:fungiWisp3 4.5s ease-in-out infinite .6s}
      #bud-1{animation:fungiBud1 2.6s ease-in-out infinite}
      #bud-2{animation:fungiBud2 3.1s ease-in-out infinite .4s}
      #bud-3{animation:fungiBud3 2.8s ease-in-out infinite .8s}
      #body-highlight{animation:fungiHighlight 5s ease-in-out infinite}
      .damage-flash{opacity:0;pointer-events:none}

      #fungi.state-move #body{animation:fungiBreathe 1.9s ease-in-out infinite}
      #fungi.state-move #root-wisps{animation:fungiWispsDrift 1.7s ease-in-out infinite}
      #fungi.state-move #bud-1,#fungi.state-move #bud-2,#fungi.state-move #bud-3{animation-duration:1.3s}

      #fungi.state-hit #body{animation:fungiHitSquash .22s ease-out}
      #fungi.state-hit #bud-1{animation:fungiBudFlinch .24s ease-out}
      #fungi.state-hit #bud-2{animation:fungiBudFlinch .24s ease-out .02s}
      #fungi.state-hit #bud-3{animation:fungiBudFlinch .3s ease-out}
      #fungi.state-hit .damage-flash{animation:fungiFlash .22s ease-out}

      #fungi.state-critical #body{animation:fungiCriticalBreathe .6s ease-in-out infinite}
      #fungi.state-critical #surface-cracks{animation:fungiCracksIn .3s ease-out forwards}
      #fungi.state-critical #bud-1,#fungi.state-critical #bud-2,#fungi.state-critical #bud-3{animation:fungiBudSwell 1.1s ease-in-out infinite}

      #fungi.state-death{animation:fungiDeathRoot .9s ease-in forwards}
      #fungi.state-death #body{animation:fungiDeathBody .9s ease-in forwards}
      #fungi.state-death #bud-1{animation:fungiBudDetach1 .8s ease-in forwards}
      #fungi.state-death #bud-2{animation:fungiBudDetach2 .8s ease-in forwards .06s}
      #fungi.state-death #bud-3{animation:fungiBudDetach3 .8s ease-in forwards .1s}
      #fungi.state-death #root-wisps{animation:fungiWispsFade .7s ease-out forwards}
      #fungi.state-death #surface-cracks{animation:fungiCracksIn .2s ease-out forwards}

      @keyframes fungiAura{0%,100%{opacity:.22;transform:scale(.95)}50%{opacity:.4;transform:scale(1.06)}}
      @keyframes fungiBreathe{0%,100%{transform:scale(1,1) rotate(0deg)}35%{transform:scale(1.02,.97) rotate(-.6deg)}70%{transform:scale(.985,1.015) rotate(.4deg)}}
      @keyframes fungiWispsDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(-1px,1.5px)}}
      @keyframes fungiWisp1{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2.5deg)}}
      @keyframes fungiWisp2{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
      @keyframes fungiWisp3{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}}
      @keyframes fungiBud1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-.6px,-1px) scale(1.04)}}
      @keyframes fungiBud2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(.5px,-1.2px) scale(1.05)}}
      @keyframes fungiBud3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(.7px,-.8px) scale(1.03)}}
      @keyframes fungiHighlight{0%,100%{opacity:.6}50%{opacity:.95}}
      @keyframes fungiHitSquash{0%{transform:scale(1)}40%{transform:translate(1.5px,1px) scale(1.06,.93)}100%{transform:scale(1)}}
      @keyframes fungiBudFlinch{0%{transform:scale(1)}40%{transform:scale(.82,1.15) translate(0,1.5px)}100%{transform:scale(1)}}
      @keyframes fungiFlash{0%,100%{opacity:0}22%{opacity:.9}}
      @keyframes fungiCriticalBreathe{0%,100%{transform:scale(1,.97)}50%{transform:scale(1.05,1.03)}}
      @keyframes fungiCracksIn{0%{opacity:0}100%{opacity:.85}}
      @keyframes fungiBudSwell{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
      @keyframes fungiDeathRoot{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
      @keyframes fungiDeathBody{0%{transform:scale(1);opacity:1}45%{transform:scale(1.08,.9);opacity:1}100%{transform:scale(.7,.55) translate(0,6px);opacity:0}}
      @keyframes fungiBudDetach1{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-14px,-20px) rotate(-40deg) scale(.5);opacity:0}}
      @keyframes fungiBudDetach2{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(3px,-26px) rotate(20deg) scale(.5);opacity:0}}
      @keyframes fungiBudDetach3{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(16px,-18px) rotate(45deg) scale(.5);opacity:0}}
      @keyframes fungiWispsFade{0%{opacity:1}100%{opacity:0;transform:translate(0,8px)}}
    </style>
  </defs>

  <!-- Root entity -->
  <g id="fungi" transform-origin="0 0" style="transform-box:fill-box;transform-origin:0 0;">

    <!-- 1. Soft aura -->
    <ellipse id="aura" cx="4" cy="3" rx="39" ry="35" fill="url(#auraGradient)" filter="url(#blur)"/>

    <!-- 2. Root wisps: underside trailing tendrils -->
    <g id="root-wisps" fill="none" stroke-linecap="round" stroke-linejoin="round" style="transform-box:fill-box;">
      <path id="wisp-1" d="M -13,25 C -21,31 -27,37 -36,38 C -42,39 -46,42 -49,46" stroke="url(#rootWispGradient)" stroke-width="2.0"/>
      <path id="wisp-2" d="M 0,31 C -2,39 -7,45 -14,48 C -20,50 -24,53 -27,57" stroke="url(#rootWispGradient)" stroke-width="1.8"/>
      <path id="wisp-3" d="M 15,27 C 21,35 28,39 34,42 C 40,45 44,49 46,54" stroke="url(#rootWispGradient)" stroke-width="1.9"/>
    </g>

    <!-- 3. Main organic mass -->
    <g id="body" style="transform-box:fill-box;transform-origin:center;">
      <path id="body-shape"
        d="M -20.7,24.0
           C -22.4,17.4 -21.6,8.8 -19.2,1.0
           C -17.0,-6.0 -12.8,-13.0 -8.2,-15.0
           C -4.9,-16.4 -1.6,-18.0 2.0,-19.0
           C 6.0,-20.1 9.5,-21.8 12.2,-25.8
           C 15.0,-29.7 17.0,-33.5 17.6,-35.9
           C 23.2,-34.2 27.8,-30.0 30.0,-24.5
           C 33.0,-17.0 33.2,-8.0 31.7,0.0
           C 30.6,7.2 28.6,15.5 24.7,21.8
           C 21.0,27.8 14.8,31.8 8.0,33.0
           C 0.0,34.5 -8.8,32.9 -14.6,30.0
           C -18.0,28.3 -19.9,26.0 -20.7,24.0 Z"
        fill="url(#fungiBodyGradient)"
        stroke="#3d6b34" stroke-width="2.8" stroke-linejoin="round"/>

      <!-- Low-opacity branching capillary/vein network clipped to body -->
      <g id="body-veins" clip-path="url(#cellClip)" fill="none" stroke="#2a4a24" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" opacity="0.48" style="transform-box:fill-box;transform-origin:center;">
        <path d="M 3,27 C 3,19 2,11 1,4 C 0,0 -2,-5 -5,-9"/>
        <path d="M 1,7 C -5,4 -10,1 -15,-5 C -18,-8 -20,-11 -22,-14"/>
        <path d="M 0,9 C 6,5 12,2 18,-3 C 23,-7 27,-12 31,-17"/>
        <path d="M 2,18 C 9,14 15,11 21,6 C 25,3 29,0 34,-2"/>
        <path d="M -1,2 C 2,-4 5,-8 8,-13 C 10,-16 11,-20 12,-24"/>
        <path d="M -6,4 C -9,9 -12,14 -17,17 C -21,19 -24,20 -28,21"/>
      </g>

      <!-- Soft membrane-like upper highlight -->
      <path id="body-highlight"
        d="M -12.5,-8.5 C -6.2,-15.3 2.0,-18.0 10.3,-20.0 C 17.3,-21.7 22.8,-18.4 26.4,-13.3"
        fill="none" stroke="url(#highlightGradient)" stroke-width="3.2" stroke-linecap="round" opacity="0.82"/>
    </g>

    <!-- 4. Three independently transformable raised cap/spore buds -->
    <g id="cap-bumps" style="transform-box:fill-box;">
      <g id="bud-1" style="transform-box:fill-box;transform-origin:center;">
        <ellipse cx="-10.5" cy="-18.0" rx="7.0" ry="5.6" fill="url(#budGradient)" stroke="#3d6b34" stroke-width="1.5"/>
        <ellipse cx="-12.6" cy="-19.8" rx="2.7" ry="1.8" fill="#f0ffe0" opacity="0.62"/>
      </g>
      <g id="bud-2" style="transform-box:fill-box;transform-origin:center;">
        <ellipse cx="3.8" cy="-25.2" rx="8.0" ry="6.2" fill="url(#budGradient)" stroke="#3d6b34" stroke-width="1.6"/>
        <ellipse cx="1.3" cy="-27.4" rx="3.0" ry="2.0" fill="#f0ffe0" opacity="0.68"/>
      </g>
      <g id="bud-3" style="transform-box:fill-box;transform-origin:center;">
        <ellipse cx="18.8" cy="-21.8" rx="6.8" ry="5.4" fill="url(#budGradient)" stroke="#3d6b34" stroke-width="1.5"/>
        <ellipse cx="16.9" cy="-23.5" rx="2.5" ry="1.7" fill="#f0ffe0" opacity="0.62"/>
      </g>
    </g>

    <!-- 5. Critical-state surface cracks; intentionally invisible by default -->
    <g id="surface-cracks" fill="none" stroke="#2a4a24" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" opacity="0" style="transform-box:fill-box;">
      <path d="M -13,12 l 3,-2.2 l -1.2,-3.4 l 3.8,-2.5"/>
      <path d="M 6,16 l -2.1,-3.1 l 2.6,-3.4 l -1.1,-3.7"/>
      <path d="M 17,8 l -2.9,-1.8 l 1.1,-3.5 l -3,-2.3"/>
      <path d="M -4,25 l 2.5,-3.2 l -0.8,-3.3 l 3,-2.1"/>
    </g>

    <!-- 6. Hit flash: same full silhouette, invisible by default -->
    <path id="damage-flash"
      d="M -20.7,24.0
         C -22.4,17.4 -21.6,8.8 -19.2,1.0
         C -17.0,-6.0 -12.8,-13.0 -8.2,-15.0
         C -4.9,-16.4 -1.6,-18.0 2.0,-19.0
         C 6.0,-20.1 9.5,-21.8 12.2,-25.8
         C 15.0,-29.7 17.0,-33.5 17.6,-35.9
         C 23.2,-34.2 27.8,-30.0 30.0,-24.5
         C 33.0,-17.0 33.2,-8.0 31.7,0.0
         C 30.6,7.2 28.6,15.5 24.7,21.8
         C 21.0,27.8 14.8,31.8 8.0,33.0
         C 0.0,34.5 -8.8,32.9 -14.6,30.0
         C -18.0,28.3 -19.9,26.0 -20.7,24.0 Z"
      fill="#ffffff" opacity="0"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     width="190" height="190"
     viewBox="-95 -95 190 190">

  <defs>
    <!-- Biofilm palette: mint surface fading into deep organic shadow. -->
    <linearGradient id="biofilmBackGradient" x1="24%" y1="18%" x2="78%" y2="90%">
      <stop offset="0%"   stop-color="#a9f2df"/>
      <stop offset="48%"  stop-color="#7de3c8"/>
      <stop offset="100%" stop-color="#3d7a68"/>
    </linearGradient>

    <linearGradient id="biofilmMidGradient" x1="28%" y1="16%" x2="75%" y2="92%">
      <stop offset="0%"   stop-color="#c8fff0"/>
      <stop offset="42%"  stop-color="#7de3c8"/>
      <stop offset="78%"  stop-color="#559f89"/>
      <stop offset="100%" stop-color="#3d7a68"/>
    </linearGradient>

    <radialGradient id="biofilmFrontGradient" cx="34%" cy="27%" r="78%">
      <stop offset="0%"   stop-color="#c8fff0"/>
      <stop offset="42%"  stop-color="#7de3c8"/>
      <stop offset="76%"  stop-color="#559f89"/>
      <stop offset="100%" stop-color="#3d7a68"/>
    </radialGradient>

    <radialGradient id="poreGradient" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#315f53"/>
      <stop offset="58%" stop-color="#3d7a68"/>
      <stop offset="100%" stop-color="#6aa991"/>
    </radialGradient>

    <linearGradient id="regenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8fff8" stop-opacity=".28"/>
      <stop offset="50%" stop-color="#e8fff8" stop-opacity=".86"/>
      <stop offset="100%" stop-color="#e8fff8" stop-opacity=".32"/>
    </linearGradient>

    <filter id="auraBlur" x="-80%" y="-100%" width="260%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="slimeBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>

    <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <!-- Shared approximate outer footprint for aura and hit flash. -->
    <path id="biofilm-outline"
      d="M -75,-19
         C -74,-32 -64,-43 -49,-46
         C -38,-55 -21,-57 -7,-52
         C 7,-59 25,-56 37,-48
         C 54,-49 68,-40 74,-28
         C 83,-17 80,-2 73,8
         C 78,20 68,32 54,35
         C 43,45 27,48 12,44
         C -2,52 -20,50 -32,42
         C -49,45 -64,37 -70,26
         C -82,19 -83,5 -76,-6
         C -82,-10 -81,-16 -75,-19 Z"/>

    <style>
    /* Biofilm Wall — tankiest non-boss, nearly stationary. Idle is almost
       imperceptible (barely a creature). Hit is a LOCALIZED reaction — the
       surface texture/front layer reacts, the slab itself never squashes
       (it's a wall, not a cell). Regen veins fade in/pulse when JS toggles
       .regen-active (driven by en.rg). Death is a slow structural collapse,
       layers crumbling in sequence, not a burst. No move/attack. */
    #biofilmWall{transform-origin:0 0}
    #aura{animation:biofilmAura 5s ease-in-out infinite}
    #layer-back{transform-box:fill-box;transform-origin:center;animation:biofilmBreatheBack 6s ease-in-out infinite}
    #layer-mid{transform-box:fill-box;transform-origin:center;animation:biofilmBreatheMid 6s ease-in-out infinite .15s}
    #layer-front{transform-box:fill-box;transform-origin:center;animation:biofilmBreatheFront 6s ease-in-out infinite .3s}
    #wet-glints{animation:biofilmGlints 3.4s ease-in-out infinite}
    .damage-flash{opacity:0;pointer-events:none}
    #regen-veins{opacity:0;transition:opacity .3s ease}
    #biofilmWall.regen-active #regen-veins{animation:biofilmRegenFlow 1.8s ease-in-out infinite}
    #biofilmWall.regen-active #regen-node-1{animation:biofilmRegenNode 1.8s ease-in-out infinite}
    #biofilmWall.regen-active #regen-node-2{animation:biofilmRegenNode 1.8s ease-in-out infinite .3s}
    #biofilmWall.regen-active #regen-node-3{animation:biofilmRegenNode 1.8s ease-in-out infinite .6s}

    #biofilmWall.state-hit #layer-front{animation:biofilmDent .28s ease-out}
    #biofilmWall.state-hit #surface-texture{animation:biofilmTextureShift .28s ease-out}
    #biofilmWall.state-hit .damage-flash{animation:biofilmFlash .22s ease-out}

    #biofilmWall.state-critical #layer-front{animation:biofilmCriticalTremor .5s ease-in-out infinite}
    #biofilmWall.state-critical #pores{animation:biofilmPoresWiden .5s ease-in-out infinite}

    #biofilmWall.state-death #layer-front{animation:biofilmCollapseFront 1.1s ease-in forwards}
    #biofilmWall.state-death #layer-mid{animation:biofilmCollapseMid 1.1s ease-in forwards .15s}
    #biofilmWall.state-death #layer-back{animation:biofilmCollapseBack 1.1s ease-in forwards .3s}
    #biofilmWall.state-death #surface-texture,
    #biofilmWall.state-death #drip-points,
    #biofilmWall.state-death #regen-veins{animation:biofilmFadeOut .5s ease-out forwards}
    #biofilmWall.state-death #aura{animation:biofilmFadeOut .8s ease-out forwards}

    @keyframes biofilmAura{0%,100%{opacity:.14;transform:scale(.98)}50%{opacity:.22;transform:scale(1.02)}}
    @keyframes biofilmBreatheBack{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,.994)}}
    @keyframes biofilmBreatheMid{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,.996)}}
    @keyframes biofilmBreatheFront{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,.992)}}
    @keyframes biofilmGlints{0%,100%{opacity:.25}50%{opacity:.55}}
    @keyframes biofilmRegenFlow{0%,100%{opacity:.35}50%{opacity:.95}}
    @keyframes biofilmRegenNode{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
    @keyframes biofilmDent{0%{transform:scale(1)}30%{transform:scale(.97,.98) translate(.5px,.5px)}100%{transform:scale(1)}}
    @keyframes biofilmTextureShift{0%{transform:translate(0,0)}30%{transform:translate(-.6px,.6px)}100%{transform:translate(0,0)}}
    @keyframes biofilmFlash{0%,100%{opacity:0}25%{opacity:.7}}
    @keyframes biofilmCriticalTremor{0%,100%{transform:translate(0,0)}50%{transform:translate(.6px,-.4px)}}
    @keyframes biofilmPoresWiden{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
    @keyframes biofilmCollapseFront{0%{transform:translate(0,0);opacity:1}100%{transform:translate(0,14px);opacity:0}}
    @keyframes biofilmCollapseMid{0%{transform:translate(0,0);opacity:1}100%{transform:translate(0,20px);opacity:0}}
    @keyframes biofilmCollapseBack{0%{transform:translate(0,0);opacity:1}100%{transform:translate(0,26px);opacity:0}}
    @keyframes biofilmFadeOut{0%{opacity:1}100%{opacity:0}}
  </style>
  </defs>

  <!-- Root group: renderer translates this and applies state classes. -->
  <g id="biofilmWall" transform-origin="0 0">

    <!-- Wide, sickly aura: wall-like rather than a creature-like halo. -->
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <use href="#biofilm-outline"
           fill="#c8fff0" opacity=".18"
           transform="scale(1.06 0.92)"
           filter="url(#auraBlur)"/>
    </g>

    <!-- Layered slab: rear → middle → front. -->
    <g id="slab" transform-box="fill-box" transform-origin="center">

      <!-- Furthest-back crust. -->
      <g id="layer-back" transform-box="fill-box" transform-origin="center">
        <path
          d="M -69,-20
             C -65,-34 -51,-41 -37,-40
             C -25,-49 -9,-48 3,-43
             C 18,-50 34,-44 41,-36
             C 56,-40 68,-31 71,-20
             C 79,-10 73,2 66,8
             C 68,21 56,29 44,29
             C 33,39 17,38 5,34
             C -8,41 -24,38 -33,31
             C -48,35 -61,28 -64,18
             C -76,13 -77,1 -70,-7
             C -75,-11 -74,-17 -69,-20 Z"
          fill="url(#biofilmBackGradient)"/>
      </g>

      <!-- Mid layer, offset slightly upward/right. -->
      <g id="layer-mid" transform-box="fill-box" transform-origin="center">
        <path
          d="M -62,-23
             C -57,-36 -45,-40 -31,-39
             C -20,-47 -5,-46 7,-40
             C 21,-46 36,-40 43,-31
             C 57,-34 68,-25 68,-14
             C 76,-4 69,9 60,14
             C 60,27 48,34 35,31
             C 24,40 9,38 -3,32
             C -16,38 -30,34 -37,27
             C -51,31 -61,23 -61,13
             C -72,8 -72,-4 -65,-11
             C -69,-16 -67,-21 -62,-23 Z"
          fill="url(#biofilmMidGradient)"/>

        <!-- slimy overlap seam -->
        <path
          d="M -60,5
             C -43,12 -28,11 -13,15
             C 2,19 20,18 36,13
             C 49,9 58,5 66,-1"
          fill="none" stroke="#315f53" stroke-width="3.2"
          stroke-linecap="round" opacity=".34"/>
      </g>

      <!-- Front-most active biofilm crust. -->
      <g id="layer-front" transform-box="fill-box" transform-origin="center">
        <path
          d="M -56,-22
             C -49,-34 -38,-35 -27,-32
             C -18,-41 -4,-41 6,-35
             C 18,-41 31,-35 35,-26
             C 48,-30 59,-22 59,-12
             C 68,-4 62,8 53,12
             C 56,23 46,31 35,28
             C 27,37 13,34 3,29
             C -8,36 -21,31 -26,24
             C -39,28 -50,21 -49,12
             C -60,8 -64,-4 -57,-11
             C -63,-15 -61,-20 -56,-22 Z"
          fill="url(#biofilmFrontGradient)"/>

        <!-- Wet upper-left gloss, deliberately irregular. -->
        <path
          d="M -47,-22
             C -38,-31 -28,-30 -20,-27
             C -11,-35 -1,-34 7,-29
             C 16,-34 26,-30 31,-23
             C 18,-26 8,-23 -1,-18
             C -13,-12 -22,-11 -34,-14
             C -40,-15 -44,-18 -47,-22 Z"
          fill="#c8fff0" opacity=".36"/>

        <!-- Gooey lower edge / hanging biofilm folds. -->
        <g id="slime-folds" fill="#3d7a68" opacity=".30" filter="url(#slimeBlur)">
          <path d="M -34,24 C -31,30 -29,35 -32,39 C -36,35 -39,30 -38,25 Z"/>
          <path d="M -5,28 C -2,35 0,40 -4,44 C -9,40 -10,34 -9,28 Z"/>
          <path d="M 23,27 C 26,33 27,38 23,41 C 19,37 18,32 19,27 Z"/>
          <path d="M 43,21 C 47,26 48,31 44,34 C 40,31 39,26 40,22 Z"/>
        </g>
      </g>

    </g>

    <!-- Gross surface texture: irregular colonies, pits and raised biofilm nodules. -->
    <g id="surface-texture" transform-box="fill-box" transform-origin="center">

      <!-- dark pores / cavities -->
      <g id="pores" fill="url(#poreGradient)">
        <ellipse cx="-34" cy="-8" rx="5.2" ry="3.3"/>
        <ellipse cx="-12" cy="-20" rx="3.8" ry="2.4"/>
        <ellipse cx="12" cy="-13" rx="5.4" ry="3.0"/>
        <ellipse cx="35" cy="-7" rx="3.5" ry="2.2"/>
        <ellipse cx="-20" cy="11" rx="4.4" ry="2.7"/>
        <ellipse cx="5" cy="9" rx="3.3" ry="2.0"/>
        <ellipse cx="30" cy="16" rx="5.0" ry="2.6"/>
        <ellipse cx="-42" cy="9" rx="2.7" ry="1.7"/>
      </g>

      <!-- raised translucent bacterial-looking blobs. -->
      <g id="biofilm-nodules" fill="#c8fff0" opacity=".30">
        <ellipse cx="-25" cy="-2" rx="5.5" ry="2.7"/>
        <ellipse cx="-1" cy="-5" rx="4.1" ry="2.3"/>
        <ellipse cx="20" cy="1" rx="5.8" ry="2.9"/>
        <ellipse cx="42" cy="8" rx="3.7" ry="2.0"/>
        <ellipse cx="-5" cy="21" rx="4.8" ry="2.2"/>
      </g>

      <!-- Uneven surface scars and folds. -->
      <g id="surface-grooves" fill="none" stroke="#3d7a68"
         stroke-linecap="round" opacity=".40">
        <path d="M -48,-16 C -44,-12 -43,-8 -45,-4" stroke-width="1.8"/>
        <path d="M -7,-29 C -4,-25 -5,-22 -8,-19" stroke-width="1.5"/>
        <path d="M 27,-24 C 24,-20 25,-16 28,-13" stroke-width="1.9"/>
        <path d="M 48,-2 C 44,1 43,5 45,9" stroke-width="1.5"/>
        <path d="M -28,15 C -25,18 -25,21 -28,24" stroke-width="1.7"/>
        <path d="M 9,14 C 12,17 11,21 8,23" stroke-width="1.4"/>
      </g>

      <!-- Tiny wet glints on raised slime. -->
      <g id="wet-glints" fill="#ffffff" opacity=".30">
        <ellipse cx="-31" cy="-25" rx="3.4" ry="1.1"/>
        <ellipse cx="3" cy="-30" rx="2.8" ry="1.0"/>
        <ellipse cx="31" cy="-19" rx="3.0" ry="1.0"/>
      </g>
    </g>

    <!-- Renderer-driven regeneration signal: hidden until en.rg / regenShimmer. -->
    <g id="regen-veins" fill="none" stroke="url(#regenGradient)"
       stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <path id="regen-vein-1"
        d="M -43,9 C -30,3 -23,-1 -15,-7 C -8,-12 -3,-17 5,-21"
        stroke-width="1.9"/>
      <path id="regen-vein-2"
        d="M -21,24 C -14,16 -7,12 2,9 C 11,6 18,1 23,-7"
        stroke-width="1.7"/>
      <path id="regen-vein-3"
        d="M 5,27 C 10,19 16,15 24,14 C 33,13 39,8 44,1"
        stroke-width="1.8"/>
      <path id="regen-vein-4"
        d="M -30,-19 C -23,-13 -17,-12 -11,-14 C -4,-16 2,-12 6,-7"
        stroke-width="1.35"/>
      <circle id="regen-node-1" cx="-15" cy="-7" r="2.1" fill="#e8fff8"/>
      <circle id="regen-node-2" cx="2" cy="9" r="1.8" fill="#e8fff8"/>
      <circle id="regen-node-3" cx="24" cy="14" r="2.0" fill="#e8fff8"/>
    </g>

    <!-- A few surface drips/anchors: gives the slab a living, wet edge. -->
    <g id="drip-points" fill="#7de3c8" opacity=".68">
      <ellipse id="drip-point-1" cx="-31" cy="29" rx="2.2" ry="3.8"/>
      <ellipse id="drip-point-2" cx="-4" cy="33" rx="2.0" ry="4.5"/>
      <ellipse id="drip-point-3" cx="24" cy="29" rx="2.1" ry="4.0"/>
    </g>

    <!-- Full-wall hit flash. -->
    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#biofilm-outline" fill="#ffffff"/>
    </g>

  </g>
</svg>

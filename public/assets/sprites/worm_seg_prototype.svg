<svg xmlns="http://www.w3.org/2000/svg"
     width="160" height="160"
     viewBox="-80 -80 160 160">

  <defs>
    <!-- Worm palette: upper-left highlight → body → deep lower-right shadow -->
    <radialGradient id="wormSegmentGradient" cx="34%" cy="28%" r="76%">
      <stop offset="0%"   stop-color="#ffe0c2"/>
      <stop offset="48%"  stop-color="#c97b3d"/>
      <stop offset="78%"  stop-color="#995d30"/>
      <stop offset="100%" stop-color="#7a4a24"/>
    </radialGradient>

    <radialGradient id="wormHeadGradient" cx="32%" cy="25%" r="78%">
      <stop offset="0%"   stop-color="#ffe0c2"/>
      <stop offset="46%"  stop-color="#c97b3d"/>
      <stop offset="77%"  stop-color="#995d30"/>
      <stop offset="100%" stop-color="#7a4a24"/>
    </radialGradient>

    <linearGradient id="wormBellyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffe0c2" stop-opacity=".18"/>
      <stop offset="50%"  stop-color="#ffe0c2" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#ffe0c2" stop-opacity=".10"/>
    </linearGradient>

    <linearGradient id="wormRidgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a4a24" stop-opacity=".25"/>
      <stop offset="50%" stop-color="#7a4a24" stop-opacity=".58"/>
      <stop offset="100%" stop-color="#7a4a24" stop-opacity=".18"/>
    </linearGradient>

    <radialGradient id="wormAuraGradient" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffe0c2" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffe0c2" stop-opacity="0"/>
    </radialGradient>

    <filter id="wormAuraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="softHighlightBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <style>
      /* Worm — segment chain (Option B). IMPORTANT: JS positions each
         #seg-* group every frame via translate (riding wormHist) — every
         animation here uses rotate/scale ONLY on each segment's own
         transform-origin so it layers on top of JS positioning instead of
         fighting it. Idle = faint undulation even at rest. Move = the
         actual sine-wave travel, driven by JS translate; CSS here just adds
         a livelier per-segment scale pulse while state-move is active.
         No critical/attack (fast trash unit per spec). */
      #worm_seg{transform-origin:0 0}
      #aura{animation:wormAura 2.6s ease-in-out infinite}
      #seg-tail{transform-box:fill-box;transform-origin:center;animation:wormUndulateTail 1.6s ease-in-out infinite}
      #seg-4{transform-box:fill-box;transform-origin:center;animation:wormUndulate4 1.6s ease-in-out infinite .08s}
      #seg-3{transform-box:fill-box;transform-origin:center;animation:wormUndulate3 1.6s ease-in-out infinite .16s}
      #seg-2{transform-box:fill-box;transform-origin:center;animation:wormUndulate2 1.6s ease-in-out infinite .24s}
      #seg-head{transform-box:fill-box;transform-origin:center;animation:wormUndulateHead 1.6s ease-in-out infinite .32s}
      .damage-flash{opacity:0;pointer-events:none}

      #worm_seg.state-move #seg-tail{animation:wormUndulateTail .5s ease-in-out infinite}
      #worm_seg.state-move #seg-4{animation:wormUndulate4 .5s ease-in-out infinite .04s}
      #worm_seg.state-move #seg-3{animation:wormUndulate3 .5s ease-in-out infinite .08s}
      #worm_seg.state-move #seg-2{animation:wormUndulate2 .5s ease-in-out infinite .12s}
      #worm_seg.state-move #seg-head{animation:wormUndulateHead .5s ease-in-out infinite .16s}

      #worm_seg.state-hit #seg-head{animation:wormHeadSnap .22s ease-out}
      #worm_seg.state-hit #seg-2{animation:wormFlinch .22s ease-out .02s}
      #worm_seg.state-hit #seg-3{animation:wormFlinch .22s ease-out .05s}
      #worm_seg.state-hit #seg-4{animation:wormFlinch .22s ease-out .08s}
      #worm_seg.state-hit #seg-tail{animation:wormFlinch .22s ease-out .1s}
      #worm_seg.state-hit .damage-flash{animation:wormFlash .2s ease-out}

      #worm_seg.state-death #seg-head{animation:wormScatterHead .55s ease-in forwards}
      #worm_seg.state-death #seg-2{animation:wormScatter2 .55s ease-in forwards .04s}
      #worm_seg.state-death #seg-3{animation:wormScatter3 .55s ease-in forwards .08s}
      #worm_seg.state-death #seg-4{animation:wormScatter4 .55s ease-in forwards .12s}
      #worm_seg.state-death #seg-tail{animation:wormScatterTail .55s ease-in forwards .16s}
      #worm_seg.state-death #aura{animation:wormAuraFade .4s ease-out forwards}
      #worm_seg.state-death #belly-highlight,
      #worm_seg.state-death #body-ridge,
      #worm_seg.state-death #head-detail{animation:wormAuraFade .35s ease-out forwards}

      @keyframes wormAura{0%,100%{opacity:.18;transform:scale(.96)}50%{opacity:.3;transform:scale(1.04)}}
      @keyframes wormUndulateTail{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-4deg) scale(.97)}}
      @keyframes wormUndulate4{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(3deg) scale(1.02)}}
      @keyframes wormUndulate3{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-3deg) scale(.98)}}
      @keyframes wormUndulate2{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(2.5deg) scale(1.015)}}
      @keyframes wormUndulateHead{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-2deg) scale(1)}}
      @keyframes wormHeadSnap{0%{transform:rotate(0) scale(1)}35%{transform:rotate(-10deg) scale(.88,1.1)}100%{transform:rotate(0) scale(1)}}
      @keyframes wormFlinch{0%{transform:rotate(0) scale(1)}40%{transform:scale(.92,1.06)}100%{transform:rotate(0) scale(1)}}
      @keyframes wormFlash{0%,100%{opacity:0}22%{opacity:.9}}
      @keyframes wormScatterHead{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(22px,-14px) rotate(50deg);opacity:0}}
      @keyframes wormScatter2{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(10px,-20px) rotate(-35deg);opacity:0}}
      @keyframes wormScatter3{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(-4px,16px) rotate(60deg);opacity:0}}
      @keyframes wormScatter4{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(-14px,-10px) rotate(-45deg);opacity:0}}
      @keyframes wormScatterTail{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(-22px,12px) rotate(70deg);opacity:0}}
      @keyframes wormAuraFade{0%{opacity:1}100%{opacity:0}}
    </style>
  </defs>

  <!-- Root group: JS translates this and applies state classes. -->
  <g id="worm_seg" transform-origin="0 0">

    <!-- Soft aura behind the complete segmented creature. -->
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <path
        d="M -59,-17
           C -47,-32 -25,-36 -7,-30
           C 12,-39 37,-31 48,-17
           C 61,-1 59,18 43,29
           C 27,41 6,36 -9,31
           C -27,39 -51,31 -59,14
           C -63,5 -63,-8 -59,-17 Z"
        fill="url(#wormAuraGradient)"
        filter="url(#wormAuraBlur)"/>
    </g>

    <!--
      Option B: five overlapping segments.
      The renderer can map these groups directly onto wormHist positions.
      Generous overlap makes the creature read as ONE continuous body at rest.
    -->
    <g id="body" transform-box="fill-box" transform-origin="center">

      <!-- Tail: smallest -->
      <g id="seg-tail" transform-box="fill-box" transform-origin="center">
        <ellipse id="seg-tail-shape"
                 cx="-48" cy="8" rx="10" ry="7.2"
                 fill="url(#wormSegmentGradient)"/>
        <path d="M -55,9 C -49,13 -42,13 -38,10"
              fill="none" stroke="#ffe0c2" stroke-width="1.3"
              stroke-linecap="round" opacity=".28"/>
      </g>

      <!-- Rear segment -->
      <g id="seg-4" transform-box="fill-box" transform-origin="center">
        <ellipse id="seg-4-shape"
                 cx="-32" cy="5" rx="13" ry="9.2"
                 fill="url(#wormSegmentGradient)"/>
        <path d="M -42,7 C -34,12 -25,12 -21,7"
              fill="none" stroke="#ffe0c2" stroke-width="1.45"
              stroke-linecap="round" opacity=".30"/>
      </g>

      <!-- Middle segment -->
      <g id="seg-3" transform-box="fill-box" transform-origin="center">
        <ellipse id="seg-3-shape"
                 cx="-15" cy="1" rx="15" ry="10.8"
                 fill="url(#wormSegmentGradient)"/>
        <path d="M -26,3 C -17,9 -7,9 -3,2"
              fill="none" stroke="#ffe0c2" stroke-width="1.55"
              stroke-linecap="round" opacity=".32"/>
      </g>

      <!-- Front/rear-head transition segment -->
      <g id="seg-2" transform-box="fill-box" transform-origin="center">
        <ellipse id="seg-2-shape"
                 cx="3" cy="-2" rx="17" ry="12"
                 fill="url(#wormSegmentGradient)"/>
        <path d="M -10,-1 C 0,6 11,6 17,-1"
              fill="none" stroke="#ffe0c2" stroke-width="1.7"
              stroke-linecap="round" opacity=".34"/>
      </g>

      <!-- Head: widest segment -->
      <g id="seg-head" transform-box="fill-box" transform-origin="center">
        <ellipse id="seg-head-shape"
                 cx="24" cy="-5" rx="19" ry="13.5"
                 fill="url(#wormHeadGradient)"/>

        <!-- subtle lower-right depth -->
        <path
          d="M 8,-1
             C 13,8 25,11 35,6
             C 41,3 44,-3 43,-9
             C 43,2 36,10 25,11
             C 15,11 9,7 5,1 Z"
          fill="#7a4a24" opacity=".14"/>

        <!-- soft head gloss -->
        <path
          d="M 9,-10
             C 14,-19 27,-21 37,-16
             C 41,-14 43,-11 44,-8
             C 35,-12 27,-11 20,-7
             C 15,-4 11,0 9,4
             C 6,0 6,-5 9,-10 Z"
          fill="#ffe0c2" opacity=".30"/>

        <ellipse cx="23" cy="-15" rx="5.4" ry="2.1"
                 fill="#ffffff" opacity=".38"
                 filter="url(#softHighlightBlur)"/>
      </g>

    </g>

    <!-- Continuous visual treatment down the underside: one line, not five separate glosses. -->
    <g id="belly-highlight" transform-box="fill-box" transform-origin="center"
       fill="none" stroke="url(#wormBellyGradient)"
       stroke-linecap="round">
      <path id="belly-highlight-stroke"
            d="M -52,13
               C -39,19 -25,17 -14,13
               C -2,10 10,8 21,8
               C 31,8 38,5 43,0"
            stroke-width="2.8" opacity=".62"/>
      <path
            d="M -45,16
               C -32,21 -20,18 -10,15
               C 2,12 14,11 24,10"
            stroke-width="1.1" opacity=".46"/>
    </g>

    <!--
      Subtle segmented ridge: a single broken/notched treatment rather than
      hard circular "joints". It remains visually continuous when segments move.
    -->
    <g id="body-ridge" fill="none"
       stroke="url(#wormRidgeGradient)"
       stroke-linecap="round">
      <path
        d="M -43,-2 L -38,0
           M -31,-4 L -26,-1
           M -18,-7 L -12,-4
           M -4,-9 L 2,-6
           M 10,-11 L 16,-8
           M 23,-12 L 29,-9"
        stroke-width="1.35" opacity=".64"/>
    </g>

    <!-- Minimal head detail: sensory/eye flecks, deliberately not a cartoon face. -->
    <g id="head-detail" transform-box="fill-box" transform-origin="center">
      <ellipse id="eye-fleck-1" cx="34" cy="-10" rx="1.35" ry=".95"
               fill="#7a4a24" opacity=".72"/>
      <ellipse id="eye-fleck-2" cx="37" cy="-5" rx="1.0" ry=".72"
               fill="#7a4a24" opacity=".48"/>
      <path id="sensory-nub"
            d="M 41,-4 C 45,-3 46,-1 47,1"
            fill="none" stroke="#7a4a24" stroke-width="1.15"
            stroke-linecap="round" opacity=".46"/>
    </g>

    <!-- Full-creature hit flash, synchronized through one opacity value. -->
    <g id="damage-flash" opacity="0" pointer-events="none">
      <ellipse cx="-48" cy="8" rx="10" ry="7.2" fill="#ffffff"/>
      <ellipse cx="-32" cy="5" rx="13" ry="9.2" fill="#ffffff"/>
      <ellipse cx="-15" cy="1" rx="15" ry="10.8" fill="#ffffff"/>
      <ellipse cx="3" cy="-2" rx="17" ry="12" fill="#ffffff"/>
      <ellipse cx="24" cy="-5" rx="19" ry="13.5" fill="#ffffff"/>
    </g>

  </g>
</svg>

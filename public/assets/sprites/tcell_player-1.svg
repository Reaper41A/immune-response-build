<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="-90 -90 180 180">
  <defs>
    <radialGradient id="tcellGradient" cx="31%" cy="27%" r="82%">
      <stop offset="0%" stop-color="#cffff6"/>
      <stop offset="52%" stop-color="#3ee8c8"/>
      <stop offset="100%" stop-color="#187a6b"/>
    </radialGradient>
    <radialGradient id="tcellCore" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#aaffee"/>
      <stop offset="100%" stop-color="#3ee8c8"/>
    </radialGradient>
    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="coreBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      /* T-Cell (DPS) — sleek, angular, focused. Overdrive (special/ability):
         internal glow intensifies, receptor-spikes vibrate/energize —
         "internal core spins faster, enzymatic activity" per brief.
         #facing-indicator rotation is set inline by JS from p.f. */
      #tcell{transform-origin:0 0}
      #aura{animation:tcellAura 2.6s ease-in-out infinite}
      #body{transform-box:fill-box;transform-origin:center;animation:tcellBreathe 2.2s ease-in-out infinite}
      #receptor-1{animation:tcellReceptor1 2.8s ease-in-out infinite}
      #receptor-2{animation:tcellReceptor2 3.1s ease-in-out infinite .3s}
      #receptor-3{animation:tcellReceptor3 2.5s ease-in-out infinite .6s}
      #precision-core{animation:tcellCorePulse 1.8s ease-in-out infinite}
      .damage-flash{opacity:0;pointer-events:none}

      #tcell.state-move #body{animation:tcellBreathe 1.1s ease-in-out infinite}

      #tcell.ability-active #precision-core{animation:tcellCoreOverdrive .25s ease-in-out infinite}
      #tcell.ability-active #receptor-1,#tcell.ability-active #receptor-2,
      #tcell.ability-active #receptor-3{animation:tcellReceptorVibrate .09s linear infinite}
      #tcell.ability-active #aura{animation:tcellAuraOverdrive .3s ease-in-out infinite}

      #tcell.state-hit #body{animation:tcellHit .18s ease-out}
      #tcell.state-hit .damage-flash{animation:tcellFlash .18s ease-out}

      @keyframes tcellAura{0%,100%{opacity:.13;transform:scale(.97)}50%{opacity:.22;transform:scale(1.03)}}
      @keyframes tcellBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
      @keyframes tcellReceptor1{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
      @keyframes tcellReceptor2{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}
      @keyframes tcellReceptor3{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
      @keyframes tcellCorePulse{0%,100%{opacity:.22}50%{opacity:.36}}
      @keyframes tcellCoreOverdrive{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.15)}}
      @keyframes tcellReceptorVibrate{0%,100%{transform:translate(0,0)}50%{transform:translate(.6px,-.6px)}}
      @keyframes tcellAuraOverdrive{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.5;transform:scale(1.1)}}
      @keyframes tcellHit{0%{transform:scale(1)}35%{transform:scale(1.08,.9)}100%{transform:scale(1)}}
      @keyframes tcellFlash{0%,100%{opacity:0}22%{opacity:.85}}
    </style>
  </defs>

  <g id="tcell" transform-origin="0 0">

    <!-- Focused, narrow aura -->
    <path id="aura"
      d="M -60,0
         C -47,-29 -20,-45 10,-43
         C 40,-41 58,-23 66,0
         C 53,23 35,40 8,44
         C -22,47 -48,30 -60,0 Z"
      fill="#3ee8c8" opacity="0.15" filter="url(#auraBlur)"/>

    <!-- Sparse receptor array: deliberately NOT a spike ring -->
    <g id="receptor-spikes" transform-box="fill-box" transform-origin="center">
      <g id="receptor-1" transform-box="fill-box" transform-origin="center">
        <path d="M -18,-38 L -12,-54 L -5,-38 Z"
          fill="#3ee8c8" stroke="#187a6b" stroke-width="1.8"
          stroke-linejoin="round"/>
      </g>
      <g id="receptor-2" transform-box="fill-box" transform-origin="center">
        <path d="M 11,-38 L 20,-50 L 21,-34 Z"
          fill="#3ee8c8" stroke="#187a6b" stroke-width="1.8"
          stroke-linejoin="round"/>
      </g>
      <g id="receptor-3" transform-box="fill-box" transform-origin="center">
        <path d="M 39,2 L 54,-5 L 44,9 Z"
          fill="#3ee8c8" stroke="#187a6b" stroke-width="1.8"
          stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Lean precision-oriented body -->
    <g id="body" transform-box="fill-box" transform-origin="center">
      <path id="body-shape"
        d="M -42,-5
           C -39,-23 -25,-37 -8,-41
           C 8,-45 24,-37 34,-27
           C 48,-17 50,-3 45,9
           C 40,23 27,34 11,38
           C -7,43 -25,35 -35,23
           C -44,13 -48,4 -42,-5 Z"
        fill="url(#tcellGradient)"
        stroke="#187a6b" stroke-width="2.5"
        stroke-linejoin="round"/>

      <!-- Deliberate forward-facing wedge: precision rather than bulk -->
      <path d="M 20,-20 C 34,-17 43,-10 47,-1 C 37,0 29,0 21,-3 Z"
        fill="#cffff6" opacity="0.30"/>

      <!-- Internal focused energy -->
      <ellipse id="precision-core" cx="7" cy="2" rx="18" ry="24"
        fill="url(#tcellCore)" opacity="0.27" filter="url(#coreBlur)"/>
      <path d="M -10,16 C 0,7 10,-5 17,-19"
        fill="none" stroke="#cffff6" stroke-width="2.4"
        stroke-linecap="round" opacity="0.34"/>
      <circle cx="12" cy="-8" r="4" fill="#ffffff" opacity="0.22"/>
    </g>

    <!-- Aim/facing indicator integrated as a directional bio-antenna -->
    <g id="facing-indicator" transform-box="fill-box" transform-origin="left center">
      <path d="M 40,4 L 66,4"
        fill="none" stroke="#cffff6" stroke-width="3.2"
        stroke-linecap="round" opacity="0.92"/>
      <path d="M 59,-2 L 68,4 L 59,10"
        fill="none" stroke="#cffff6" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
    </g>

    <!-- Renderer-controlled damage flash -->
    <path id="damage-flash"
      d="M -42,-5
         C -39,-23 -25,-37 -8,-41
         C 8,-45 24,-37 34,-27
         C 48,-17 50,-3 45,9
         C 40,23 27,34 11,38
         C -7,43 -25,35 -35,23
         C -44,13 -48,4 -42,-5 Z"
      fill="#ffffff" opacity="0"/>
  </g>
</svg>

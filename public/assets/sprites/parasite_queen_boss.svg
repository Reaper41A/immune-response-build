<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="-235 -235 470 470">
<defs>
  <radialGradient id="queenBody" cx="35%" cy="28%">
    <stop offset="0" stop-color="#ffe0bd"/>
    <stop offset=".42" stop-color="#ff9f5a"/>
    <stop offset="1" stop-color="#8f5228"/>
  </radialGradient>
  <radialGradient id="queenCore" cx="34%" cy="28%">
    <stop offset="0" stop-color="#fff1df"/>
    <stop offset=".45" stop-color="#ffb66f"/>
    <stop offset="1" stop-color="#9b5126"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="softBlur"><feGaussianBlur stdDeviation="5"/></filter>
  <style>
    #parasiteQueen{transform-origin:0 0}
    #parasiteQueen .anim{transform-box:fill-box;transform-origin:center}

    @keyframes queenIdle{0%,100%{transform:scale(1) rotate(-1deg)}50%{transform:scale(1.035,.97) rotate(1deg)}}
    @keyframes queenMove{0%,100%{transform:translateX(0) rotate(-2deg)}50%{transform:translateX(4px) rotate(2deg)}}
    @keyframes queenHit{0%{filter:brightness(1)}18%{filter:brightness(3)}100%{filter:brightness(1)}}
    @keyframes queenCritical{0%,100%{transform:scale(1);filter:saturate(1)}50%{transform:scale(1.055);filter:saturate(1.8) brightness(1.15)}}
    @keyframes queenTelegraph{0%,100%{transform:scale(.88);opacity:.22}50%{transform:scale(1.13);opacity:.72}}
    @keyframes queenSlam{0%{transform:scale(.15);opacity:.95}55%{transform:scale(1.25);opacity:.75}100%{transform:scale(2.2);opacity:0}}
    @keyframes queenShock{0%{transform:scale(.2);opacity:1}35%{transform:scale(.8);opacity:.9}100%{transform:scale(1.55);opacity:0}}
    @keyframes tendrilA{0%,100%{transform:rotate(-3deg) scaleY(1)}50%{transform:rotate(5deg) scaleY(1.05)}}
    @keyframes tendrilB{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-6deg)}}
    @keyframes tendrilC{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(4deg)}}
    @keyframes eggPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    @keyframes moteTravel{0%{transform:translate(0,0);opacity:.2}35%{opacity:1}100%{transform:translate(16px,-10px);opacity:0}}
    @keyframes implode{0%{transform:scale(1);opacity:1}65%{transform:scale(.35);opacity:.9}100%{transform:scale(.02);opacity:0}}
    @keyframes deathTendril{0%{transform:scale(1);opacity:1}100%{transform:scale(.7) rotate(18deg);opacity:0}}

    #parasiteQueen.state-hit #body-shell,
    #parasiteQueen.state-hit #tendrils,
    #parasiteQueen.state-hit #eggs{animation:queenHit .22s linear}

    #parasiteQueen.state-move #body-shell{animation:queenMove .5s ease-in-out infinite}
    #parasiteQueen.state-move #tendril-1{animation:tendrilA .8s ease-in-out infinite}
    #parasiteQueen.state-move #tendril-2{animation:tendrilB .95s ease-in-out infinite}
    #parasiteQueen.state-move #tendril-3{animation:tendrilC .72s ease-in-out infinite}

    #parasiteQueen.state-critical #body-shell{animation:queenCritical .55s ease-in-out infinite}
    #parasiteQueen.state-critical #rot-cracks{opacity:.95}
    #parasiteQueen.state-critical #core-glow{animation:queenCritical .3s ease-in-out infinite}

    #parasiteQueen.state-telegraph #aoe-telegraph{animation:queenTelegraph 1.15s ease-in-out infinite}
    #parasiteQueen.state-telegraph #core-glow{animation:queenCritical .4s ease-in-out infinite}
    #parasiteQueen.state-telegraph #eggs{animation:eggPulse .55s ease-in-out infinite}

    #parasiteQueen.state-slam #aoe-source{animation:queenSlam .4s cubic-bezier(.1,.7,.2,1) forwards}
    #parasiteQueen.state-slam #shockwave{animation:queenShock .4s cubic-bezier(.1,.7,.2,1) forwards}

    #parasiteQueen.state-death #body-shell,
    #parasiteQueen.state-death #core-mass{animation:implode 1.1s ease-in forwards}
    #parasiteQueen.state-death #tendrils{animation:deathTendril 1.15s ease-in forwards}
  </style>
</defs>

<g id="parasiteQueen">
  <ellipse id="aura" cx="0" cy="12" rx="205" ry="185" fill="#ffe0bd" opacity=".13" filter="url(#blur)"/>

  <g id="aoe-system">
    <circle id="aoe-telegraph" cx="0" cy="8" r="150" fill="none" stroke="#ffe0bd" stroke-width="4" stroke-dasharray="12 10" opacity="0"/>
    <circle id="aoe-source" cx="0" cy="8" r="48" fill="none" stroke="#ffe0bd" stroke-width="10" opacity="0"/>
    <circle id="shockwave" cx="0" cy="8" r="35" fill="none" stroke="#ff9f5a" stroke-width="9" opacity="0"/>
  </g>

  <g id="root-wisps" fill="none" stroke="#8f5228" stroke-width="9" stroke-linecap="round" opacity=".8">
    <path d="M-82,74 C-112,104 -116,142 -93,166"/>
    <path d="M76,78 C108,105 114,137 91,168"/>
    <path d="M-24,103 C-42,133 -34,158 -13,178"/>
  </g>

  <g id="tendrils" fill="none" stroke-linecap="round">
    <g id="tendril-1" class="anim">
      <path d="M-63,24 C-120,2 -151,-24 -176,-61 C-189,-80 -188,-103 -169,-113" stroke="#9b592d" stroke-width="18"/>
      <path d="M-63,24 C-120,2 -151,-24 -176,-61 C-189,-80 -188,-103 -169,-113" stroke="#ffb66f" stroke-width="5" opacity=".75"/>
    </g>
    <g id="tendril-2" class="anim">
      <path d="M65,25 C120,7 149,-19 175,-53 C193,-77 190,-99 168,-120" stroke="#8f5228" stroke-width="19"/>
      <path d="M65,25 C120,7 149,-19 175,-53 C193,-77 190,-99 168,-120" stroke="#ffd0a0" stroke-width="5" opacity=".65"/>
    </g>
    <g id="tendril-3" class="anim">
      <path d="M-48,62 C-79,91 -91,119 -78,147 C-67,170 -45,176 -30,159" stroke="#8f5228" stroke-width="17"/>
      <path d="M-48,62 C-79,91 -91,119 -78,147 C-67,170 -45,176 -30,159" stroke="#ffad69" stroke-width="4" opacity=".7"/>
    </g>
    <g id="tendril-4" class="anim">
      <path d="M47,60 C77,91 91,119 79,146 C68,170 47,176 29,158" stroke="#8f5228" stroke-width="17"/>
      <path d="M47,60 C77,91 91,119 79,146 C68,170 47,176 29,158" stroke="#ffad69" stroke-width="4" opacity=".7"/>
    </g>
    <g id="tendril-5" class="anim">
      <path d="M0,76 C-4,110 5,132 24,145 C41,157 58,153 65,138" stroke="#9b592d" stroke-width="14"/>
      <path d="M0,76 C-4,110 5,132 24,145 C41,157 58,153 65,138" stroke="#ffd0a0" stroke-width="4" opacity=".6"/>
    </g>
  </g>

  <g id="body-shell" class="anim">
    <path id="body-shadow" d="M-91,18 C-91,-58 -48,-103 0,-108 C53,-103 91,-59 91,17 C91,74 55,106 0,111 C-56,106 -91,74 -91,18Z" fill="#70401f" opacity=".8"/>
    <path id="body-shape" d="M-84,10 C-90,-35 -65,-83 -19,-101 C14,-114 62,-91 82,-53 C104,-12 89,44 60,76 C39,99 5,108 -31,98 C-68,88 -91,54 -84,10Z" fill="url(#queenBody)"/>
    <path id="body-highlight" d="M-59,-43 C-39,-76 -6,-91 25,-83" fill="none" stroke="#ffe8ce" stroke-width="10" stroke-linecap="round" opacity=".72"/>
    <path id="surface-folds" d="M-67,43 C-39,58 -22,64 -2,61 M35,-69 C52,-50 61,-27 59,-4 M-20,90 C-6,75 7,71 22,73" fill="none" stroke="#8f5228" stroke-width="5" opacity=".7"/>
  </g>

  <g id="core-mass" class="anim">
    <ellipse id="core-body" cx="0" cy="7" rx="39" ry="47" fill="url(#queenCore)" opacity=".88"/>
    <ellipse id="core-glow" cx="-8" cy="-5" rx="24" ry="31" fill="#fff1df" opacity=".4" filter="url(#softBlur)"/>
    <path id="core-seam" d="M-17,-30 C7,-13 17,5 11,30 C5,43 -9,47 -18,34" fill="none" stroke="#9b5126" stroke-width="6" opacity=".8"/>
  </g>

  <g id="veins" fill="none" stroke="#8f5228" stroke-linecap="round">
    <path id="vein-1" d="M-26,-12 C-53,-31 -58,-50 -67,-66" stroke-width="6"/>
    <path id="vein-2" d="M22,-8 C49,-27 58,-43 67,-60" stroke-width="5"/>
    <path id="vein-3" d="M-18,35 C-44,51 -52,65 -55,78" stroke-width="6"/>
    <path id="vein-4" d="M19,36 C41,52 48,67 53,80" stroke-width="5"/>
  </g>

  <g id="eggs">
    <g id="egg-1" class="anim">
      <ellipse cx="-58" cy="-18" rx="14" ry="20" fill="#ffd0a0" opacity=".82"/>
      <ellipse cx="-61" cy="-23" rx="5" ry="8" fill="#fff1df" opacity=".6"/>
    </g>
    <g id="egg-2" class="anim">
      <ellipse cx="57" cy="-15" rx="13" ry="19" fill="#ffd0a0" opacity=".82"/>
      <ellipse cx="54" cy="-20" rx="5" ry="7" fill="#fff1df" opacity=".6"/>
    </g>
    <g id="egg-3" class="anim">
      <ellipse cx="-47" cy="58" rx="12" ry="17" fill="#ffb66f" opacity=".85"/>
    </g>
    <g id="egg-4" class="anim">
      <ellipse cx="48" cy="57" rx="12" ry="17" fill="#ffb66f" opacity=".85"/>
    </g>
  </g>

  <g id="feed-lines" fill="none" stroke="#ffe0bd" stroke-width="3" opacity=".35">
    <path d="M-173,-112 C-137,-102 -105,-77 -72,-48"/>
    <path d="M168,-119 C133,-103 104,-77 70,-47"/>
    <path d="M-77,146 C-61,121 -49,103 -39,82"/>
    <path d="M80,145 C62,121 49,102 38,82"/>
  </g>

  <g id="buff-motes" fill="#fff1df">
    <circle id="mote-1" cx="-110" cy="-77" r="4" opacity=".65"/>
    <circle id="mote-2" cx="112" cy="-76" r="4" opacity=".65"/>
    <circle id="mote-3" cx="-67" cy="119" r="4" opacity=".65"/>
    <circle id="mote-4" cx="70" cy="119" r="4" opacity=".65"/>
  </g>

  <g id="rot-cracks" fill="none" stroke="#70401f" stroke-width="5" opacity="0">
    <path d="M-57,-8 l-18,10 14,13 -17,17"/>
    <path d="M52,0 l20,9 -12,16 16,13"/>
    <path d="M-15,65 l-4,17 13,8"/>
  </g>

  <path id="damage-flash" d="M-84,10 C-90,-35 -65,-83 -19,-101 C14,-114 62,-91 82,-53 C104,-12 89,44 60,76 C39,99 5,108 -31,98 C-68,88 -91,54 -84,10Z" fill="#fff" opacity="0"/>

  <g id="death-debris" fill="#ff9f5a" opacity="0">
    <path d="M-104,-35 l-23,-15 9,28z"/>
    <path d="M105,-29 l25,-19 -7,31z"/>
    <path d="M-73,91 l-14,27 27,-12z"/>
    <path d="M72,91 l16,27 -27,-12z"/>
  </g>
</g>
</svg>
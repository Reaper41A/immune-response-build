<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="-24 -24 48 48">
  <defs>
    <radialGradient id="shellGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#d7ffad"/>
      <stop offset="42%" stop-color="#8fe36a"/>
      <stop offset="78%" stop-color="#6aa84f"/>
      <stop offset="100%" stop-color="#4f7d3d"/>
    </radialGradient>

    <filter id="auraBlur" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <style>
      /* Pickup — small collectible, floats and glimmers to draw the eye.
         .spawning plays once on creation (JS adds the class then removes it
         after the animation ends), .collected plays once when a player
         picks it up (JS removes the DOM node after this finishes). */
      #pickup{transform-origin:0 0;animation:pickupBob 1.6s ease-in-out infinite}
      #aura{animation:pickupAuraPulse 1.6s ease-in-out infinite}
      #shell{animation:pickupSpin 3.2s ease-in-out infinite}
      #shimmer{animation:pickupShimmerSweep 2.4s ease-in-out infinite}

      #pickup.spawning{animation:pickupBob 1.6s ease-in-out infinite,pickupSpawnIn .35s cubic-bezier(.2,.9,.3,1.3)}
      #pickup.spawning #aura{animation:pickupAuraPulse 1.6s ease-in-out infinite,pickupSpawnAura .35s ease-out}

      #pickup.collected{animation:pickupCollect .3s ease-in forwards}
      #pickup.collected #aura{animation:pickupCollectAura .3s ease-out forwards}
      #pickup.collected #shimmer{animation:pickupCollectShimmer .3s ease-out forwards}

      @keyframes pickupBob{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-2px)}}
      @keyframes pickupAuraPulse{0%,100%{opacity:.18;transform:scale(.9)}50%{opacity:.32;transform:scale(1.15)}}
      @keyframes pickupSpin{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
      @keyframes pickupShimmerSweep{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes pickupSpawnIn{0%{transform:scale(0) translate(0,-2px)}100%{transform:scale(1) translate(0,-2px)}}
      @keyframes pickupSpawnAura{0%{opacity:0;transform:scale(2)}100%{opacity:.22;transform:scale(1)}}
      @keyframes pickupCollect{0%{transform:scale(1);opacity:1}100%{transform:scale(1.8) translate(0,-8px);opacity:0}}
      @keyframes pickupCollectAura{0%{opacity:.3;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
      @keyframes pickupCollectShimmer{0%{opacity:.8}100%{opacity:0}}
    </style>
  </defs>

  <!-- Root: renderer may translate/animate this group -->
  <g id="pickup" transform-origin="0 0">

    <!-- Soft collectible glow -->
    <ellipse id="aura"
      cx="0" cy="0" rx="11" ry="8"
      fill="#8fe36a" opacity=".22"
      filter="url(#auraBlur)"/>

    <!-- Vesicle-like pickup shell -->
    <g id="shell" transform-box="fill-box" transform-origin="center">
      <path id="shell-shape"
        d="M -7,-1
           C -7,-5 -4,-8 0,-8
           C 4,-8 8,-5 8,-1
           C 8,3 5,7 1,8
           C -3,8 -7,5 -7,-1 Z"
        fill="url(#shellGradient)"
        stroke="#5f963f"
        stroke-width="0.8"/>

      <!-- Inner vesicle pocket -->
      <path
        d="M -4,-1 C -4,-4 -2,-5 1,-5 C 4,-4 5,-2 4,0
           C 3,3 1,4 -2,3 C -4,2 -5,1 -4,-1 Z"
        fill="#b8f58f"
        opacity=".24"/>

      <!-- Upper-left gloss -->
      <path
        d="M -4,-4 C -2,-6 1,-6 3,-5 C 1,-3 -1,-2 -3,-2 C -4,-2 -5,-3 -4,-4 Z"
        fill="url(#highlightGradient)"
        opacity=".75"/>
    </g>

    <!-- Shimmer sweep; animation is intentionally left to renderer/CSS -->
    <g id="shimmer" transform-box="fill-box" transform-origin="center" opacity=".8">
      <path
        d="M -5,3 C -2,1 1,-2 4,-5"
        fill="none"
        stroke="#ffffff"
        stroke-width="1.1"
        stroke-linecap="round"
        opacity=".7"/>
    </g>
  </g>
</svg>

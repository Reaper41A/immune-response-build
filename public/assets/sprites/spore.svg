<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="-60 -60 120 120">
  <defs>
    <radialGradient id="sporeGradient" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffd9ec"/>
      <stop offset="55%" stop-color="#e8a6c9"/>
      <stop offset="100%" stop-color="#8f5570"/>
    </radialGradient>
    <radialGradient id="maturityGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#ffd9ec"/>
      <stop offset="100%" stop-color="#e8a6c9"/>
    </radialGradient>
    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      /* Spore — simplest entity, idle + maturing + hit + death only.
         #maturity-core's scale is driven CONTINUOUSLY by JS every frame off
         sim time-to-maturity (not a CSS keyframe loop — see svgFX.js), so no
         animation is declared on it here beyond a resting transform-origin;
         JS sets an inline transform directly. Death is minor/quick — this
         is the lowest-value kill in the game and should read that way. */
      #spore{transform-origin:0 0}
      #aura{animation:sporeAura 2.4s ease-in-out infinite}
      #shell{transform-box:fill-box;transform-origin:center;animation:sporeIdle 2s ease-in-out infinite}
      #maturity-core{transform-box:fill-box;transform-origin:center}
      .damage-flash{opacity:0;pointer-events:none}

      #spore.state-hit #shell{animation:sporeHit .16s ease-out}
      #spore.state-hit .damage-flash{animation:sporeFlash .16s ease-out}

      #spore.state-death #shell{animation:sporeDeathShell .28s ease-in forwards}
      #spore.state-death #maturity-core{animation:sporeDeathCore .28s ease-in forwards}
      #spore.state-death #aura{animation:sporeFadeOut .22s ease-out forwards}

      @keyframes sporeAura{0%,100%{opacity:.12;transform:scale(.95)}50%{opacity:.22;transform:scale(1.08)}}
      @keyframes sporeIdle{0%,100%{transform:scale(1)}50%{transform:scale(1.06,1.09)}}
      @keyframes sporeHit{0%{transform:scale(1)}40%{transform:scale(1.15,.85)}100%{transform:scale(1)}}
      @keyframes sporeFlash{0%,100%{opacity:0}25%{opacity:.85}}
      @keyframes sporeDeathShell{0%{transform:scale(1);opacity:1}100%{transform:scale(1.4,.5);opacity:0}}
      @keyframes sporeDeathCore{0%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
      @keyframes sporeFadeOut{0%{opacity:1}100%{opacity:0}}
    </style>
  </defs>

  <g id="spore" transform-origin="0 0">

    <circle id="aura" cx="0" cy="0" r="24"
      fill="#ffd9ec" opacity="0.16" filter="url(#auraBlur)"/>

    <!-- Thin translucent shell -->
    <g id="shell" transform-box="fill-box" transform-origin="center">
      <ellipse id="shell-shape" cx="0" cy="0" rx="15.5" ry="17"
        fill="url(#sporeGradient)" opacity="0.72"
        stroke="#8f5570" stroke-width="1.6"/>

      <!-- Small upper-left membrane gloss -->
      <path id="shell-highlight"
        d="M -9,-8 C -5,-14 2,-16 7,-12"
        fill="none" stroke="#ffffff" stroke-width="2.1"
        stroke-linecap="round" opacity="0.34"/>
    </g>

    <!-- Maturation indicator: JS scales this continuously from sim time -->
    <g id="maturity-core" transform-box="fill-box" transform-origin="center">
      <circle cx="0" cy="0" r="8"
        fill="url(#maturityGradient)" opacity="0.24"/>
      <circle cx="0" cy="0" r="4.5"
        fill="#ffd9ec" opacity="0.78"/>
      <circle cx="-1.5" cy="-2" r="1.6"
        fill="#ffffff" opacity="0.82"/>
    </g>

    <!-- Renderer-controlled damage flash -->
    <ellipse id="damage-flash" cx="0" cy="0" rx="15.5" ry="17"
      fill="#ffffff" opacity="0"/>
  </g>
</svg>

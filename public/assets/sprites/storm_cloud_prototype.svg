<svg xmlns="http://www.w3.org/2000/svg" width="170" height="170" viewBox="-85 -85 170 170">
<defs>
 <radialGradient id="stormGradient" cx="35%" cy="30%" r="75%">
  <stop offset="0" stop-color="#fff6cf"/><stop offset=".58" stop-color="#ffe27a"/><stop offset="1" stop-color="#8f7d2e"/>
 </radialGradient>
 <filter id="stormGlow"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="softBlur"><feGaussianBlur stdDeviation="2.2"/></filter>
 <style>
   /* Storm Cloud — passive pulse-aura support unit. Lobes drift independently
      and out of phase (cloud-like, never rigid). internal-charge intensifies
      right before a pulse fires — JS toggles .charging (driven by the sim's
      pulse timer) rather than a state-attack class, since this is a passive
      aura not a direct attack. Death disperses outward like gas breaking
      apart, distinctly non-solid vs every other death in the roster.
      No attack state (matches spec: aura support, not an attacker). */
   #cytokineStormCloud{transform-origin:0 0}
   #aura{animation:stormAura 3s ease-in-out infinite}
   #lobe-1{animation:stormLobe1 3.6s ease-in-out infinite}
   #lobe-2{animation:stormLobe2 4.2s ease-in-out infinite .4s}
   #lobe-3{animation:stormLobe3 3.9s ease-in-out infinite .8s}
   #lobe-4{animation:stormLobe4 4.5s ease-in-out infinite 1.2s}
   #internal-charge{animation:stormCharge 2.2s ease-in-out infinite}
   #pulse-source{animation:stormSource 2.2s ease-in-out infinite}
   .damage-flash{opacity:0;pointer-events:none}

   #cytokineStormCloud.charging #internal-charge{animation:stormChargeUp 1s ease-in forwards}
   #cytokineStormCloud.charging #pulse-source{animation:stormSourceUp 1s ease-in forwards}

   /* .pulsing fires for a short window the instant the buff actually goes
      out (JS toggles it off the sim's own pulse-fire flag, not a guess) —
      the aura blows outward like a shockwave and the charge/source snap
      back down from their charged-up state, selling "release" rather than
      just holding the swollen look indefinitely. */
   #cytokineStormCloud.pulsing #aura{animation:stormPulseRing .65s cubic-bezier(.1,.7,.3,1)}
   #cytokineStormCloud.pulsing #internal-charge{animation:stormChargeRelease .5s ease-out}
   #cytokineStormCloud.pulsing #pulse-source{animation:stormSourceRelease .5s ease-out}
   #cytokineStormCloud.pulsing #cloud-mass{animation:stormMassKick .4s ease-out}

   #cytokineStormCloud.state-hit #cloud-mass{animation:stormJolt .22s ease-out}
   #cytokineStormCloud.state-hit .damage-flash{animation:stormFlash .2s ease-out}

   #cytokineStormCloud.state-critical #internal-charge{animation:stormChargeErratic .3s steps(3) infinite}
   #cytokineStormCloud.state-critical #cloud-mass{animation:stormCriticalDrift .5s ease-in-out infinite}

   #cytokineStormCloud.state-death #lobe-1{animation:stormDisperse1 .9s ease-out forwards}
   #cytokineStormCloud.state-death #lobe-2{animation:stormDisperse2 .9s ease-out forwards .05s}
   #cytokineStormCloud.state-death #lobe-3{animation:stormDisperse3 .9s ease-out forwards .1s}
   #cytokineStormCloud.state-death #lobe-4{animation:stormDisperse4 .9s ease-out forwards .15s}
   #cytokineStormCloud.state-death #internal-charge,
   #cytokineStormCloud.state-death #pulse-source,
   #cytokineStormCloud.state-death #aura{animation:stormFadeOut .5s ease-out forwards}

   @keyframes stormAura{0%,100%{opacity:.18;transform:scale(.95)}50%{opacity:.32;transform:scale(1.08)}}
   @keyframes stormLobe1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-2px,1.5px) scale(1.05)}}
   @keyframes stormLobe2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(1.5px,-2px) scale(1.04)}}
   @keyframes stormLobe3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(2px,1px) scale(1.06)}}
   @keyframes stormLobe4{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-1.5px,-1.5px) scale(1.03)}}
   @keyframes stormCharge{0%,100%{opacity:.6}50%{opacity:1}}
   @keyframes stormSource{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
   @keyframes stormChargeUp{0%{opacity:.6;transform:scale(1)}100%{opacity:1;transform:scale(1.6)}}
   @keyframes stormSourceUp{0%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(2.2)}}
   @keyframes stormPulseRing{0%{opacity:.6;transform:scale(1)}40%{opacity:.9;transform:scale(1.9)}100%{opacity:0;transform:scale(3.4)}}
   @keyframes stormChargeRelease{0%{opacity:1;transform:scale(1.6)}100%{opacity:.6;transform:scale(1)}}
   @keyframes stormSourceRelease{0%{opacity:1;transform:scale(2.2)}100%{opacity:.7;transform:scale(1)}}
   @keyframes stormMassKick{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
   @keyframes stormJolt{0%{transform:translate(0,0)}30%{transform:translate(1.5px,-1px)}100%{transform:translate(0,0)}}
   @keyframes stormFlash{0%,100%{opacity:0}22%{opacity:.8}}
   @keyframes stormChargeErratic{0%,100%{opacity:.4}50%{opacity:1}}
   @keyframes stormCriticalDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}}
   @keyframes stormDisperse1{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-30px,18px) scale(1.6);opacity:0}}
   @keyframes stormDisperse2{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(14px,-30px) scale(1.7);opacity:0}}
   @keyframes stormDisperse3{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(32px,14px) scale(1.6);opacity:0}}
   @keyframes stormDisperse4{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(-6px,32px) scale(1.5);opacity:0}}
   @keyframes stormFadeOut{0%{opacity:1}100%{opacity:0}}
 </style>
</defs>
<g id="cytokineStormCloud" transform-origin="0 0">
 <ellipse id="aura" cx="0" cy="4" rx="43" ry="30" fill="#fff6cf" opacity=".22" filter="url(#stormGlow)"/>
 <g id="cloud-mass">
  <g id="lobe-1" transform-box="fill-box" transform-origin="center">
   <ellipse cx="-20" cy="8" rx="23" ry="18" fill="url(#stormGradient)"/>
  </g>
  <g id="lobe-2" transform-box="fill-box" transform-origin="center">
   <ellipse cx="-2" cy="-8" rx="25" ry="22" fill="url(#stormGradient)"/>
  </g>
  <g id="lobe-3" transform-box="fill-box" transform-origin="center">
   <ellipse cx="19" cy="3" rx="24" ry="20" fill="url(#stormGradient)"/>
  </g>
  <g id="lobe-4" transform-box="fill-box" transform-origin="center">
   <ellipse cx="5" cy="16" rx="28" ry="17" fill="url(#stormGradient)"/>
  </g>
 </g>
 <path d="M-25 5 Q-13 -10 -2 2 T18 -1" fill="none" stroke="#fff6cf" stroke-width="2.4" opacity=".7" filter="url(#softBlur)"/>
 <path d="M-10 15 Q2 4 13 12" fill="none" stroke="#fff6cf" stroke-width="1.8" opacity=".65"/>
 <path id="internal-charge" d="M-8 -1 l5 6 -4 4 M10 -7 l-4 7 5 2 M-24 12 l5 -4 2 5" fill="none" stroke="#fff6cf" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
 <g id="pulse-source">
  <circle cx="2" cy="4" r="5" fill="#fff6cf" opacity=".9" filter="url(#softBlur)"/>
  <circle cx="2" cy="4" r="2.2" fill="#fff6cf"/>
 </g>
 <path d="M-22 -10 Q-8 -25 7 -20" fill="none" stroke="#fff6cf" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
 <path id="damage-flash" d="M-43 8 Q-39 -17 -16 -29 Q5 -38 28 -24 Q46 -12 45 8 Q43 29 18 35 Q-7 41 -30 30 Q-45 22 -43 8 Z" fill="white" opacity="0"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="190" height="190" viewBox="-95 -95 190 190">
  <defs>
    <radialGradient id="macroGradient" cx="32%" cy="27%" r="82%">
      <stop offset="0%" stop-color="#dff6ff"/>
      <stop offset="52%" stop-color="#7fd6ff"/>
      <stop offset="100%" stop-color="#3b718c"/>
    </radialGradient>
    <radialGradient id="innerGradient" cx="34%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#bdeaff"/>
      <stop offset="100%" stop-color="#7fd6ff"/>
    </radialGradient>
    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      /* Macrophage (Tank) — broad, engulfing, defensive. #facing-indicator's
         rotation is set inline by JS every frame from p.f (continuous world
         state, not a CSS keyframe) — CSS here only handles its idle sway.
         Taunt (special/ability): pseudopod-nubs extend outward, engulfing-core
         brightens, matching the pull-effect the renderer draws separately. */
      #macrophage{transform-origin:0 0}
      #aura{animation:macroAura 3.2s ease-in-out infinite}
      #body{transform-box:fill-box;transform-origin:center;animation:macroBreathe 2.6s ease-in-out infinite}
      #pseudopod-1{animation:macroPod1 3.4s ease-in-out infinite}
      #pseudopod-2{animation:macroPod2 3.8s ease-in-out infinite .3s}
      #pseudopod-3{animation:macroPod3 3.6s ease-in-out infinite .6s}
      #pseudopod-4{animation:macroPod4 4s ease-in-out infinite .9s}
      #engulfing-core{animation:macroCoreGlow 2.4s ease-in-out infinite}
      .damage-flash{opacity:0;pointer-events:none}

      #macrophage.state-move #body{animation:macroBreathe 1.4s ease-in-out infinite}

      #macrophage.ability-active #pseudopod-1,#macrophage.ability-active #pseudopod-2,
      #macrophage.ability-active #pseudopod-3,#macrophage.ability-active #pseudopod-4{animation:macroPodExtend .6s ease-out infinite alternate}
      #macrophage.ability-active #engulfing-core{animation:macroCoreSurge .6s ease-in-out infinite}
      #macrophage.ability-active #aura{animation:macroAuraTaunt .8s ease-in-out infinite}

      #macrophage.state-hit #body{animation:macroHit .2s ease-out}
      #macrophage.state-hit .damage-flash{animation:macroFlash .2s ease-out}

      @keyframes macroAura{0%,100%{opacity:.16;transform:scale(.97)}50%{opacity:.26;transform:scale(1.03)}}
      @keyframes macroBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
      @keyframes macroPod1{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
      @keyframes macroPod2{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes macroPod3{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
      @keyframes macroPod4{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
      @keyframes macroCoreGlow{0%,100%{opacity:.28}50%{opacity:.42}}
      @keyframes macroPodExtend{0%{transform:scale(1)}100%{transform:scale(1.35)}}
      @keyframes macroCoreSurge{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.7;transform:scale(1.3)}}
      @keyframes macroAuraTaunt{0%,100%{opacity:.3;transform:scale(1.05)}50%{opacity:.55;transform:scale(1.25)}}
      @keyframes macroHit{0%{transform:scale(1)}35%{transform:scale(1.08,.92)}100%{transform:scale(1)}}
      @keyframes macroFlash{0%,100%{opacity:0}22%{opacity:.85}}
    </style>
  </defs>

  <g id="macrophage" transform-origin="0 0">

    <!-- Broad, defensive aura -->
    <path id="aura"
      d="M -65,-5
         C -61,-37 -36,-59 -5,-62
         C 25,-65 53,-49 62,-22
         C 72,7 58,39 35,54
         C 9,71 -28,65 -49,45
         C -65,30 -72,12 -65,-5 Z"
      fill="#7fd6ff" opacity="0.18" filter="url(#auraBlur)"/>

    <!-- Pseudopod crown: intentionally chunky and asymmetrical -->
    <g id="pseudopod-nubs" transform-box="fill-box" transform-origin="center">
      <g id="pseudopod-1" transform-box="fill-box" transform-origin="right center">
        <path d="M -39,-30 C -57,-43 -64,-55 -56,-64 C -49,-70 -39,-64 -37,-53 L -25,-39 Z"
          fill="url(#macroGradient)" stroke="#3b718c" stroke-width="2"/>
      </g>
      <g id="pseudopod-2" transform-box="fill-box" transform-origin="center">
        <path d="M 24,-39 C 30,-58 40,-66 49,-61 C 57,-56 53,-45 43,-35 L 32,-25 Z"
          fill="url(#macroGradient)" stroke="#3b718c" stroke-width="2"/>
      </g>
      <g id="pseudopod-3" transform-box="fill-box" transform-origin="left center">
        <path d="M 38,24 C 56,20 67,25 67,36 C 66,47 52,50 40,43 L 28,35 Z"
          fill="url(#macroGradient)" stroke="#3b718c" stroke-width="2"/>
      </g>
      <g id="pseudopod-4" transform-box="fill-box" transform-origin="center">
        <path d="M -35,35 C -51,43 -61,42 -65,34 C -69,25 -59,18 -48,18 L -34,23 Z"
          fill="url(#macroGradient)" stroke="#3b718c" stroke-width="2"/>
      </g>
    </g>

    <!-- Thick folded body, more like an armored amoeboid than a circle -->
    <g id="body" transform-box="fill-box" transform-origin="center">
      <path id="body-shape"
        d="M -41,-17
           C -49,-32 -38,-50 -20,-53
           C -7,-59 8,-52 18,-48
           C 37,-48 51,-33 49,-16
           C 59,-3 51,16 40,25
           C 35,43 16,51 0,46
           C -14,55 -33,46 -39,31
           C -54,23 -55,1 -41,-17 Z"
        fill="url(#macroGradient)"
        stroke="#3b718c" stroke-width="2.8" stroke-linejoin="round"/>

      <!-- Raised membrane folds give the tank a plated/defensive feel -->
      <path d="M -34,-18 C -28,-38 -10,-46 7,-43"
        fill="none" stroke="#dff6ff" stroke-width="5"
        stroke-linecap="round" opacity="0.38"/>
      <path d="M 29,-27 C 42,-17 44,-4 39,8"
        fill="none" stroke="#3b718c" stroke-width="5"
        stroke-linecap="round" opacity="0.28"/>

      <!-- Engulfing-cell inner warmth -->
      <ellipse id="engulfing-core" cx="-2" cy="3" rx="22" ry="18"
        fill="url(#innerGradient)" opacity="0.34" filter="url(#softBlur)"/>
      <ellipse cx="-6" cy="-1" rx="10" ry="7"
        fill="#ffffff" opacity="0.16"/>
    </g>

    <!-- Direction cue is integrated into the anatomy rather than a detached line -->
    <g id="facing-indicator" transform-box="fill-box" transform-origin="left center">
      <path d="M 38,-5 C 51,-4 60,0 68,7"
        fill="none" stroke="#dff6ff" stroke-width="3.5"
        stroke-linecap="round" opacity="0.9"/>
      <path d="M 61,2 L 69,7 L 61,12"
        fill="none" stroke="#dff6ff" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>

    <!-- Renderer-controlled damage flash -->
    <path id="damage-flash"
      d="M -41,-17
         C -49,-32 -38,-50 -20,-53
         C -7,-59 8,-52 18,-48
         C 37,-48 51,-33 49,-16
         C 59,-3 51,16 40,25
         C 35,43 16,51 0,46
         C -14,55 -33,46 -39,31
         C -54,23 -55,1 -41,-17 Z"
      fill="#ffffff" opacity="0"/>
  </g>
</svg>

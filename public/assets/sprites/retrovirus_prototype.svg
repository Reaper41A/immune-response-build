<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="-80 -80 160 160">
  <defs>
    <radialGradient id="retrovirusGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f5c8ff"/>
      <stop offset="55%" stop-color="#e35bff"/>
      <stop offset="100%" stop-color="#7a2e8f"/>
    </radialGradient>
    <radialGradient id="retroGlow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f5c8ff" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#e35bff" stop-opacity=".05"/>
    </radialGradient>
    <linearGradient id="streakGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c8ff"/>
      <stop offset="100%" stop-color="#e35bff"/>
    </linearGradient>
    <filter id="blurGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <style>
      /* Retrovirus (alt build) — same animation language as retrovirus.svg.
         tail-vane-1/2 keep their static transform-origin attrs (SVG presentation
         attribute, untouched by CSS animation since we only animate `transform`
         here, not `transform-origin`). */
      #retrovirus{transform-origin:0 0}
      #aura{animation:retroAuraPulse2 1.1s ease-in-out infinite}
      #body{transform-box:fill-box;transform-origin:center;animation:retroWobble2 .5s ease-in-out infinite}
      #tail-vane-1{animation:retroVane1 .19s ease-in-out infinite}
      #tail-vane-2{animation:retroVane2 .22s ease-in-out infinite}
      .damage-flash{opacity:0;pointer-events:none}
      #cloak-shimmer{opacity:0}

      #retrovirus.state-move #body{animation:retroWobble2 .28s ease-in-out infinite}
      #retrovirus.state-move #aura{animation:retroAuraPulse2 .6s ease-in-out infinite}

      #retrovirus.cloak-active #body{animation:retroWobble2 .5s ease-in-out infinite,retroCloakFade2 .4s ease-out forwards}
      #retrovirus.cloak-active #cloak-shimmer{animation:retroShimmerIn2 .4s ease-out forwards}

      #retrovirus.state-hit #body{animation:retroHit2 .16s ease-out}
      #retrovirus.state-hit .damage-flash{animation:retroFlash2 .16s ease-out}

      #retrovirus.state-critical #body{animation:retroCriticalShake2 .3s ease-in-out infinite}

      #retrovirus.state-death #body{animation:retroShatterBody2 .32s ease-in forwards}
      #retrovirus.state-death #tail-vane-1{animation:retroShatterVane1 .32s ease-in forwards}
      #retrovirus.state-death #tail-vane-2{animation:retroShatterVane2 .32s ease-in forwards}
      #retrovirus.state-death #aura{animation:retroFadeOut2 .25s ease-out forwards}

      @keyframes retroAuraPulse2{0%,100%{opacity:.5;transform:scaleX(1)}50%{opacity:.8;transform:scaleX(1.08)}}
      @keyframes retroWobble2{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
      @keyframes retroVane1{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg)}}
      @keyframes retroVane2{0%,100%{transform:rotate(0deg)}50%{transform:rotate(9deg)}}
      @keyframes retroHit2{0%{transform:scale(1)}40%{transform:translate(-2px,0) scale(.85,1.15)}100%{transform:scale(1)}}
      @keyframes retroFlash2{0%,100%{opacity:0}25%{opacity:.9}}
      @keyframes retroCriticalShake2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(0,.8px) rotate(-4deg)}}
      @keyframes retroCloakFade2{0%{opacity:1}100%{opacity:.35}}
      @keyframes retroShimmerIn2{0%{opacity:0}100%{opacity:1}}
      @keyframes retroShatterBody2{0%{transform:scale(1);opacity:1}100%{transform:scale(1.6,.3) translate(20px,0);opacity:0}}
      @keyframes retroShatterVane1{0%{transform:rotate(0);opacity:1}100%{transform:rotate(-60deg) translate(-14px,-6px);opacity:0}}
      @keyframes retroShatterVane2{0%{transform:rotate(0);opacity:1}100%{transform:rotate(60deg) translate(-14px,6px);opacity:0}}
      @keyframes retroFadeOut2{0%{opacity:1}100%{opacity:0}}
    </style>
  </defs>

  <g id="retrovirus" transform-origin="0 0">
    <!-- Motion-streaked aura; elongated toward the forward/right direction. -->
    <g id="aura" transform-origin="0 0">
      <path d="M-47 12 C-31 2 -15 -7 7 -12 C25 -16 43 -15 57 -8 C38 -1 22 8 7 17 C-9 26 -28 31 -46 29 Z"
            fill="url(#retroGlow)" opacity=".42" filter="url(#blurGlow)"/>
      <path d="M-39 18 C-21 10 -4 1 16 -5 C29 -9 42 -8 51 -4 C33 3 18 10 4 18 C-10 25 -25 27 -39 26 Z"
            fill="none" stroke="#f5c8ff" stroke-width="3" opacity=".18" filter="url(#softBlur)"/>
    </g>

    <g id="body" transform-origin="0 0">
      <path id="body-shape"
            d="M-31 3 L-15 -8 L29 -24 L47 -18 L35 -5 L52 2 L31 13 L-13 20 L-34 13 Z"
            fill="url(#retrovirusGradient)" stroke="#7a2e8f" stroke-width="2" stroke-linejoin="round"/>
      <path id="body-highlight"
            d="M-12 -8 L25 -21 L39 -17"
            fill="none" stroke="url(#streakGradient)" stroke-width="4" stroke-linecap="round" opacity=".82"/>
      <path d="M-19 4 L20 -11" fill="none" stroke="#f5c8ff" stroke-width="2" stroke-linecap="round" opacity=".32"/>
    </g>

    <g id="tail-vanes" transform-origin="0 0">
      <g id="tail-vane-1" transform-origin="-28 9">
        <path d="M-26 9 L-48 22 L-29 15 Z" fill="#e35bff" stroke="#7a2e8f" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
      <g id="tail-vane-2" transform-origin="-28 9">
        <path d="M-27 7 L-49 -2 L-29 3 Z" fill="#e35bff" stroke="#7a2e8f" stroke-width="1.5" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Cloak/phasing surface; renderer can fade opacity and apply shimmer treatment. -->
    <g id="cloak-shimmer" opacity="0" pointer-events="none">
      <path d="M-31 3 L-15 -8 L29 -24 L47 -18 L35 -5 L52 2 L31 13 L-13 20 L-34 13 Z"
            fill="none" stroke="#f5c8ff" stroke-width="2" stroke-dasharray="4 5" opacity=".8"/>
      <path d="M-22 15 L12 -18" stroke="#f5c8ff" stroke-width="1.5" opacity=".65"/>
      <path d="M-8 18 L27 -15" stroke="#f5c8ff" stroke-width="1.5" opacity=".45"/>
    </g>

    <path id="damage-flash"
          d="M-31 3 L-15 -8 L29 -24 L47 -18 L35 -5 L52 2 L31 13 L-13 20 L-34 13 Z"
          fill="#ffffff" opacity="0"/>
  </g>
</svg>

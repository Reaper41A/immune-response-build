<svg xmlns="http://www.w3.org/2000/svg"
     width="720" height="360" viewBox="0 0 720 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Living Background Vein Segment</title>
  <desc id="desc">A modular biological blood-vessel network with a thick pulsing vessel, branching capillaries, valves, tissue walls, and independently animatable blood-flow particles.</desc>

  <defs>
    <linearGradient id="vesselWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e424b"/>
      <stop offset="42%" stop-color="#492c38"/>
      <stop offset="100%" stop-color="#211b29"/>
    </linearGradient>

    <linearGradient id="vesselInner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#321f2a"/>
      <stop offset="48%" stop-color="#5b303c"/>
      <stop offset="100%" stop-color="#251923"/>
    </linearGradient>

    <radialGradient id="bloodGlow" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff7775"/>
      <stop offset="42%" stop-color="#d9434f"/>
      <stop offset="100%" stop-color="#721f36"/>
    </radialGradient>

    <linearGradient id="capillaryWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#613641"/>
      <stop offset="100%" stop-color="#291e2b"/>
    </linearGradient>

    <filter id="vesselGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="softGlow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="bloodBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- Main vessel follows a sweeping organic route rather than radiating from a center. -->
    <path id="main-vessel-center"
      d="M -35 248
         C 42 229 74 185 132 169
         C 194 151 221 164 276 135
         C 337 103 366 82 426 93
         C 489 105 512 72 553 54
         C 596 35 634 42 755 19"/>

    <path id="main-vessel-outline"
      d="M -43 261
         C 37 242 67 198 127 181
         C 194 162 224 177 283 147
         C 342 117 370 95 424 106
         C 488 119 515 86 558 67
         C 604 47 644 55 760 31
         L 760 7
         C 642 30 601 22 548 42
         C 504 59 479 91 429 80
         C 365 67 331 91 269 122
         C 215 149 188 136 121 157
         C 59 176 26 218 -47 235 Z"/>

    <!-- Branch paths. -->
    <path id="branch-a"
      d="M 126 181 C 105 143 101 109 118 72 C 131 44 130 21 114 -4"/>
    <path id="branch-b"
      d="M 218 166 C 238 133 248 102 239 66 C 233 39 244 16 264 -2"/>
    <path id="branch-c"
      d="M 368 96 C 346 68 342 42 354 17 C 367 -10 367 -31 351 -54"/>
    <path id="branch-d"
      d="M 514 83 C 540 99 558 119 561 145 C 564 170 581 185 607 194"/>
    <path id="branch-e"
      d="M 578 50 C 600 31 619 6 621 -19 C 622 -39 634 -56 652 -67"/>

    <path id="micro-a" d="M 114 74 C 90 63 73 49 66 28 C 61 13 50 2 35 -5"/>
    <path id="micro-b" d="M 239 67 C 273 62 294 45 304 20 C 309 7 320 -5 334 -10"/>
    <path id="micro-c" d="M 354 18 C 326 9 309 -5 302 -24 C 298 -38 287 -47 272 -51"/>
    <path id="micro-d" d="M 561 145 C 535 154 517 171 509 193 C 503 208 491 220 476 226"/>
    <path id="micro-e" d="M 621 -19 C 649 -10 668 3 677 23 C 682 35 694 43 708 45"/>

    <filter id="capillaryBlur" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <style>
    /* Living Vein Segment — ambient background decoration, purely additive:
       this element does not gate gameplay, so its animations are pure loop,
       no state classes, no JS state-driving needed beyond mounting/removing
       instances as the arena scrolls. Blood-stream groups translate along
       their own vessel's local direction (each stream's dots are already
       laid out in flow-order, so animating the whole group as one unit
       reads as directional flow without per-particle path math). Pump nodes
       fire a synchronized contraction wave outward from each valve. */
    #vein-segment{transform-origin:0 0}
    #aura{animation:veinAuraPulse 2.4s ease-in-out infinite}
    #main-vessel{animation:veinWallBreathe 3.6s ease-in-out infinite}
    #lumen{animation:veinLumenPulse 2.4s ease-in-out infinite}
    #blood-stream-1{animation:veinFlow1 1.8s linear infinite}
    #blood-stream-2{animation:veinFlow2 2s linear infinite .3s}
    #blood-stream-3{animation:veinFlow3 1.9s linear infinite .6s}
    #blood-stream-4{animation:veinFlow4 2.1s linear infinite .9s}
    #branch-blood-a{animation:veinBranchFlowA 1.4s linear infinite}
    #branch-blood-c{animation:veinBranchFlowC 1.5s linear infinite .3s}
    #pump-1{animation:veinPump 2.4s ease-in-out infinite}
    #pump-2{animation:veinPump 2.4s ease-in-out infinite .15s}
    #pump-3{animation:veinPump 2.4s ease-in-out infinite .3s}
    #pump-4{animation:veinPump 2.4s ease-in-out infinite .45s}
    #valve-1{animation:veinValveConstrict 2.4s ease-in-out infinite}
    #valve-2{animation:veinValveConstrict 2.4s ease-in-out infinite .15s}
    #valve-3{animation:veinValveConstrict 2.4s ease-in-out infinite .3s}
    #wall-highlight{animation:veinHighlight 4.5s ease-in-out infinite}
    #damage-flash{opacity:0;pointer-events:none}

    @keyframes veinAuraPulse{0%,100%{opacity:.7;transform:scale(.99)}50%{opacity:1;transform:scale(1.01)}}
    @keyframes veinWallBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.004,1.006)}}
    @keyframes veinLumenPulse{0%,100%{opacity:.9}50%{opacity:1}}
    @keyframes veinFlow1{0%{transform:translate(0,0);opacity:.3}15%{opacity:1}85%{opacity:1}100%{transform:translate(29px,-16px);opacity:0}}
    @keyframes veinFlow2{0%{transform:translate(0,0);opacity:.3}15%{opacity:1}85%{opacity:1}100%{transform:translate(33px,-8px);opacity:0}}
    @keyframes veinFlow3{0%{transform:translate(0,0);opacity:.3}15%{opacity:1}85%{opacity:1}100%{transform:translate(34px,-14px);opacity:0}}
    @keyframes veinFlow4{0%{transform:translate(0,0);opacity:.3}15%{opacity:1}85%{opacity:1}100%{transform:translate(33px,-19px);opacity:0}}
    @keyframes veinBranchFlowA{0%{transform:translate(0,0);opacity:.6}100%{transform:translate(-4px,-15px);opacity:.2}}
    @keyframes veinBranchFlowC{0%{transform:translate(0,0);opacity:.58}100%{transform:translate(-2px,-14px);opacity:.2}}
    @keyframes veinPump{0%,100%{transform:scale(1);opacity:.8}30%{transform:scale(1.6);opacity:1}}
    @keyframes veinValveConstrict{0%,100%{transform:scaleY(1)}30%{transform:scaleY(.7)}}
    @keyframes veinHighlight{0%,100%{opacity:.28}50%{opacity:.42}}
  </style>

  <!--
    Modular asset:
    #vein-segment is intended to be translated, rotated, mirrored and scaled.
    It has no required world-center, allowing many instances across the arena.
  -->
  <g id="vein-segment" transform-origin="0 0">

    <!-- Ambient biological glow -->
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <path d="M -40 248 C 40 225 70 180 130 165 C 200 147 230 162 280 132
               C 345 94 372 75 428 87 C 492 100 516 69 560 49
               C 608 28 650 38 760 12"
            fill="none" stroke="#d9434f" stroke-width="32"
            stroke-linecap="round" opacity=".09" filter="url(#vesselGlow)"/>
    </g>

    <!-- Main artery wall -->
    <g id="main-vessel" transform-box="fill-box" transform-origin="center">
      <use href="#main-vessel-outline" fill="url(#vesselWall)"/>

      <!-- Inner lumen -->
      <use id="lumen" href="#main-vessel-center"
           fill="none" stroke="url(#vesselInner)" stroke-width="15"
           stroke-linecap="round"/>

      <!-- Upper-left tissue highlight -->
      <use id="wall-highlight" href="#main-vessel-center"
           fill="none" stroke="#9a6269" stroke-width="3"
           stroke-linecap="round" opacity=".34"/>

      <!-- Lower-right occlusion -->
      <use id="wall-shadow" href="#main-vessel-center"
           fill="none" stroke="#170f1b" stroke-width="5"
           stroke-linecap="round" opacity=".48"/>
    </g>

    <!-- Branching vessels -->
    <g id="branches" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g id="branch-a-group" transform-box="fill-box" transform-origin="center">
        <use href="#branch-a" stroke="url(#capillaryWall)" stroke-width="13" opacity=".9"/>
        <use href="#branch-a" stroke="#87444f" stroke-width="2.2" opacity=".32"/>
      </g>

      <g id="branch-b-group" transform-box="fill-box" transform-origin="center">
        <use href="#branch-b" stroke="url(#capillaryWall)" stroke-width="11" opacity=".88"/>
        <use href="#branch-b" stroke="#87444f" stroke-width="2" opacity=".3"/>
      </g>

      <g id="branch-c-group" transform-box="fill-box" transform-origin="center">
        <use href="#branch-c" stroke="url(#capillaryWall)" stroke-width="12" opacity=".9"/>
        <use href="#branch-c" stroke="#87444f" stroke-width="2" opacity=".32"/>
      </g>

      <g id="branch-d-group" transform-box="fill-box" transform-origin="center">
        <use href="#branch-d" stroke="url(#capillaryWall)" stroke-width="12" opacity=".88"/>
        <use href="#branch-d" stroke="#87444f" stroke-width="2" opacity=".30"/>
      </g>

      <g id="branch-e-group" transform-box="fill-box" transform-origin="center">
        <use href="#branch-e" stroke="url(#capillaryWall)" stroke-width="10" opacity=".86"/>
        <use href="#branch-e" stroke="#87444f" stroke-width="1.8" opacity=".28"/>
      </g>
    </g>

    <!-- Fine capillaries: these make the structure feel embedded in living tissue. -->
    <g id="capillary-network" fill="none" stroke="#5b303c"
       stroke-width="4" stroke-linecap="round" opacity=".75">
      <g id="micro-a-group" transform-box="fill-box" transform-origin="center">
        <use href="#micro-a"/>
      </g>
      <g id="micro-b-group" transform-box="fill-box" transform-origin="center">
        <use href="#micro-b"/>
      </g>
      <g id="micro-c-group" transform-box="fill-box" transform-origin="center">
        <use href="#micro-c"/>
      </g>
      <g id="micro-d-group" transform-box="fill-box" transform-origin="center">
        <use href="#micro-d"/>
      </g>
      <g id="micro-e-group" transform-box="fill-box" transform-origin="center">
        <use href="#micro-e"/>
      </g>
    </g>

    <!-- Pulsatile vessel valves / constriction points -->
    <g id="pulse-valves">
      <g id="valve-1" transform-box="fill-box" transform-origin="center">
        <ellipse cx="277" cy="135" rx="8" ry="13"
                 fill="#6f3945" opacity=".68" transform="rotate(63 277 135)"/>
        <path d="M 270 129 C 276 133 282 139 284 145"
              fill="none" stroke="#bb5960" stroke-width="2" opacity=".38"/>
      </g>
      <g id="valve-2" transform-box="fill-box" transform-origin="center">
        <ellipse cx="428" cy="93" rx="7" ry="12"
                 fill="#6f3945" opacity=".66" transform="rotate(104 428 93)"/>
        <path d="M 421 91 C 428 93 433 97 436 103"
              fill="none" stroke="#bb5960" stroke-width="2" opacity=".36"/>
      </g>
      <g id="valve-3" transform-box="fill-box" transform-origin="center">
        <ellipse cx="558" cy="54" rx="7" ry="11"
                 fill="#6f3945" opacity=".64" transform="rotate(67 558 54)"/>
      </g>
    </g>

    <!-- Blood is represented as discrete moving elements, not a static red stripe. -->
    <g id="blood-flow" fill="url(#bloodGlow)">
      <g id="blood-stream-1" transform-box="fill-box" transform-origin="center">
        <ellipse cx="18" cy="241" rx="7" ry="3.2" opacity=".68"/>
        <ellipse cx="49" cy="224" rx="5" ry="2.5" opacity=".52"/>
        <ellipse cx="78" cy="204" rx="6" ry="2.7" opacity=".62"/>
      </g>

      <g id="blood-stream-2" transform-box="fill-box" transform-origin="center">
        <ellipse cx="151" cy="165" rx="6" ry="2.7" opacity=".68"/>
        <ellipse cx="184" cy="159" rx="4.5" ry="2.2" opacity=".52"/>
        <ellipse cx="218" cy="155" rx="6" ry="2.5" opacity=".64"/>
      </g>

      <g id="blood-stream-3" transform-box="fill-box" transform-origin="center">
        <ellipse cx="318" cy="119" rx="6" ry="2.8" opacity=".66"/>
        <ellipse cx="350" cy="102" rx="4.5" ry="2.1" opacity=".5"/>
        <ellipse cx="386" cy="91" rx="6" ry="2.5" opacity=".62"/>
      </g>

      <g id="blood-stream-4" transform-box="fill-box" transform-origin="center">
        <ellipse cx="466" cy="100" rx="5.5" ry="2.5" opacity=".64"/>
        <ellipse cx="499" cy="83" rx="4" ry="2" opacity=".5"/>
        <ellipse cx="532" cy="63" rx="5.5" ry="2.4" opacity=".62"/>
      </g>

      <!-- Branch-bound particles -->
      <g id="branch-blood-a" transform-box="fill-box" transform-origin="center">
        <circle cx="113" cy="112" r="3.2" opacity=".62"/>
        <circle cx="119" cy="78" r="2.4" opacity=".46"/>
      </g>

      <g id="branch-blood-c" transform-box="fill-box" transform-origin="center">
        <circle cx="354" cy="39" r="3" opacity=".58"/>
        <circle cx="358" cy="12" r="2.2" opacity=".43"/>
      </g>
    </g>

    <!-- Pump points: separate anchors for synchronized contraction waves. -->
    <g id="pump-nodes" transform-box="fill-box" transform-origin="center">
      <g id="pump-1">
        <circle cx="76" cy="204" r="6" fill="#e5535c" opacity=".24" filter="url(#softGlow)"/>
        <circle cx="76" cy="204" r="2.3" fill="#ff7775" opacity=".7"/>
      </g>
      <g id="pump-2">
        <circle cx="218" cy="155" r="5.5" fill="#e5535c" opacity=".22" filter="url(#softGlow)"/>
        <circle cx="218" cy="155" r="2.1" fill="#ff7775" opacity=".65"/>
      </g>
      <g id="pump-3">
        <circle cx="386" cy="91" r="5.5" fill="#e5535c" opacity=".22" filter="url(#softGlow)"/>
        <circle cx="386" cy="91" r="2.1" fill="#ff7775" opacity=".65"/>
      </g>
      <g id="pump-4">
        <circle cx="532" cy="63" r="5" fill="#e5535c" opacity=".20" filter="url(#softGlow)"/>
        <circle cx="532" cy="63" r="2" fill="#ff7775" opacity=".62"/>
      </g>
    </g>

    <!-- Tiny vessel-wall texture -->
    <g id="wall-texture" fill="#b46a70" opacity=".20">
      <ellipse cx="151" cy="176" rx="5" ry="2"/>
      <ellipse cx="194" cy="153" rx="3" ry="1.5"/>
      <ellipse cx="337" cy="108" rx="4" ry="1.6"/>
      <ellipse cx="470" cy="94" rx="4" ry="1.7"/>
      <ellipse cx="602" cy="48" rx="5" ry="1.8"/>
    </g>

    <!-- Optional renderer-level flash for global environmental events. -->
    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#main-vessel-outline" fill="#ffffff"/>
    </g>
  </g>
</svg>

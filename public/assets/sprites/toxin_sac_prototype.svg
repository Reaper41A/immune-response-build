<svg xmlns="http://www.w3.org/2000/svg"
     width="150" height="150"
     viewBox="-75 -75 150 150">

  <defs>
    <!-- Toxin Sac palette: acid-yellow-green, distinct from Fungi. -->
    <radialGradient id="toxinSacGradient" cx="35%" cy="29%" r="74%">
      <stop offset="0%"   stop-color="#eaffb0"/>
      <stop offset="43%"  stop-color="#d4ff4d"/>
      <stop offset="76%"  stop-color="#a8bf35"/>
      <stop offset="100%" stop-color="#7a8f1f"/>
    </radialGradient>

    <radialGradient id="pressureGlowGradient" cx="48%" cy="45%" r="60%">
      <stop offset="0%"   stop-color="#eaffb0" stop-opacity=".68"/>
      <stop offset="48%"  stop-color="#d4ff4d" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#d4ff4d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tensionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaffb0" stop-opacity=".20"/>
      <stop offset="45%" stop-color="#eaffb0" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#7a8f1f" stop-opacity=".42"/>
    </linearGradient>

    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <filter id="pressureBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <filter id="softGloss" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>

    <!-- Clean full-silhouette target for the synchronized hit flash. -->
    <path id="toxin-silhouette"
      d="M -8,-48
         C 5,-53 22,-47 31,-37
         C 40,-27 45,-13 43,0
         C 47,14 39,29 29,37
         C 18,46 3,51 -10,47
         C -25,48 -38,39 -43,28
         C -49,16 -47,4 -44,-7
         C -47,-20 -40,-34 -29,-41
         C -22,-46 -14,-48 -8,-48 Z"/>

    <style>
      /* Toxin Sac — pressurized, fragile, explodes on death. Idle pulse is
         the FASTEST breathing cycle in the roster (high speed/fragility).
         Hit is inverted vs every other creature: it bulges MORE, not less
         (getting squeezed, not absorbing). Critical = visible swelling +
         tension-line telegraph. Death is a real explosion, faster/more
         violent than bacteria's rupture. No attack state. */
      #toxinsac{transform-origin:0 0}
      #aura{animation:toxinAura .9s ease-in-out infinite}
      #membrane{transform-box:fill-box;transform-origin:center;animation:toxinPulse 1.0s ease-in-out infinite}
      #internal-pressure-glow{animation:toxinGlow 1.0s ease-in-out infinite}
      #surface-tension-lines{animation:toxinTension 1.0s ease-in-out infinite}
      #pressure-flecks{animation:toxinFlecks 1.4s ease-in-out infinite}
      .damage-flash{opacity:0;pointer-events:none}

      #toxinsac.state-move #membrane{animation-duration:.6s}
      #toxinsac.state-move #aura{animation-duration:.55s}

      #toxinsac.state-hit #membrane{animation:toxinHitBulge .18s ease-out}
      #toxinsac.state-hit #internal-pressure-glow{animation:toxinHitGlow .18s ease-out}
      #toxinsac.state-hit .damage-flash{animation:toxinFlash .18s ease-out}

      #toxinsac.state-critical #membrane{animation:toxinCriticalSwell .35s ease-in-out infinite}
      #toxinsac.state-critical #surface-tension-lines{animation:toxinTensionCritical .3s ease-in-out infinite}
      #toxinsac.state-critical #internal-pressure-glow{animation:toxinGlowCritical .3s ease-in-out infinite}

      #toxinsac.state-death #membrane{animation:toxinExplodeBody .38s cubic-bezier(.1,.7,.3,1) forwards}
      #toxinsac.state-death #internal-pressure-glow{animation:toxinExplodeGlow .38s ease-out forwards}
      #toxinsac.state-death #surface-tension-lines,
      #toxinsac.state-death #pressure-flecks{animation:toxinExplodeFade .22s ease-out forwards}
      #toxinsac.state-death #aura{animation:toxinExplodeAura .4s ease-out forwards}

      @keyframes toxinAura{0%,100%{opacity:.2;transform:scale(.95)}50%{opacity:.4;transform:scale(1.1)}}
      @keyframes toxinPulse{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,1.06)}}
      @keyframes toxinGlow{0%,100%{opacity:.7}50%{opacity:1}}
      @keyframes toxinTension{0%,100%{opacity:.5}50%{opacity:.85}}
      @keyframes toxinFlecks{0%,100%{opacity:.3}50%{opacity:.6}}
      @keyframes toxinHitBulge{0%{transform:scale(1)}40%{transform:scale(1.22,1.28)}100%{transform:scale(1)}}
      @keyframes toxinHitGlow{0%,100%{opacity:.7}40%{opacity:1;transform:scale(1.3)}}
      @keyframes toxinFlash{0%,100%{opacity:0}22%{opacity:.9}}
      @keyframes toxinCriticalSwell{0%,100%{transform:scale(1)}50%{transform:scale(1.12,1.14)}}
      @keyframes toxinTensionCritical{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes toxinGlowCritical{0%,100%{opacity:.6}50%{opacity:1}}
      @keyframes toxinExplodeBody{0%{transform:scale(1);opacity:1}25%{transform:scale(1.35,1.4);opacity:1}100%{transform:scale(2.6);opacity:0}}
      @keyframes toxinExplodeGlow{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
      @keyframes toxinExplodeFade{0%{opacity:1}100%{opacity:0}}
      @keyframes toxinExplodeAura{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
    </style>
  </defs>

  <!-- Root group: JS translates this and applies state classes. -->
  <g id="toxinsac" transform-origin="0 0">

    <!-- Soft acid-colored aura behind the sac. -->
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <use href="#toxin-silhouette"
           fill="#eaffb0" opacity=".22"
           transform="scale(1.10)"
           filter="url(#auraBlur)"/>
    </g>

    <!-- Main taut, asymmetric blister/sac. -->
    <g id="membrane" transform-box="fill-box" transform-origin="center">

      <path id="membrane-shape"
        d="M -8,-48
           C 5,-53 22,-47 31,-37
           C 40,-27 45,-13 43,0
           C 47,14 39,29 29,37
           C 18,46 3,51 -10,47
           C -25,48 -38,39 -43,28
           C -49,16 -47,4 -44,-7
           C -47,-20 -40,-34 -29,-41
           C -22,-46 -14,-48 -8,-48 Z"
        fill="url(#toxinSacGradient)"/>

      <!-- Slightly darker pressure-bearing lower shell. -->
      <path
        d="M -44,-7
           C -47,5 -48,16 -43,28
           C -38,40 -25,48 -10,47
           C 4,51 19,46 29,37
           C 39,28 46,14 43,0
           C 43,13 35,25 25,33
           C 14,42 1,45 -11,42
           C -24,43 -35,35 -39,25
           C -44,14 -42,3 -40,-7 Z"
        fill="#7a8f1f" opacity=".16"/>

      <!-- Internal pressure: a soft luminous volume, not a separate organelle. -->
      <ellipse id="internal-pressure-glow"
               cx="-1" cy="-1" rx="28" ry="32"
               fill="url(#pressureGlowGradient)"
               filter="url(#pressureBlur)"/>

      <!-- Pressure highlight: broad upper-left gloss. -->
      <path id="membrane-highlight"
        d="M -29,-35
           C -20,-45 -7,-49 6,-46
           C 17,-44 25,-39 31,-31
           C 21,-35 12,-35 3,-32
           C -7,-29 -15,-23 -21,-15
           C -26,-20 -31,-28 -29,-35 Z"
        fill="#eaffb0" opacity=".42"/>

      <ellipse cx="-9" cy="-36" rx="7" ry="2.6"
               fill="#ffffff" opacity=".38"
               filter="url(#softGloss)"/>

      <!-- A faint inner membrane contour makes the sac feel stretched and pressurized. -->
      <path
        d="M -31,-28
           C -20,-39 -4,-43 11,-39
           C 25,-35 34,-24 36,-10
           C 39,5 34,20 24,29
           C 13,39 -1,42 -15,38
           C -28,35 -37,25 -39,13"
        fill="none"
        stroke="#eaffb0"
        stroke-width="1.15"
        opacity=".28"
        stroke-linecap="round"/>
    </g>

    <!-- Stretch marks / surface-tension lines around the widest zones. -->
    <g id="surface-tension-lines"
       fill="none"
       stroke="url(#tensionGradient)"
       stroke-linecap="round"
       stroke-linejoin="round">

      <path id="tension-line-1"
        d="M -40,8 C -37,5 -34,4 -31,4"
        stroke-width="1.55" opacity=".62"/>

      <path id="tension-line-2"
        d="M 35,8 C 38,6 40,3 41,0"
        stroke-width="1.55" opacity=".58"/>

      <path id="tension-line-3"
        d="M 5,43 C 8,39 10,36 10,33"
        stroke-width="1.4" opacity=".52"/>
    </g>

    <!-- Small pressure flecks, kept sparse so the sac stays visually simple. -->
    <g id="pressure-flecks" fill="#eaffb0" opacity=".38">
      <ellipse cx="-28" cy="-8" rx="2.1" ry="1"/>
      <ellipse cx="22" cy="-18" rx="1.7" ry=".85"/>
      <ellipse cx="18" cy="20" rx="1.9" ry=".9"/>
    </g>

    <!-- Full-silhouette hit flash; one opacity control for JS. -->
    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#toxin-silhouette" fill="#ffffff"/>
    </g>

  </g>
</svg>

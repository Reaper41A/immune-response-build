<svg xmlns="http://www.w3.org/2000/svg"
     width="180" height="180" viewBox="-90 -90 180 180"
     role="img" aria-labelledby="title desc">
  <title id="title">Acid cloud environmental hazard</title>
  <desc id="desc">A toxic yellow-green poison gas cloud left by a dead organism, with rolling gas pockets, acidic droplets, fumes and a dark necrotic center.</desc>

  <defs>
    <radialGradient id="acidGas" cx="35%" cy="28%" r="72%">
      <stop offset="0%"  stop-color="#f7ffd0" stop-opacity=".95"/>
      <stop offset="34%" stop-color="#d9f54f" stop-opacity=".82"/>
      <stop offset="72%" stop-color="#91b52b" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#40541b" stop-opacity=".12"/>
    </radialGradient>

    <radialGradient id="hotPocket" cx="32%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#faffc9" stop-opacity=".9"/>
      <stop offset="48%" stop-color="#d7ef43" stop-opacity=".68"/>
      <stop offset="100%" stop-color="#6f8e18" stop-opacity=".05"/>
    </radialGradient>

    <linearGradient id="acidDrip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaff78" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#7e9f1e" stop-opacity=".2"/>
    </linearGradient>

    <filter id="gasBlur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>

    <filter id="tinyBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <filter id="hazardGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- A reusable soft gas silhouette; intentionally irregular rather than a neat cloud icon. -->
    <path id="gas-rim-shape"
      d="M -61 28
         C -69 19 -66 6 -56 0
         C -61 -13 -52 -26 -39 -28
         C -37 -43 -22 -52 -9 -47
         C 2 -60 19 -57 27 -45
         C 43 -48 55 -39 56 -25
         C 69 -19 72 -5 65 6
         C 72 18 64 31 51 34
         C 44 47 27 51 16 45
         C 4 55 -13 52 -20 43
         C -36 48 -50 41 -51 31
         C -56 31 -59 30 -61 28 Z"/>

    <clipPath id="gasClip">
      <use href="#gas-rim-shape"/>
    </clipPath>

    <style>
      /* Acid Cloud Hazard — spawned by a dying Toxin Sac, 1.8s fixed
         lifetime (SIM.hazards life/maxLife). JS sets a CSS custom property
         --life-frac (life/maxLife, 1→0 over the hazard's real lifetime) on
         the root every frame; the whole cloud fades via that variable so
         the visual fade always matches the actual damage-tick window rather
         than running its own independent clock. CSS below only owns the
         continuous roiling/drifting motion and the one-shot spawn puff. */
      #acid-cloud{transform-origin:0 0;opacity:var(--life-frac,1)}
      #aura{animation:acidAuraDrift 3.4s ease-in-out infinite}
      #gas-body{transform-box:fill-box;transform-origin:center;animation:acidBodyRoil 4s ease-in-out infinite}
      #gas-pocket-1{animation:acidPocket1 3.2s ease-in-out infinite}
      #gas-pocket-2{animation:acidPocket2 3.6s ease-in-out infinite .3s}
      #gas-pocket-3{animation:acidPocket3 3s ease-in-out infinite .6s}
      #gas-pocket-4{animation:acidPocket4 3.8s ease-in-out infinite .9s}
      #fume-left{animation:acidFumeLeft 2.6s ease-in-out infinite}
      #fume-right{animation:acidFumeRight 2.9s ease-in-out infinite .2s}
      #fume-top{animation:acidFumeTop 2.4s ease-in-out infinite .4s}
      #droplet-1{animation:acidDropFall 2.2s ease-in infinite}
      #droplet-2{animation:acidDropFall 2.5s ease-in infinite .6s}
      #droplet-3{animation:acidDropFall 2s ease-in infinite 1.1s}
      #spark-1,#spark-2,#spark-3{animation:acidSparkFlicker 1.6s ease-in-out infinite}
      #spark-2{animation-delay:.4s}
      #spark-3{animation-delay:.8s}
      #turbulence{animation:acidTurbulence 3s ease-in-out infinite}
      #damage-flash{opacity:0;pointer-events:none}

      #acid-cloud.spawning{animation:acidSpawnPuff .3s ease-out}
      #acid-cloud.spawning #gas-body{animation:acidBodyRoil 4s ease-in-out infinite,acidSpawnExpand .3s ease-out}

      #acid-cloud.tick #damage-flash{animation:acidTickFlash .3s ease-out}

      @keyframes acidAuraDrift{0%,100%{opacity:.14;transform:scale(.97) translate(0,0)}50%{opacity:.22;transform:scale(1.04) translate(1px,-1px)}}
      @keyframes acidBodyRoil{0%,100%{transform:scale(1,1) rotate(0deg)}33%{transform:scale(1.015,.99) rotate(.6deg)}66%{transform:scale(.99,1.015) rotate(-.5deg)}}
      @keyframes acidPocket1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-1.5px,1px) scale(1.06)}}
      @keyframes acidPocket2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(1px,-1.5px) scale(1.05)}}
      @keyframes acidPocket3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(1.5px,1px) scale(1.07)}}
      @keyframes acidPocket4{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-1px,-.8px) scale(1.04)}}
      @keyframes acidFumeLeft{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-4deg)}}
      @keyframes acidFumeRight{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}
      @keyframes acidFumeTop{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}}
      @keyframes acidDropFall{0%{transform:translate(0,0);opacity:.7}80%{transform:translate(0,5px);opacity:.4}100%{transform:translate(0,6px);opacity:0}}
      @keyframes acidSparkFlicker{0%,100%{opacity:.2}50%{opacity:.6}}
      @keyframes acidTurbulence{0%,100%{opacity:.22}50%{opacity:.38}}
      @keyframes acidSpawnPuff{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
      @keyframes acidSpawnExpand{0%{transform:scale(.4)}100%{transform:scale(1)}}
      @keyframes acidTickFlash{0%,100%{opacity:0}30%{opacity:.35}}
    </style>
  </defs>

  <!-- Root: translate/scale this group in the renderer. -->
  <g id="acid-cloud" transform-origin="0 0">

    <!-- Atmospheric footprint / aura -->
    <g id="aura" transform-box="fill-box" transform-origin="center">
      <use href="#gas-rim-shape"
           fill="#d4ff4d" opacity=".17" filter="url(#gasBlur)"/>
      <ellipse id="aura-core" cx="3" cy="5" rx="49" ry="31"
               fill="#d4ff4d" opacity=".10" filter="url(#gasBlur)"/>
    </g>

    <!-- Low, dirty gas shadow makes the hazard feel like it is hanging in the environment. -->
    <g id="ground-haze" transform-box="fill-box" transform-origin="center">
      <ellipse cx="0" cy="38" rx="52" ry="13"
               fill="#536b1c" opacity=".20" filter="url(#gasBlur)"/>
      <ellipse cx="-18" cy="42" rx="29" ry="7"
               fill="#2d3b13" opacity=".16" filter="url(#softBlur)"/>
    </g>

    <!-- Main poison-gas body -->
    <g id="gas-body" transform-box="fill-box" transform-origin="center">
      <use id="gas-silhouette" href="#gas-rim-shape" fill="url(#acidGas)" opacity=".78"/>

      <!-- Rolling internal pockets: each is independently animatable. -->
      <g id="gas-pocket-1" transform-box="fill-box" transform-origin="center">
        <ellipse cx="-30" cy="-13" rx="20" ry="15"
                 fill="url(#hotPocket)" opacity=".56" filter="url(#softBlur)"/>
        <path d="M -43 -15 C -35 -23 -24 -23 -18 -16"
              fill="none" stroke="#f3ff9b" stroke-width="2.2"
              stroke-linecap="round" opacity=".35"/>
      </g>

      <g id="gas-pocket-2" transform-box="fill-box" transform-origin="center">
        <ellipse cx="5" cy="-25" rx="24" ry="17"
                 fill="url(#hotPocket)" opacity=".44" filter="url(#softBlur)"/>
        <path d="M -9 -29 C 0 -36 13 -35 19 -28"
              fill="none" stroke="#f8ffbd" stroke-width="2"
              stroke-linecap="round" opacity=".3"/>
      </g>

      <g id="gas-pocket-3" transform-box="fill-box" transform-origin="center">
        <ellipse cx="32" cy="1" rx="19" ry="18"
                 fill="url(#hotPocket)" opacity=".42" filter="url(#softBlur)"/>
      </g>

      <g id="gas-pocket-4" transform-box="fill-box" transform-origin="center">
        <ellipse cx="-8" cy="20" rx="27" ry="14"
                 fill="#728d1e" opacity=".27" filter="url(#softBlur)"/>
      </g>

      <!-- Dark contaminated center: suggests where the organism died. -->
      <g id="necrotic-core" transform-box="fill-box" transform-origin="center">
        <ellipse cx="3" cy="8" rx="18" ry="12"
                 fill="#344213" opacity=".38" filter="url(#softBlur)"/>
        <path d="M -11 7 C -5 2 1 4 5 8 C 10 4 15 7 17 12"
              fill="none" stroke="#27340f" stroke-width="2.2"
              stroke-linecap="round" opacity=".45"/>
        <circle cx="-2" cy="9" r="3.2" fill="#1f2a0c" opacity=".45"
                filter="url(#tinyBlur)"/>
      </g>

      <!-- Wispy tendrils are separate so they can drift independently. -->
      <g id="fume-tendrils" fill="none" stroke-linecap="round">
        <g id="fume-left" transform-box="fill-box" transform-origin="right center">
          <path d="M -42 14 C -55 19 -57 31 -68 34 C -76 37 -77 44 -71 49"
                stroke="#9fbe2e" stroke-width="5" opacity=".27" filter="url(#softBlur)"/>
          <path d="M -42 14 C -55 19 -57 31 -68 34 C -76 37 -77 44 -71 49"
                stroke="#d4ed58" stroke-width="1.5" opacity=".38"/>
        </g>
        <g id="fume-right" transform-box="fill-box" transform-origin="left center">
          <path d="M 43 11 C 57 15 58 26 68 29 C 76 32 78 39 73 45"
                stroke="#9fbe2e" stroke-width="5" opacity=".25" filter="url(#softBlur)"/>
          <path d="M 43 11 C 57 15 58 26 68 29 C 76 32 78 39 73 45"
                stroke="#d4ed58" stroke-width="1.4" opacity=".34"/>
        </g>
        <g id="fume-top" transform-box="fill-box" transform-origin="bottom center">
          <path d="M 15 -40 C 17 -51 12 -58 18 -66 C 22 -72 19 -77 14 -80"
                stroke="#a4bf2c" stroke-width="4.5" opacity=".22" filter="url(#softBlur)"/>
          <path d="M 15 -40 C 17 -51 12 -58 18 -66 C 22 -72 19 -77 14 -80"
                stroke="#e1f46b" stroke-width="1.3" opacity=".30"/>
        </g>
      </g>

      <!-- Acid droplets / condensate, independently positionable -->
      <g id="acid-droplets">
        <g id="droplet-1" transform-box="fill-box" transform-origin="center">
          <path d="M -28 33 C -28 28 -23 24 -22 21 C -18 26 -17 30 -19 34 C -21 38 -26 37 -28 33 Z"
                fill="url(#acidDrip)" opacity=".72"/>
          <ellipse cx="-22" cy="29" rx="2.2" ry="1.3"
                   fill="#f4ffab" opacity=".45"/>
        </g>
        <g id="droplet-2" transform-box="fill-box" transform-origin="center">
          <path d="M 8 43 C 8 38 12 34 13 30 C 17 35 18 39 16 43 C 14 47 10 47 8 43 Z"
                fill="url(#acidDrip)" opacity=".62"/>
        </g>
        <g id="droplet-3" transform-box="fill-box" transform-origin="center">
          <path d="M 39 30 C 39 26 43 22 44 19 C 48 24 49 27 47 31 C 45 34 41 34 39 30 Z"
                fill="url(#acidDrip)" opacity=".58"/>
        </g>
      </g>

      <!-- Surface turbulence: not a clean outline, but broken gas currents. -->
      <g id="turbulence" fill="none" stroke-linecap="round">
        <path d="M -50 -2 C -39 -9 -29 -7 -21 -2"
              stroke="#efff9a" stroke-width="2" opacity=".24"/>
        <path d="M 18 -7 C 27 -12 37 -9 44 -3"
              stroke="#efff9a" stroke-width="1.7" opacity=".22"/>
        <path d="M -33 15 C -23 10 -13 12 -6 17"
              stroke="#526a18" stroke-width="2" opacity=".30"/>
        <path d="M 17 19 C 27 14 36 16 42 22"
              stroke="#526a18" stroke-width="1.8" opacity=".28"/>
      </g>

      <!-- Local emission pockets -->
      <g id="toxic-sparks">
        <circle id="spark-1" cx="-45" cy="3" r="1.8" fill="#f5ffad" opacity=".45" filter="url(#tinyBlur)"/>
        <circle id="spark-2" cx="26" cy="-17" r="1.4" fill="#f5ffad" opacity=".38" filter="url(#tinyBlur)"/>
        <circle id="spark-3" cx="2" cy="29" r="1.6" fill="#f5ffad" opacity=".34" filter="url(#tinyBlur)"/>
      </g>
    </g>

    <!-- A faint outer rim keeps the hazard readable without making it look like a stroked icon. -->
    <g id="gas-rim" transform-box="fill-box" transform-origin="center">
      <use href="#gas-rim-shape"
           fill="none" stroke="#c9e83f" stroke-width="2"
           stroke-linejoin="round" opacity=".22"/>
    </g>

    <!-- Renderer-driven hit overlay: full hazard silhouette, hidden by default. -->
    <g id="damage-flash" opacity="0" pointer-events="none">
      <use href="#gas-rim-shape" fill="#ffffff"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="-75 -75 150 150">
  <defs>
    <radialGradient id="bodyGradient" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c9d9a0"/>
      <stop offset="58%" stop-color="#8a9a5b"/>
      <stop offset="100%" stop-color="#4a5530"/>
    </radialGradient>
    <radialGradient id="auraGradient" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#c9d9a0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c9d9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="patchGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#59683b"/>
      <stop offset="100%" stop-color="#394326"/>
    </linearGradient>
    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M -42,-10 C -40,-25 -26,-34 -10,-35 C 5,-37 19,-31 29,-22 C 40,-12 43,1 39,11 C 35,19 28,22 25,30 C 21,39 14,48 5,46 C -3,44 -7,36 -13,38 C -21,41 -29,38 -31,30 C -34,22 -42,18 -45,8 C -47,1 -45,-5 -42,-10 Z"/>
    </clipPath>

    <style>
      /* Necrotic Drifter — sickly, sagging, lower-heavy. Idle is slow and
         DELIBERATELY lopsided (never symmetric). Trail hazard itself stays
         renderer-level (render.js drawTrails). Drips fall more frequently
         while moving. Death is the least dramatic in the roster on
         purpose: collapses/dissolves downward rather than rupturing.
         No attack state. Each drip-point's static translate() baseline is
         preserved inside its own keyframes. */
      #necroticDrifter{transform-origin:0 0}
      #aura{animation:necroAura 3.4s ease-in-out infinite}
      #body{transform-box:fill-box;transform-origin:center;animation:necroSag 3.8s ease-in-out infinite}
      #decay-patches{animation:necroPatchShift 5s ease-in-out infinite}
      #body-highlight{animation:necroHighlight 4.2s ease-in-out infinite}
      #drip-point-1{animation:necroDrip1 2.2s ease-in infinite}
      #drip-point-2{animation:necroDrip2 2.6s ease-in infinite .5s}
      #drip-point-3{animation:necroDrip3 2.4s ease-in infinite 1s}
      .damage-flash{opacity:0;pointer-events:none}

      #necroticDrifter.state-move #body{animation:necroSag 1.6s ease-in-out infinite}
      #necroticDrifter.state-move #drip-point-1{animation-duration:1s}
      #necroticDrifter.state-move #drip-point-2{animation-duration:1.2s}
      #necroticDrifter.state-move #drip-point-3{animation-duration:1.1s}

      #necroticDrifter.state-hit #body{animation:necroHit .22s ease-out}
      #necroticDrifter.state-hit .damage-flash{animation:necroFlash .2s ease-out}

      #necroticDrifter.state-critical #body{animation:necroCriticalSag .7s ease-in-out infinite}
      #necroticDrifter.state-critical #decay-patches{animation:necroPatchSpread .6s ease-in-out infinite}

      #necroticDrifter.state-death #body{animation:necroDissolve 1s ease-in forwards}
      #necroticDrifter.state-death #decay-patches,
      #necroticDrifter.state-death #drip-points{animation:necroFadeDown .9s ease-in forwards}
      #necroticDrifter.state-death #aura{animation:necroFadeOut .6s ease-out forwards}

      @keyframes necroAura{0%,100%{opacity:.45;transform:scale(.97)}50%{opacity:.6;transform:scale(1.02)}}
      @keyframes necroSag{0%,100%{transform:scale(1,1) rotate(0deg)}30%{transform:scale(1.015,.985) rotate(-.7deg)}65%{transform:scale(.99,1.02) rotate(.9deg)}}
      @keyframes necroPatchShift{0%,100%{opacity:.85}50%{opacity:1}}
      @keyframes necroHighlight{0%,100%{opacity:.28}50%{opacity:.5}}
      @keyframes necroDrip1{0%{transform:translate(-19px,36px) scale(1);opacity:.9}70%{transform:translate(-19px,50px) scale(.8);opacity:.4}100%{transform:translate(-19px,52px) scale(.6);opacity:0}}
      @keyframes necroDrip2{0%{transform:translate(5px,44px) scale(1);opacity:.9}70%{transform:translate(5px,58px) scale(.8);opacity:.4}100%{transform:translate(5px,60px) scale(.6);opacity:0}}
      @keyframes necroDrip3{0%{transform:translate(22px,27px) scale(1);opacity:.86}70%{transform:translate(22px,41px) scale(.8);opacity:.4}100%{transform:translate(22px,43px) scale(.6);opacity:0}}
      @keyframes necroHit{0%{transform:scale(1)}35%{transform:translate(1.5px,1px) scale(1.06,.93)}100%{transform:scale(1)}}
      @keyframes necroFlash{0%,100%{opacity:0}22%{opacity:.85}}
      @keyframes necroCriticalSag{0%,100%{transform:scale(1,.98)}50%{transform:scale(1.04,1.05)}}
      @keyframes necroPatchSpread{0%,100%{opacity:.7}50%{opacity:1}}
      @keyframes necroDissolve{0%{transform:translate(0,0) scale(1);opacity:1}60%{transform:translate(0,6px) scale(1.04,.9);opacity:.85}100%{transform:translate(0,22px) scale(.9,.4);opacity:0}}
      @keyframes necroFadeDown{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(0,16px)}}
      @keyframes necroFadeOut{0%{opacity:1}100%{opacity:0}}
    </style>
  </defs>

  <g id="necroticDrifter" transform-origin="0 0">
    <ellipse id="aura" cx="0" cy="3" rx="48" ry="43" fill="url(#auraGradient)" opacity="0.55" filter="url(#auraBlur)"/>

    <g id="body" transform-origin="0 0">
      <path id="body-shape"
        d="M -42,-10 C -40,-25 -26,-34 -10,-35 C 5,-37 19,-31 29,-22 C 40,-12 43,1 39,11 C 35,19 28,22 25,30 C 21,39 14,48 5,46 C -3,44 -7,36 -13,38 C -21,41 -29,38 -31,30 C -34,22 -42,18 -45,8 C -47,1 -45,-5 -42,-10 Z"
        fill="url(#bodyGradient)"/>

      <g id="decay-patches" clip-path="url(#bodyClip)">
        <path id="decay-patch-1" d="M -28,-12 C -23,-21 -12,-22 -7,-15 C -5,-9 -11,-4 -19,-4 C -27,-4 -32,-7 -28,-12 Z" fill="url(#patchGradient)" opacity="0.72"/>
        <path id="decay-patch-2" d="M 15,3 C 22,-4 33,-2 35,6 C 34,13 27,17 20,14 C 14,12 11,8 15,3 Z" fill="#46512d" opacity="0.78"/>
        <path id="decay-patch-3" d="M -8,20 C -1,15 8,19 9,27 C 8,34 1,39 -7,35 C -13,32 -14,25 -8,20 Z" fill="#59663a" opacity="0.82"/>
        <path id="decay-fissure-1" d="M -22,1 C -16,4 -12,7 -9,12 M -14,5 C -17,10 -19,14 -18,19" fill="none" stroke="#384325" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <path id="decay-fissure-2" d="M 12,-20 C 16,-15 17,-10 15,-5 M 17,-12 C 23,-14 27,-13 31,-10" fill="none" stroke="#536035" stroke-width="1.1" stroke-linecap="round" opacity="0.62"/>
      </g>

      <path id="body-highlight" d="M -30,-19 C -21,-29 -7,-31 5,-27 C 11,-25 15,-22 18,-18" fill="none" stroke="#d9e5b8" stroke-width="3" stroke-linecap="round" opacity="0.32" filter="url(#softBlur)"/>
    </g>

    <g id="drip-points">
      <g id="drip-point-1" transform="translate(-19 36)" transform-origin="0 0">
        <circle cx="0" cy="0" r="2.2" fill="#4a5530" opacity="0.9"/>
        <path id="drip-anchor-1" d="M 0,1 C -1,6 1,10 0,14" fill="none" stroke="#697847" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
      </g>
      <g id="drip-point-2" transform="translate(5 44)" transform-origin="0 0">
        <circle cx="0" cy="0" r="2" fill="#4a5530" opacity="0.9"/>
        <path id="drip-anchor-2" d="M 0,1 C 1,6 -1,10 0,13" fill="none" stroke="#697847" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      </g>
      <g id="drip-point-3" transform="translate(22 27)" transform-origin="0 0">
        <circle cx="0" cy="0" r="1.9" fill="#4a5530" opacity="0.86"/>
        <path id="drip-anchor-3" d="M 0,1 C 2,5 0,8 1,11" fill="none" stroke="#697847" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>
      </g>
    </g>

    <g id="damage-flash" opacity="0">
      <path d="M -42,-10 C -40,-25 -26,-34 -10,-35 C 5,-37 19,-31 29,-22 C 40,-12 43,1 39,11 C 35,19 28,22 25,30 C 21,39 14,48 5,46 C -3,44 -7,36 -13,38 C -21,41 -29,38 -31,30 C -34,22 -42,18 -45,8 C -47,1 -45,-5 -42,-10 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     width="160" height="160" viewBox="-80 -80 160 160"
     role="img" aria-label="Animated SVG bacteria prototype">

  <defs>
    <!-- Distinct materials/colors -->
    <radialGradient id="membraneGradient" cx="35%" cy="30%">
      <stop offset="0" stop-color="#9AFFD0"/>
      <stop offset=".55" stop-color="#31D69B"/>
      <stop offset="1" stop-color="#087A62"/>
    </radialGradient>

    <radialGradient id="cytoplasmGradient" cx="40%" cy="35%">
      <stop offset="0" stop-color="#D8FFE8"/>
      <stop offset=".45" stop-color="#72F5B8"/>
      <stop offset="1" stop-color="#22A879"/>
    </radialGradient>

    <radialGradient id="nucleusGradient">
      <stop offset="0" stop-color="#FFF59A"/>
      <stop offset=".45" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#D46B16"/>
    </radialGradient>

    <linearGradient id="flagellumGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67E8FF"/>
      <stop offset="1" stop-color="#2375FF"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <filter id="hardGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>

    <!-- The distortion filter is intentionally isolated so it can be disabled on low-end devices. -->
    <filter id="membraneWobble" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="7"
                    result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5"
                          xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <clipPath id="cellClip">
      <path id="cellClipPath"
        d="M -42,-8
           C -45,-30 -25,-43 0,-42
           C 27,-42 45,-27 43,-3
           C 47,21 28,40 3,42
           C -23,44 -44,29 -42,-8 Z"/>
    </clipPath>

    <style>
      /* Every major component has its own animation name and can be controlled
         independently by adding/removing these classes or setting animation-play-state. */

      #bacteria { transform-origin: 0 0; }

      #membrane {
        transform-box: fill-box;
        transform-origin: center;
        animation: breathe 1.8s ease-in-out infinite;
      }

      #cytoplasm {
        transform-box: fill-box;
        transform-origin: center;
        animation: cytoplasmPulse 1.35s ease-in-out infinite;
      }

      #nucleus {
        transform-box: fill-box;
        transform-origin: center;
        animation: nucleusFloat 2.4s ease-in-out infinite;
      }

      #nucleus-core {
        transform-box: fill-box;
        transform-origin: center;
        animation: nucleusPulse .9s ease-in-out infinite;
      }

      #flagellum-a {
        transform-box: fill-box;
        transform-origin: left center;
        animation: flagellumA .75s ease-in-out infinite;
      }

      #flagellum-b {
        transform-box: fill-box;
        transform-origin: left center;
        animation: flagellumB .92s ease-in-out infinite;
      }

      .organelle {
        transform-box: fill-box;
        transform-origin: center;
        animation: organelleDrift 2.1s ease-in-out infinite alternate;
      }

      .organelle:nth-of-type(2n) {
        animation-delay: -.7s;
        animation-duration: 1.7s;
      }

      .organelle:nth-of-type(3n) {
        animation-delay: -.35s;
        animation-duration: 2.5s;
      }

      .membrane-highlight {
        animation: highlightShift 2.8s linear infinite;
      }

      .damage-flash {
        opacity: 0;
        pointer-events: none;
      }

      /* Optional gameplay states:
         Add one of these classes to #bacteria:
         .state-hit, .state-attack, .state-critical, .state-death
      */

      #bacteria.state-hit #membrane {
        animation: hitSquash .16s ease-out, breathe 1.8s ease-in-out .16s infinite;
      }

      #bacteria.state-hit #cytoplasm {
        animation: hitJolt .18s ease-out, cytoplasmPulse 1.35s ease-in-out .18s infinite;
      }

      #bacteria.state-hit .damage-flash {
        animation: damageFlash .18s ease-out;
      }

      #bacteria.state-attack #nucleus {
        animation: attackCharge .55s ease-in-out;
      }

      #bacteria.state-attack #flagellum-a,
      #bacteria.state-attack #flagellum-b {
        animation-duration: .25s;
      }

      #bacteria.state-critical #membrane {
        animation: criticalBreathe .55s ease-in-out infinite;
      }

      #bacteria.state-critical #nucleus-core {
        animation: criticalCore .38s ease-in-out infinite;
      }

      #bacteria.state-death {
        animation: deathBody .65s cubic-bezier(.2,.8,.3,1) forwards;
      }

      #bacteria.state-death #membrane {
        animation: rupture .65s ease-in forwards;
      }

      #bacteria.state-death #cytoplasm {
        animation: cytoplasmBurst .65s ease-in forwards;
      }

      #bacteria.state-death #nucleus {
        animation: nucleusEscape .65s ease-in forwards;
      }

      #bacteria.state-death #flagellum-a {
        animation: flagellumDieA .65s ease-in forwards;
      }

      #bacteria.state-death #flagellum-b {
        animation: flagellumDieB .65s ease-in forwards;
      }

      @keyframes breathe {
        0%,100% { transform: translate(0,0) scale(1,1); }
        50% { transform: translate(0,1px) scale(1.035,.965); }
      }

      @keyframes cytoplasmPulse {
        0%,100% { transform: scale(.98); opacity:.92; }
        50% { transform: scale(1.035); opacity:1; }
      }

      @keyframes nucleusFloat {
        0%,100% { transform: translate(-1px,1px) rotate(-2deg); }
        50% { transform: translate(2px,-2px) rotate(3deg); }
      }

      @keyframes nucleusPulse {
        0%,100% { transform: scale(.92); }
        50% { transform: scale(1.08); }
      }

      @keyframes flagellumA {
        0%,100% { transform: rotate(-5deg); }
        50% { transform: rotate(7deg); }
      }

      @keyframes flagellumB {
        0%,100% { transform: rotate(6deg); }
        50% { transform: rotate(-8deg); }
      }

      @keyframes organelleDrift {
        from { transform: translate(0,0) rotate(0deg); }
        to { transform: translate(2px,-1px) rotate(8deg); }
      }

      @keyframes highlightShift {
        0% { opacity:.25; transform: translate(-2px,1px); }
        50% { opacity:.8; transform: translate(2px,-1px); }
        100% { opacity:.25; transform: translate(-2px,1px); }
      }

      @keyframes hitSquash {
        0% { transform: scale(1); }
        35% { transform: translate(2px,1px) scale(1.12,.82); }
        100% { transform: scale(1); }
      }

      @keyframes hitJolt {
        0% { transform: translate(0); }
        45% { transform: translate(4px,-2px); }
        100% { transform: translate(0); }
      }

      @keyframes damageFlash {
        0% { opacity:0; }
        20% { opacity:.95; }
        100% { opacity:0; }
      }

      @keyframes attackCharge {
        0%,100% { transform: scale(1); }
        45% { transform: scale(1.3) translate(-1px,-1px); }
        75% { transform: scale(.92); }
      }

      @keyframes criticalBreathe {
        0%,100% { transform: scale(1,.97); }
        50% { transform: scale(1.06,1.02); }
      }

      @keyframes criticalCore {
        0%,100% { transform: scale(.85); opacity:.75; }
        50% { transform: scale(1.2); opacity:1; }
      }

      @keyframes deathBody {
        0% { transform: scale(1) rotate(0); opacity:1; }
        55% { transform: scale(1.12,.78) rotate(8deg); opacity:1; }
        100% { transform: scale(.15) rotate(35deg); opacity:0; }
      }

      @keyframes rupture {
        0% { transform: scale(1); opacity:1; }
        55% { transform: scale(1.12,.85); opacity:.95; }
        100% { transform: scale(1.3,.35); opacity:0; }
      }

      @keyframes cytoplasmBurst {
        0% { transform: scale(1); opacity:.95; }
        100% { transform: scale(1.65); opacity:0; }
      }

      @keyframes nucleusEscape {
        0% { transform: translate(0); opacity:1; }
        100% { transform: translate(22px,-15px) scale(.45); opacity:0; }
      }

      @keyframes flagellumDieA {
        0% { transform: rotate(0); opacity:1; }
        100% { transform: translate(18px,14px) rotate(35deg); opacity:0; }
      }

      @keyframes flagellumDieB {
        0% { transform: rotate(0); opacity:1; }
        100% { transform: translate(17px,-13px) rotate(-30deg); opacity:0; }
      }
    </style>
  </defs>

  <g id="bacteria">

    <!-- Soft silhouette glow: separate from the actual membrane. -->
    <path id="aura"
      d="M -42,-8 C -45,-30 -25,-43 0,-42 C 27,-42 45,-27 43,-3
         C 47,21 28,40 3,42 C -23,44 -44,29 -42,-8 Z"
      fill="#31D69B" opacity=".18" filter="url(#softGlow)"/>

    <!-- Tails are separate so movement can be animated independently. -->
    <g id="flagella" fill="none" stroke="url(#flagellumGradient)"
       stroke-width="3" stroke-linecap="round">
      <path id="flagellum-a"
        d="M 32,12 C 50,5 51,23 62,16 C 72,10 67,0 78,-3"/>
      <path id="flagellum-b"
        d="M 28,-15 C 46,-24 52,-10 62,-18 C 70,-24 70,-35 80,-34"/>
    </g>

    <!-- Outer living membrane. -->
    <g id="membrane" filter="url(#membraneWobble)">
      <path id="membrane-body"
        d="M -42,-8
           C -45,-30 -25,-43 0,-42
           C 27,-42 45,-27 43,-3
           C 47,21 28,40 3,42
           C -23,44 -44,29 -42,-8 Z"
        fill="url(#membraneGradient)"
        stroke="#A8FFE0"
        stroke-width="2.2"/>

      <!-- Membrane highlight is intentionally separate. -->
      <path id="membrane-highlight"
        class="membrane-highlight"
        d="M -28,-22 C -14,-35 7,-37 21,-29"
        fill="none" stroke="#E6FFF5" stroke-width="4"
        stroke-linecap="round" opacity=".45"/>

      <path id="membrane-rim"
        d="M -37,-9 C -39,-27 -22,-37 -1,-37
           C 22,-37 38,-24 37,-4
           C 40,17 25,33 4,36
           C -18,38 -36,25 -37,-9 Z"
        fill="none" stroke="#075D50" stroke-width="2" opacity=".55"/>
    </g>

    <!-- Interior is clipped so organelles stay inside the cell. -->
    <g id="interior" clip-path="url(#cellClip)">

      <ellipse id="cytoplasm"
        cx="0" cy="0" rx="35" ry="32"
        fill="url(#cytoplasmGradient)" opacity=".88"/>

      <!-- Internal fluid streams. -->
      <g id="fluid-streams" fill="none" stroke="#C6FFE2"
         stroke-width="1.5" opacity=".28">
        <path d="M -28,4 C -12,-8 7,-5 24,-17"/>
        <path d="M -25,18 C -7,7 10,12 28,4"/>
        <path d="M -20,-19 C -7,-10 7,-15 18,-7"/>
      </g>

      <!-- Organelles are individually addressable. -->
      <g id="organelles">
        <ellipse id="organelle-1" class="organelle"
          cx="-21" cy="-7" rx="5" ry="3.2"
          fill="#4B8CFF" opacity=".9"/>
        <ellipse id="organelle-2" class="organelle"
          cx="22" cy="-11" rx="4" ry="2.7"
          fill="#B76CFF" opacity=".9"/>
        <ellipse id="organelle-3" class="organelle"
          cx="-17" cy="17" rx="3.6" ry="2.4"
          fill="#FF6FAE" opacity=".9"/>
        <circle id="organelle-4" class="organelle"
          cx="20" cy="16" r="3.3"
          fill="#63E6FF" opacity=".9"/>
        <circle id="organelle-5" class="organelle"
          cx="3" cy="25" r="2.3"
          fill="#FFE16B" opacity=".85"/>
      </g>

      <!-- Nucleus/core is deliberately composed of multiple animated parts. -->
      <g id="nucleus">
        <circle id="nucleus-aura" cx="2" cy="1" r="15"
          fill="#FFC94A" opacity=".22" filter="url(#hardGlow)"/>
        <circle id="nucleus-shell" cx="2" cy="1" r="11.5"
          fill="url(#nucleusGradient)"
          stroke="#FFF1A6" stroke-width="1.5"/>
        <circle id="nucleus-core" cx="4" cy="-1" r="5.2"
          fill="#FFF7C7"/>
        <circle id="nucleus-core-dot" cx="5" cy="-2" r="2"
          fill="#E78B24"/>
      </g>
    </g>

    <!-- Damage overlay is its own animatable component. -->
    <path id="damage-flash"
      class="damage-flash"
      d="M -42,-8 C -45,-30 -25,-43 0,-42 C 27,-42 45,-27 43,-3
         C 47,21 28,40 3,42 C -23,44 -44,29 -42,-8 Z"
      fill="#FFFFFF"/>

    <!-- Tiny surface vesicles make the silhouette less geometric. -->
    <g id="surface-vesicles">
      <circle id="vesicle-1" cx="-31" cy="4" r="2.1" fill="#B8FFE4" opacity=".7"/>
      <circle id="vesicle-2" cx="28" cy="4" r="1.7" fill="#D7FFF0" opacity=".6"/>
      <circle id="vesicle-3" cx="-7" cy="-31" r="1.5" fill="#FFFFFF" opacity=".55"/>
    </g>

  </g>
</svg>

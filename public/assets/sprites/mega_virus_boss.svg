<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="-240 -240 480 480">
<defs>
  <radialGradient id="bgAura" cx="38%" cy="34%">
    <stop offset="0" stop-color="#ffb3c0" stop-opacity=".42"/>
    <stop offset=".55" stop-color="#ff4d6d" stop-opacity=".18"/>
    <stop offset="1" stop-color="#551827" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="flesh" cx="31%" cy="24%" r="78%">
    <stop offset="0" stop-color="#ffd4db"/>
    <stop offset=".24" stop-color="#ff8fa1"/>
    <stop offset=".55" stop-color="#ff4d6d"/>
    <stop offset=".82" stop-color="#a92f4a"/>
    <stop offset="1" stop-color="#4b1322"/>
  </radialGradient>
  <radialGradient id="core" cx="35%" cy="28%">
    <stop offset="0" stop-color="#fff5f7"/>
    <stop offset=".18" stop-color="#ffb3c0"/>
    <stop offset=".5" stop-color="#ff4d6d"/>
    <stop offset=".82" stop-color="#8f263f"/>
    <stop offset="1" stop-color="#3d0d1b"/>
  </radialGradient>
  <linearGradient id="spike" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd4db"/>
    <stop offset=".3" stop-color="#ff8799"/>
    <stop offset=".7" stop-color="#ff4d6d"/>
    <stop offset="1" stop-color="#68172d"/>
  </linearGradient>
  <linearGradient id="vein" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffdce2" stop-opacity=".85"/>
    <stop offset="1" stop-color="#791c34" stop-opacity=".25"/>
  </linearGradient>
  <filter id="blur20" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="blur7" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="blur3" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>
  <style>
    #megaVirus{transform-origin:0 0}
    #megaVirus.state-hit #damage-flash{opacity:1;animation:hit .16s ease-out}
    #megaVirus.state-hit #body-rig{animation:hitBody .16s ease-out}
    #megaVirus.state-critical #critical-cracks{opacity:1}
    #megaVirus.state-critical #spike-ring{animation:orbit 2.2s linear infinite}
    #megaVirus.state-critical #core-rig{animation:criticalCore .42s ease-in-out infinite alternate}
    #megaVirus.state-move #body-rig{animation:move .55s ease-in-out infinite alternate}
    #megaVirus.state-death #body-rig{animation:death 1.2s ease-out forwards}
    #megaVirus.state-death #spike-ring{animation:deathRing 1.2s ease-out forwards}
    #megaVirus.state-telegraph #telegraph-aura{animation:telegraph 1.15s ease-in-out infinite}
    #megaVirus.state-telegraph #core-rig{animation:chargeCore .5s ease-in-out infinite alternate}
    #megaVirus.state-slam #slam-ring{animation:slam .4s cubic-bezier(.1,.7,.2,1) forwards}
    #megaVirus.state-slam #shock-fragments{animation:fragment .4s ease-out forwards}
    @keyframes hit{0%{opacity:0}35%{opacity:.95}100%{opacity:0}}
    @keyframes hitBody{0%{transform:scale(1)}35%{transform:scale(1.07,.94)}100%{transform:scale(1)}}
    @keyframes move{from{transform:rotate(-1deg) translate(-2px,1px)}to{transform:rotate(1deg) translate(2px,-1px)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes criticalCore{from{transform:scale(.95)}to{transform:scale(1.08)}}
    @keyframes death{0%{transform:scale(1);opacity:1}35%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(.18) rotate(18deg);opacity:0}}
    @keyframes deathRing{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5) rotate(22deg);opacity:0}}
    @keyframes telegraph{0%,100%{opacity:.08;transform:scale(.9)}50%{opacity:.65;transform:scale(1.1)}}
    @keyframes chargeCore{from{transform:scale(.92)}to{transform:scale(1.14)}}
    @keyframes slam{0%{transform:scale(.15);opacity:.95}100%{transform:scale(1.55);opacity:0}}
    @keyframes fragment{0%{opacity:0;transform:scale(.2)}30%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
  </style>
</defs>

<g id="megaVirus">

  <ellipse id="aura" cx="0" cy="0" rx="205" ry="198" fill="url(#bgAura)" filter="url(#blur20)"/>
  <ellipse id="telegraph-aura" cx="0" cy="0" rx="166" ry="166" fill="none" stroke="#ffb3c0" stroke-width="12" opacity="0"/>

  <!-- AOE telegraph -->
  <g id="aoe-telegraph">
    <circle cx="0" cy="0" r="126" fill="none" stroke="#ffb3c0" stroke-width="3" stroke-dasharray="7 13" opacity=".5"/>
    <circle cx="0" cy="0" r="143" fill="none" stroke="#ff4d6d" stroke-width="2" stroke-dasharray="2 18" opacity=".35"/>
    <path d="M0,-126 L-17,-101 L17,-101 Z" fill="#ffb3c0" opacity=".65"/>
    <circle id="slam-ring" cx="0" cy="0" r="108" fill="none" stroke="#ffd4db" stroke-width="13" opacity="0"/>
  </g>

  <!-- Secondary outer membrane / crown -->
  <path id="outer-crown" d="M0,-164 C28,-150 53,-151 77,-130 C101,-108 122,-102 132,-72
    C143,-39 162,-17 151,15 C141,45 146,70 119,91 C93,111 84,137 50,139
    C18,142 2,164 -29,151 C-59,138 -85,143 -103,116 C-122,89 -145,77 -139,43
    C-133,10 -151,-12 -138,-41 C-125,-70 -125,-98 -97,-111 C-69,-125 -52,-151 -22,-148 Z"
    fill="#791c34" opacity=".58" stroke="#ff4d6d" stroke-width="3"/>

  <!-- Large independent spike ring -->
  <g id="spike-ring" transform-origin="0 0">
    <g id="spike-01"><path d="M-13,-126 L0,-202 L13,-126 L0,-113 Z" fill="url(#spike)"/></g>
    <g id="spike-02" transform="rotate(30)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
    <g id="spike-03" transform="rotate(60)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
    <g id="spike-04" transform="rotate(90)"><path d="M-13,-126 L0,-202 L13,-126 L0,-113 Z" fill="url(#spike)"/></g>
    <g id="spike-05" transform="rotate(120)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
    <g id="spike-06" transform="rotate(150)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
    <g id="spike-07" transform="rotate(180)"><path d="M-13,-126 L0,-202 L13,-126 L0,-113 Z" fill="url(#spike)"/></g>
    <g id="spike-08" transform="rotate(210)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
    <g id="spike-09" transform="rotate(240)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
    <g id="spike-10" transform="rotate(270)"><path d="M-13,-126 L0,-202 L13,-126 L0,-113 Z" fill="url(#spike)"/></g>
    <g id="spike-11" transform="rotate(300)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
    <g id="spike-12" transform="rotate(330)"><path d="M-12,-124 L0,-190 L12,-124 L0,-112 Z" fill="url(#spike)"/></g>
  </g>

  <g id="body-rig">
    <!-- asymmetric body -->
    <path id="body-shadow" d="M-2,-108 C39,-120 82,-94 104,-57 C126,-20 119,29 101,65
      C81,104 39,122 -7,116 C-52,111 -96,89 -108,47 C-121,4 -111,-44 -82,-74 C-59,-98 -30,-100 -2,-108Z"
      fill="#45101f" opacity=".9"/>

    <path id="body-shape" d="M-7,-118 C34,-124 73,-101 99,-66 C126,-29 120,19 105,56
      C87,100 48,119 4,113 C-42,118 -88,91 -103,49 C-119,5 -108,-42 -80,-74
      C-55,-102 -31,-103 -7,-118Z"
      fill="url(#flesh)" stroke="#701a31" stroke-width="7"/>

    <!-- raised biological plates -->
    <g id="membrane-plates">
      <path d="M-80,-57 C-57,-83 -31,-94 -4,-103 C-17,-77 -18,-50 -38,-30 C-55,-29 -70,-39 -80,-57Z"
        fill="#ff8799" opacity=".34"/>
      <path d="M63,-82 C88,-62 101,-36 105,-6 C83,-19 62,-20 49,-41 C49,-58 54,-70 63,-82Z"
        fill="#7e1e37" opacity=".38"/>
      <path d="M-89,42 C-65,32 -45,39 -33,57 C-34,79 -46,91 -64,96 C-80,83 -90,66 -89,42Z"
        fill="#7e1e37" opacity=".42"/>
      <path d="M48,55 C71,39 92,37 105,45 C95,77 73,99 45,106 C35,88 36,70 48,55Z"
        fill="#ff8799" opacity=".25"/>
    </g>

    <!-- Deep vascular channels -->
    <g id="membrane-ridges" fill="none" stroke="url(#vein)" stroke-linecap="round">
      <path d="M-76,-61 C-48,-50 -42,-30 -51,-5 C-62,24 -55,49 -29,65" stroke-width="8"/>
      <path d="M74,-67 C49,-47 43,-23 57,0 C73,28 68,55 48,74" stroke-width="7"/>
      <path d="M-91,13 C-65,2 -38,11 -25,32 C-13,52 -8,75 14,91" stroke-width="6"/>
      <path d="M13,-99 C8,-72 19,-56 40,-44 C58,-33 64,-15 60,4" stroke-width="5"/>
    </g>

    <!-- abnormal surface nodules -->
    <g id="surface-nodules" fill="#ffb3c0" opacity=".48">
      <path d="M-73,1 l8,-9 11,3 3,10 -8,8 -11,-2z"/>
      <path d="M72,23 l7,-8 10,4 1,10 -8,7 -9,-4z"/>
      <path d="M18,84 l7,-7 10,3 3,9 -8,7 -10,-3z"/>
    </g>

    <path id="body-highlight" d="M-66,-73 C-43,-96 -11,-105 23,-99"
      fill="none" stroke="#ffe9ed" stroke-width="11" stroke-linecap="round" opacity=".65"/>

    <!-- Central rotating biological reactor -->
    <g id="core-rig" transform-origin="0 0">
      <circle id="core-halo" r="71" fill="#ffb3c0" opacity=".22" filter="url(#blur7)"/>
      <circle id="core-shell" r="57" fill="#66182d" stroke="#ffb3c0" stroke-width="5"/>
      <circle id="core" r="46" fill="url(#core)" stroke="#ffd4db" stroke-width="4"/>
      <g id="genome" fill="none" stroke-linecap="round">
        <path d="M-29,-33 C33,-20 33,20 -29,33" stroke="#ffe9ed" stroke-width="7"/>
        <path d="M29,-33 C-33,-20 -33,20 29,33" stroke="#741a32" stroke-width="7"/>
        <path d="M-19,-25 L19,-25 M-24,-8 L24,-8 M-24,9 L24,9 M-19,25 L19,25"
          stroke="#ffb3c0" stroke-width="4" opacity=".7"/>
      </g>
      <circle cx="-14" cy="-17" r="7" fill="#fff" opacity=".9" filter="url(#blur3)"/>
      <circle cx="-14" cy="-17" r="3.5" fill="#fff"/>
    </g>

    <!-- 50% phase damage cracks -->
    <g id="critical-cracks" fill="none" stroke="#ffe9ed" stroke-linecap="round" opacity="0">
      <path d="M-72,-48 L-49,-31 L-54,-7 L-35,8 L-38,30"/>
      <path d="M65,-49 L43,-28 L50,-5 L35,13 L41,37"/>
      <path d="M-51,66 L-28,47 L-7,63 L12,45"/>
      <path d="M54,61 L30,45 L22,23"/>
    </g>
  </g>

  <!-- AOE impact fragments -->
  <g id="shock-fragments" fill="#ffd4db" opacity="0">
    <path d="M0,-128 l-5,-22 10,0z"/>
    <path d="M128,0 l22,-5 0,10z"/>
    <path d="M0,128 l5,22 -10,0z"/>
    <path d="M-128,0 l-22,5 0,-10z"/>
    <path d="M91,-91 l18,-14 -5,22z"/>
    <path d="M91,91 l14,18 -22,-5z"/>
    <path d="M-91,91 l-18,14 5,-22z"/>
    <path d="M-91,-91 l-14,-18 22,5z"/>
  </g>

  <path id="damage-flash" d="M-7,-118 C34,-124 73,-101 99,-66 C126,-29 120,19 105,56
    C87,100 48,119 4,113 C-42,118 -88,91 -103,49 C-119,5 -108,-42 -80,-74
    C-55,-102 -31,-103 -7,-118Z" fill="#fff" opacity="0"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="-90 -90 180 180">
  <defs>
    <radialGradient id="retroGradient" cx="35%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#f5c8ff"/>
      <stop offset="55%" stop-color="#e35bff"/>
      <stop offset="100%" stop-color="#7a2e8f"/>
    </radialGradient>
    <linearGradient id="motionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5c8ff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#f5c8ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#e35bff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="auraBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shimmerBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <style>
      /* Retrovirus — fastest enemy in the roster. Tail-vanes flutter at high
         frequency even at rest to sell speed. Cloak is driven by JS toggling
         .cloak-active (fades body opacity toward .35 AND fades in the
         shimmer overlay — reads as "phasing" not just "more transparent").
         Death is the fastest/sharpest in the roster: a quick directional
         shatter, not a lingering one. No attack state (contact chaser). */
      #retrovirus{transform-origin:0 0}
      #aura{animation:retroAuraPulse 1.1s ease-in-out infinite}
      #body{transform-box:fill-box;transform-origin:center;animation:retroWobble .5s ease-in-out infinite}
      #tail-vane-top{animation:retroVaneTop .18s ease-in-out infinite}
      #tail-vane-bottom{animation:retroVaneBottom .21s ease-in-out infinite}
      .damage-flash{opacity:0;pointer-events:none}
      #cloak-shimmer{opacity:0}

      #retrovirus.state-move #body{animation:retroWobble .28s ease-in-out infinite}
      #retrovirus.state-move #aura{animation:retroAuraPulse .6s ease-in-out infinite}

      #retrovirus.cloak-active #body{animation:retroWobble .5s ease-in-out infinite,retroCloakFade .4s ease-out forwards}
      #retrovirus.cloak-active #cloak-shimmer{animation:retroShimmerIn .4s ease-out forwards,retroShimmerScan 1.2s linear infinite .4s}

      #retrovirus.state-hit #body{animation:retroHit .16s ease-out}
      #retrovirus.state-hit .damage-flash{animation:retroFlash .16s ease-out}

      #retrovirus.state-critical #body{animation:retroCriticalShake .3s ease-in-out infinite}
      #retrovirus.state-critical #tail-vane-top,#retrovirus.state-critical #tail-vane-bottom{animation-duration:.1s}

      #retrovirus.state-death #body{animation:retroShatterBody .32s ease-in forwards}
      #retrovirus.state-death #tail-vane-top{animation:retroShatterVaneTop .32s ease-in forwards}
      #retrovirus.state-death #tail-vane-bottom{animation:retroShatterVaneBottom .32s ease-in forwards}
      #retrovirus.state-death #aura{animation:retroFadeOut .25s ease-out forwards}

      @keyframes retroAuraPulse{0%,100%{opacity:.55;transform:scaleX(1)}50%{opacity:.85;transform:scaleX(1.08)}}
      @keyframes retroWobble{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3.5deg)}}
      @keyframes retroVaneTop{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-10deg)}}
      @keyframes retroVaneBottom{0%,100%{transform:rotate(0deg)}50%{transform:rotate(10deg)}}
      @keyframes retroHit{0%{transform:scale(1)}40%{transform:translate(-2px,0) scale(.85,1.15)}100%{transform:scale(1)}}
      @keyframes retroFlash{0%,100%{opacity:0}25%{opacity:.9}}
      @keyframes retroCriticalShake{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(0,.8px) rotate(-4deg)}}
      @keyframes retroCloakFade{0%{opacity:1}100%{opacity:.35}}
      @keyframes retroShimmerIn{0%{opacity:0}100%{opacity:1}}
      @keyframes retroShimmerScan{0%{transform:translateX(-4px)}100%{transform:translateX(4px)}}
      @keyframes retroShatterBody{0%{transform:scale(1);opacity:1}100%{transform:scale(1.6,.3) translate(20px,0);opacity:0}}
      @keyframes retroShatterVaneTop{0%{transform:rotate(0);opacity:1}100%{transform:rotate(-60deg) translate(-14px,-10px);opacity:0}}
      @keyframes retroShatterVaneBottom{0%{transform:rotate(0);opacity:1}100%{transform:rotate(60deg) translate(-14px,10px);opacity:0}}
      @keyframes retroFadeOut{0%{opacity:1}100%{opacity:0}}
    </style>
  </defs>

  <g id="retrovirus" transform-origin="0 0">

    <!-- Elongated motion-streak aura, biased toward the rear -->
    <path id="aura"
      d="M -67,0
         C -52,-18 -35,-25 -16,-20
         C 0,-17 19,-11 45,-5
         C 57,-2 67,0 74,0
         C 66,5 57,7 45,7
         C 20,10 1,17 -16,21
         C -37,25 -55,17 -67,0 Z"
      fill="url(#motionGradient)" opacity="0.72" filter="url(#auraBlur)"/>

    <!-- Sleek forward-swept dart body -->
    <g id="body" transform-box="fill-box" transform-origin="center">
      <path id="body-shape"
        d="M -30,-14
           L 18,-19
           L 48,0
           L 18,19
           L -30,13
           L -18,4
           L -41,13
           L -31,0
           L -41,-13
           L -18,-4 Z"
        fill="url(#retroGradient)"
        stroke="#7a2e8f"
        stroke-width="2"
        stroke-linejoin="round"/>

      <!-- Narrow upper-edge gloss -->
      <path id="body-highlight"
        d="M -24,-9 L 15,-14 L 37,-1"
        fill="none"
        stroke="#f5c8ff"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.72"/>
    </g>

    <!-- Forked tail vanes -->
    <g id="tail-vanes" transform-box="fill-box" transform-origin="center">
      <g id="tail-vane-top" transform-box="fill-box" transform-origin="right center">
        <path
          d="M -27,-8 L -47,-20 L -38,-5 Z"
          fill="#e35bff" stroke="#7a2e8f" stroke-width="1.5"/>
      </g>
      <g id="tail-vane-bottom" transform-box="fill-box" transform-origin="right center">
        <path
          d="M -27,8 L -47,20 L -38,5 Z"
          fill="#e35bff" stroke="#7a2e8f" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Cloak shimmer: renderer fades this in during phasing -->
    <g id="cloak-shimmer" transform-box="fill-box" transform-origin="center"
       opacity="0" pointer-events="none">
      <path
        d="M -34,-16 L 47,0 L -34,16 Z"
        fill="#f5c8ff" opacity="0.18" filter="url(#shimmerBlur)"/>
      <path d="M -28,-11 L 37,-2" stroke="#ffffff" stroke-width="1.4"
        stroke-linecap="round" opacity="0.48"/>
      <path d="M -31,-4 L 42,5" stroke="#f5c8ff" stroke-width="1.1"
        stroke-linecap="round" opacity="0.38"/>
      <path d="M -28,4 L 35,11" stroke="#ffffff" stroke-width="0.9"
        stroke-linecap="round" opacity="0.3"/>
    </g>

    <!-- Renderer-controlled damage flash -->
    <path id="damage-flash"
      d="M -30,-14
         L 18,-19
         L 48,0
         L 18,19
         L -30,13
         L -18,4
         L -41,13
         L -31,0
         L -41,-13
         L -18,-4 Z"
      fill="#ffffff" opacity="0"/>
  </g>
</svg>
